/* BASICS */

.CodeMirror {
  /* Set height, width, borders, and global font properties here */
  font-family: monospace;
  height: 300px;
  color: black;
  direction: ltr;
}

/* PADDING */

.CodeMirror-lines {
  padding: 4px 0; /* Vertical padding around content */
}
.CodeMirror pre.CodeMirror-line,
.CodeMirror pre.CodeMirror-line-like {
  padding: 0 4px; /* Horizontal padding of content */
}

.CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler {
  background-color: white; /* The little square between H and V scrollbars */
}

/* GUTTER */

.CodeMirror-gutters {
  border-right: 1px solid #ddd;
  background-color: #f7f7f7;
  white-space: nowrap;
}
.CodeMirror-linenumbers {}
.CodeMirror-linenumber {
  padding: 0 3px 0 5px;
  min-width: 20px;
  text-align: right;
  color: #999;
  white-space: nowrap;
}

.CodeMirror-guttermarker { color: black; }
.CodeMirror-guttermarker-subtle { color: #999; }

/* CURSOR */

.CodeMirror-cursor {
  border-left: 1px solid black;
  border-right: none;
  width: 0;
}
/* Shown when moving in bi-directional text */
.CodeMirror div.CodeMirror-secondarycursor {
  border-left: 1px solid silver;
}
.cm-fat-cursor .CodeMirror-cursor {
  width: auto;
  border: 0 !important;
  background: #7e7;
}
.cm-fat-cursor div.CodeMirror-cursors {
  z-index: 1;
}
.cm-fat-cursor .CodeMirror-line::selection,
.cm-fat-cursor .CodeMirror-line > span::selection, 
.cm-fat-cursor .CodeMirror-line > span > span::selection { background: transparent; }
.cm-fat-cursor .CodeMirror-line::-moz-selection,
.cm-fat-cursor .CodeMirror-line > span::-moz-selection,
.cm-fat-cursor .CodeMirror-line > span > span::-moz-selection { background: transparent; }
.cm-fat-cursor { caret-color: transparent; }
@-moz-keyframes blink {
  0% {}
  50% { background-color: transparent; }
  100% {}
}
@-webkit-keyframes blink {
  0% {}
  50% { background-color: transparent; }
  100% {}
}
@keyframes blink {
  0% {}
  50% { background-color: transparent; }
  100% {}
}

/* Can style cursor different in overwrite (non-insert) mode */
.CodeMirror-overwrite .CodeMirror-cursor {}

.cm-tab { display: inline-block; text-decoration: inherit; }

.CodeMirror-rulers {
  position: absolute;
  left: 0; right: 0; top: -50px; bottom: 0;
  overflow: hidden;
}
.CodeMirror-ruler {
  border-left: 1px solid #ccc;
  top: 0; bottom: 0;
  position: absolute;
}

/* DEFAULT THEME */

.cm-s-default .cm-header {color: blue;}
.cm-s-default .cm-quote {color: #090;}
.cm-negative {color: #d44;}
.cm-positive {color: #292;}
.cm-header, .cm-strong {font-weight: bold;}
.cm-em {font-style: italic;}
.cm-link {text-decoration: underline;}
.cm-strikethrough {text-decoration: line-through;}

.cm-s-default .cm-keyword {color: #708;}
.cm-s-default .cm-atom {color: #219;}
.cm-s-default .cm-number {color: #164;}
.cm-s-default .cm-def {color: #00f;}
.cm-s-default .cm-variable,
.cm-s-default .cm-punctuation,
.cm-s-default .cm-property,
.cm-s-default .cm-operator {}
.cm-s-default .cm-variable-2 {color: #05a;}
.cm-s-default .cm-variable-3, .cm-s-default .cm-type {color: #085;}
.cm-s-default .cm-comment {color: #a50;}
.cm-s-default .cm-string {color: #a11;}
.cm-s-default .cm-string-2 {color: #f50;}
.cm-s-default .cm-meta {color: #555;}
.cm-s-default .cm-qualifier {color: #555;}
.cm-s-default .cm-builtin {color: #30a;}
.cm-s-default .cm-bracket {color: #997;}
.cm-s-default .cm-tag {color: #170;}
.cm-s-default .cm-attribute {color: #00c;}
.cm-s-default .cm-hr {color: #999;}
.cm-s-default .cm-link {color: #00c;}

.cm-s-default .cm-error {color: #f00;}
.cm-invalidchar {color: #f00;}

.CodeMirror-composing { border-bottom: 2px solid; }

/* Default styles for common addons */

div.CodeMirror span.CodeMirror-matchingbracket {color: #0b0;}
div.CodeMirror span.CodeMirror-nonmatchingbracket {color: #a22;}
.CodeMirror-matchingtag { background: rgba(255, 150, 0, .3); }
.CodeMirror-activeline-background {background: #e8f2ff;}

/* STOP */

/* The rest of this file contains styles related to the mechanics of
   the editor. You probably shouldn't touch them. */

.CodeMirror {
  position: relative;
  overflow: hidden;
  background: white;
}

.CodeMirror-scroll {
  overflow: scroll !important; /* Things will break if this is overridden */
  /* 50px is the magic margin used to hide the element's real scrollbars */
  /* See overflow: hidden in .CodeMirror */
  margin-bottom: -50px; margin-right: -50px;
  padding-bottom: 50px;
  height: 100%;
  outline: none; /* Prevent dragging from highlighting the element */
  position: relative;
  z-index: 0;
}
.CodeMirror-sizer {
  position: relative;
  border-right: 50px solid transparent;
}

/* The fake, visible scrollbars. Used to force redraw during scrolling
   before actual scrolling happens, thus preventing shaking and
   flickering artifacts. */

/* Layout: planta técnica em papel quadriculado; barra de obra no topo; mapa do percurso em 8 marcos; cada parte da sebenta com a sua cor */
:root{
  --paper:#f2f5f7; --paper-2:#e6edf1; --paper-3:#d8e2e8; --grid:rgba(20,50,74,.055);
  --ink:#14324a; --ink-soft:#4d6779; --ink-faint:#7d93a3; --line:#c4d2dc;
  --card:#ffffff; --cone:#d9581a; --cone-ink:#ffffff; --cone-soft:#fbe5d8;
  --hA:#d9581a; --hB:#1f6fb2; --hC:#c99200; --hD:#2b7a57;
  --ok:#2b7a57; --ok-soft:#dcf0e5; --bad:#c23a2b; --bad-soft:#fbe1dd; --warn:#c99200;
  --lamp:#ffd257; --shadow:0 1px 0 rgba(20,50,74,.06),0 8px 24px -12px rgba(20,50,74,.25);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --cm-bg:#fbfcfd; --cm-gutter:#eef3f6; --cm-tag:#b2470f; --cm-attr:#1f6fb2; --cm-str:#2b7a57; --cm-com:#8a9aa7; --cm-kw:#8a3fb3; --cm-num:#b07d00; --cm-prop:#1f6fb2; --cm-sel:#cfe1f3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1820; --paper-2:#15232d; --paper-3:#1d2f3b; --grid:rgba(150,190,220,.05);
  --ink:#e1eaf0; --ink-soft:#a2b6c4; --ink-faint:#71889a; --line:#2b4252;
  --card:#13202a; --cone:#f07a3c; --cone-ink:#1a0c04; --cone-soft:#3b2417;
  --hA:#f07a3c; --hB:#5aa7e6; --hC:#f0c240; --hD:#5cc293;
  --ok:#5cc293; --ok-soft:#173528; --bad:#ff7a6a; --bad-soft:#3d1d19; --warn:#f0c240;
  --lamp:#ffd257; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  --cm-bg:#101b23; --cm-gutter:#14222c; --cm-tag:#ff9b63; --cm-attr:#7ec0f5; --cm-str:#7fd6a8; --cm-com:#6d8394; --cm-kw:#d29bf2; --cm-num:#f0c240; --cm-prop:#7ec0f5; --cm-sel:#23415a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1820; --paper-2:#15232d; --paper-3:#1d2f3b; --grid:rgba(150,190,220,.05);
  --ink:#e1eaf0; --ink-soft:#a2b6c4; --ink-faint:#71889a; --line:#2b4252;
  --card:#13202a; --cone:#f07a3c; --cone-ink:#1a0c04; --cone-soft:#3b2417;
  --hA:#f07a3c; --hB:#5aa7e6; --hC:#f0c240; --hD:#5cc293;
  --ok:#5cc293; --ok-soft:#173528; --bad:#ff7a6a; --bad-soft:#3d1d19; --warn:#f0c240;
  --lamp:#ffd257; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  --cm-bg:#101b23; --cm-gutter:#14222c; --cm-tag:#ff9b63; --cm-attr:#7ec0f5; --cm-str:#7fd6a8; --cm-com:#6d8394; --cm-kw:#d29bf2; --cm-num:#f0c240; --cm-prop:#7ec0f5; --cm-sel:#23415a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
code,kbd{font-family:var(--f-mono);font-size:.86em;background:var(--paper-2);padding:1px 5px;border-radius:3px}
:focus-visible{outline:3px solid var(--cone);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-soft)}
.eyebrow{font-family:var(--f-display);font-stretch:112%;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;color:var(--cone)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* Barra de topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .topo{background:#0a131a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topo{background:#0a131a}}
.topo .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#f2f5f7}
.marca b{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:25px;letter-spacing:-.01em}
.marca b span{color:#f58a4f}
.faixa{width:30px;height:30px;border-radius:5px;background:repeating-linear-gradient(-45deg,#f58a4f 0 6px,#14324a 6px 12px);box-shadow:inset 0 0 0 2px #f58a4f}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{text-decoration:none;color:#c9d6df;padding:7px 11px;border-radius:6px;font-size:14.5px;font-weight:700}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:rgba(245,138,79,.18);color:#fff;box-shadow:inset 0 -2px 0 #f58a4f}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.estado{font-size:12.5px;color:#c9d6df;display:flex;align-items:center;gap:6px;white-space:nowrap}
.estado i{width:8px;height:8px;border-radius:50%;background:#7fd6a8;display:inline-block}
.estado.local i{background:#f0c240}
.estado.erro i{background:#ff7a6a}
.estado.guardar i{background:#7ec0f5;animation:pulso 1s infinite}
@keyframes pulso{50%{opacity:.3}}
.chip-aluno{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:#fff;font-size:14px}
.avatar{width:28px;height:28px;border-radius:50%;background:#f58a4f;color:#1a0c04;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:7px;padding:8px 15px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .08s,box-shadow .12s}
.btn:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.btn:active{transform:none;box-shadow:none}
.btn.pri{background:var(--cone);border-color:var(--cone);color:var(--cone-ink)}
.btn.pri:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.btn.sm{padding:5px 10px;font-size:13px;border-width:1.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--paper-2);box-shadow:none;transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Cartões e painéis */
.painel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:20px}
main.pagina{padding-block:28px 72px}
.titulo-pag{display:grid;gap:8px;margin-bottom:22px}
.titulo-pag h1{font-size:clamp(34px,5vw,54px);font-stretch:72%;font-weight:800;letter-spacing:-.015em}

/* Início */
.inicio{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:18px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-size:clamp(36px,5.4vw,60px);font-stretch:70%;font-weight:800;letter-spacing:-.02em;line-height:.95}
.hero h1 em{font-style:normal;color:var(--cone)}
.hero .tema{font-size:17px;margin-top:10px}
.stats{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-soft)}
.predio{width:100%;height:auto;max-width:300px;justify-self:center}
.lado-ini{display:grid;gap:22px;align-content:start}
.proximo{display:grid;gap:10px;border-left:5px solid var(--cone)}
.proximo h3{font-size:24px;font-stretch:80%}

.percurso{margin-top:30px;display:grid;gap:16px}
.percurso-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.percurso-head h2{font-size:32px;font-stretch:75%;font-weight:800}
.mapa-fases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative}
.cfase{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:16px;display:grid;gap:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;overflow:hidden;min-height:196px;align-content:start}
.cfase::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--cor)}
.cfase:hover{transform:translateY(-3px)}
.cfase .topo-c{display:flex;justify-content:space-between;align-items:start;gap:8px}
.cfase .num{font-family:var(--f-display);font-weight:800;font-stretch:62%;font-size:54px;line-height:.85;color:var(--cor)}
.cfase h3{font-size:21px;font-stretch:82%}
.cfase .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
.parte{font-family:var(--f-display);font-weight:700;font-stretch:105%;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:color-mix(in srgb,var(--cor) 16%,transparent);color:var(--cor);white-space:nowrap}
.pips{display:flex;gap:5px;margin-top:auto}
.pip{flex:1;height:22px;border-radius:4px;background:var(--paper-2);font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center;color:var(--ink-faint);font-weight:600}
.pip.on{background:var(--cor);color:var(--card)}
.cfase.trancada{cursor:not-allowed;background:var(--paper-2)}
.cfase.trancada > *:not(.cadeado){opacity:.45}
.cadeado{font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;gap:5px;align-items:center}
.carimbo{position:absolute;right:-6px;top:38px;transform:rotate(-12deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:800;font-stretch:90%;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:3px 8px;border-radius:4px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.cfase.especial .esc{position:absolute;right:12px;top:14px}
.tag-esc{font-size:11px;font-weight:700;color:var(--cone);display:inline-flex;gap:4px;align-items:center}

.guardar{display:grid;gap:12px}
.guardar h3{font-size:20px;font-stretch:85%}
.codigo-prog{font-family:var(--f-mono);font-size:11.5px;background:var(--paper-2);border-radius:6px;padding:8px 10px;word-break:break-all;max-height:84px;overflow:auto;border:1px dashed var(--line)}

/* Página da fase */
.fase-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:18px}
.fase-top .num{font-family:var(--f-display);font-weight:800;font-stretch:60%;font-size:96px;line-height:.8;color:var(--cor)}
.fase-top h1{font-size:clamp(32px,5vw,50px);font-stretch:72%;font-weight:800}
.fase-top .obj{color:var(--ink-soft);max-width:68ch;margin-top:6px}
.fase-top .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.fase-top .meta span.m{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.alvara-mini{border:2px solid var(--line);border-radius:8px;padding:10px 14px;text-align:center;font-family:var(--f-display);font-weight:800;font-stretch:85%;color:var(--ink-faint);max-width:170px;line-height:1.15}
.alvara-mini small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.alvara-mini.ganho{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);transform:rotate(-3deg)}

.passos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card);margin-bottom:22px}
.passos button{border:0;background:transparent;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;border-right:2px dashed var(--line);position:relative}
.passos button:last-child{border-right:0}
.passos button .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-soft)}
.passos button b{font-family:var(--f-display);font-stretch:85%;font-size:20px}
.passos button small{font-size:12.5px;color:var(--ink-soft)}
.passos button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.passos button[aria-selected="true"] .n,.passos button[aria-selected="true"] small{color:var(--paper-3)}
.passos button .feito{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700}

.secao{display:grid;gap:16px;align-content:start}
.secao-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.secao-head h2{font-size:28px;font-stretch:78%;font-weight:800}
.lista-check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lista-check li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.marca-c{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--line);color:var(--ink-faint);margin-top:1px}
.marca-c.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.marca-c.no{background:var(--bad);border-color:var(--bad);color:var(--card)}

/* Editor */
.editor-area{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ed{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--cm-bg);display:flex;flex-direction:column;min-width:0}
.ed-tabs{display:flex;gap:2px;background:var(--paper-2);padding:6px 6px 0;overflow-x:auto;flex:none}
.ed-tabs button{border:0;background:transparent;padding:7px 12px;border-radius:6px 6px 0 0;font-family:var(--f-mono);font-size:12.5px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.ed-tabs button[aria-selected="true"]{background:var(--cm-bg);color:var(--ink);font-weight:600}
.cmwrap{flex:1;min-height:300px;position:relative}
.cmwrap .CodeMirror{height:100%;min-height:300px;position:absolute;inset:0}
.cmwrap textarea.fallback{width:100%;height:100%;min-height:300px;border:0;padding:12px;font-family:var(--f-mono);font-size:13.5px;background:var(--cm-bg);resize:vertical}
.prev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;min-width:0}
.prev-bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--paper-2);font-size:12.5px;flex-wrap:wrap}
.prev-bar .dots{display:flex;gap:4px}
.prev-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.prev-bar .url{flex:1;min-width:80px;font-family:var(--f-mono);background:var(--card);border-radius:5px;padding:3px 9px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-body{flex:1;background:repeating-conic-gradient(var(--paper-2) 0 25%,var(--paper) 0 50%) 0 0/16px 16px;display:flex;justify-content:center;overflow:auto;min-height:300px}
.prev-body iframe{border:0;background:#fff;width:100%;min-height:300px;height:100%;display:block;color-scheme:light}
.prev-body.movel iframe{width:360px;flex:none;box-shadow:0 0 0 1px var(--line)}
.consola{border-top:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:12px;max-height:110px;overflow:auto}
.consola div{padding:5px 10px;border-bottom:1px solid var(--paper-2);color:var(--bad)}
.consola .vazia{color:var(--ink-faint)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* CodeMirror */
.CodeMirror{font-family:var(--f-mono);font-size:13.5px;background:var(--cm-bg);color:var(--ink);line-height:1.6}
.CodeMirror-gutters{background:var(--cm-gutter);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--ink-faint)}
.CodeMirror-cursor{border-left:2px solid var(--cone)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--cm-sel)!important}
.cm-s-ew .cm-tag{color:var(--cm-tag);font-weight:600}
.cm-s-ew .cm-attribute{color:var(--cm-attr)}
.cm-s-ew .cm-string{color:var(--cm-str)}
.cm-s-ew .cm-comment{color:var(--cm-com);font-style:italic}
.cm-s-ew .cm-keyword{color:var(--cm-kw);font-weight:600}
.cm-s-ew .cm-number{color:var(--cm-num)}
.cm-s-ew .cm-property{color:var(--cm-prop)}
.cm-s-ew .cm-qualifier,.cm-s-ew .cm-builtin{color:var(--cm-tag)}
.cm-s-ew .cm-def,.cm-s-ew .cm-variable-2{color:var(--cm-attr)}
.cm-s-ew .cm-atom{color:var(--cm-num)}
.cm-s-ew .cm-bracket{color:var(--ink-faint)}
.cm-s-ew .cm-error{color:var(--bad)}

/* Quiz */
.quiz{display:grid;gap:16px}
.quiz-prog{display:flex;gap:6px}
.quiz-prog i{flex:1;height:7px;border-radius:4px;background:var(--paper-3)}
.quiz-prog i.c{background:var(--ok)}
.quiz-prog i.e{background:var(--bad)}
.quiz-prog i.a{background:var(--cone)}
.pergunta{font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:23px;line-height:1.2}
.code-bloco{font-family:var(--f-mono);font-size:13.5px;background:var(--cm-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre;overflow-x:auto;color:var(--ink)}
.opcoes{display:grid;gap:9px}
.opcao{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:9px;padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:15px}
.opcao .l{flex:none;width:26px;height:26px;border-radius:6px;background:var(--paper-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.opcao:hover:not([disabled]){border-color:var(--ink)}
.opcao.mono span:last-child{font-family:var(--f-mono);font-size:13.5px}
.opcao.certa{border-color:var(--ok);background:var(--ok-soft)}
.opcao.certa .l{background:var(--ok);color:var(--card)}
.opcao.errada{border-color:var(--bad);background:var(--bad-soft)}
.opcao.errada .l{background:var(--bad);color:var(--card)}
.opcao[disabled]{cursor:default}
.explica{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
.explica.mal{border-color:var(--bad);background:var(--bad-soft)}
.resultado-quiz{text-align:center;display:grid;gap:10px;justify-items:center;padding:20px}
.resultado-quiz b{font-family:var(--f-display);font-stretch:65%;font-weight:800;font-size:72px;line-height:1}

/* Pistas */
.pistas{display:grid;gap:8px}
.pista{border:1.5px dashed var(--warn);border-radius:8px;padding:9px 12px;font-size:14.5px;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.pista b{font-family:var(--f-display);font-stretch:90%;margin-right:6px}

/* Vistoria */
.vist-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.caderno-box textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:8px;padding:12px;background:repeating-linear-gradient(var(--card) 0 27px,var(--paper-2) 27px 28px);line-height:28px;resize:vertical}
.contador{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft)}
.esc-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:2px solid var(--cone);background:var(--cone-soft);border-radius:10px;padding:14px 16px}
.esc-card .porta{width:44px;height:58px;border:3px solid var(--cone);border-bottom:0;border-radius:22px 22px 0 0;position:relative;background:var(--card)}
.esc-card .porta::after{content:"";position:absolute;right:7px;top:30px;width:6px;height:6px;border-radius:50%;background:var(--cone)}
.esc-card.feito{border-color:var(--ok);background:var(--ok-soft)}
.esc-card.feito .porta{border-color:var(--ok)}
.carimbo-grande{display:grid;place-items:center;text-align:center;padding:26px;border:4px double var(--ok);border-radius:12px;color:var(--ok);transform:rotate(-2deg);background:var(--ok-soft);animation:carimbar .5s cubic-bezier(.2,1.6,.4,1)}
.carimbo-grande b{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
@keyframes carimbar{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.carimbo-grande{animation:none}}

/* Plantas */
.planta-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.missoes{display:grid;gap:8px}
.missao{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-size:14.5px}
.missao.atual{border-color:var(--cone);box-shadow:inset 4px 0 0 var(--cone)}
.missao.feita{border-color:var(--ok);background:var(--ok-soft)}
.bloco-pal{display:flex;gap:8px;flex-wrap:wrap}
.bloco{border:0;border-radius:7px;padding:8px 12px;font-family:var(--f-mono);font-size:13px;font-weight:600;cursor:pointer;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bloco:active{transform:translateY(2px);box-shadow:none}
.b-h1{background:#c2410c}.b-h2{background:#d9581a}.b-p{background:#1f6fb2}.b-ul{background:#2b7a57}.b-img{background:#8a3fb3}.b-a{background:#0e7490}
.pilha{display:grid;gap:6px;min-height:200px;padding:12px;border:2px dashed var(--line);border-radius:10px;background:var(--paper)}
.peca{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:8px;padding:6px 8px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.peca .tag{font-family:var(--f-mono);font-size:12px;font-weight:700;background:rgba(0,0,0,.2);padding:3px 7px;border-radius:5px}
.peca input{width:100%;border:0;border-radius:5px;padding:5px 8px;background:rgba(255,255,255,.92);color:#14324a;font-size:13.5px;min-width:0}
.peca .acoes{display:flex;gap:2px}
.peca .acoes button{border:0;background:rgba(0,0,0,.18);color:#fff;width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:12px}
.peca.mal{outline:3px solid var(--bad);outline-offset:2px}
.peca .campos{display:grid;gap:4px}
.vazio{color:var(--ink-faint);font-size:14px;text-align:center;align-self:center}
.toggles{display:grid;gap:8px}
.toggle{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card);font-size:14.5px}
.toggle input{width:18px;height:18px;accent-color:var(--cone)}
.toggle code{flex:none}
.zonas{display:grid;gap:8px}
.zona{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--card)}
.zona select{padding:6px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:13px}
.zona.certa{border-color:var(--ok)}
.zona.errada{border-color:var(--bad)}
.wire{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.wire div{border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--f-mono);border:2px dashed var(--line);color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.wire .w-meio{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:6px;border:0;padding:0}
.wire .w-meio > div{min-height:110px;align-items:start}
.sel-input{display:flex;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;background:var(--cm-bg)}
.sel-input input{flex:1;border:0;background:transparent;font-family:var(--f-mono);font-size:16px;outline:none;min-width:0}
.sel-input span{font-family:var(--f-mono);color:var(--ink-faint)}
.mini-site{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1b2b38;font-family:Arial,sans-serif;font-size:14px;display:grid;gap:8px}
.mini-site *{transition:background .15s, outline-color .15s}
.mini-site .pintado{background:#ffd9c2!important;outline:2px solid #d9581a;outline-offset:1px;border-radius:3px}
.mini-site nav{display:flex;gap:12px}
.mini-site nav a{color:#1f6fb2}
.mini-site ul{margin:0;padding-left:20px}
.caixa-medida{display:grid;place-items:center;padding:18px;background:var(--paper);border-radius:10px;border:1px solid var(--line);overflow:auto}
.cm-margin{background:repeating-linear-gradient(45deg,#fbe5d8 0 6px,#fdf1ea 6px 12px);position:relative}
.cm-border{background:#d9581a}
.cm-padding{background:#cfe9db}
.cm-content{background:#cfe1f3;color:#14324a;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;min-height:46px}
.slider{display:grid;grid-template-columns:110px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:14px}
.slider input[type=range]{width:100%;accent-color:var(--cone)}
.slider output{font-family:var(--f-mono);font-size:13px;text-align:right}
.total{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:28px}
.sala{border:3px solid var(--ink);border-radius:6px;min-height:200px;background:linear-gradient(var(--paper) 0 0);padding:8px;transition:all .25s;position:relative}
.sala::after{content:"";position:absolute;inset:auto 0 0;height:8px;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 22px);pointer-events:none}
.movel{font-size:34px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px;line-height:1;display:grid;place-items:center;transition:all .25s}
.controlo{display:grid;gap:4px;font-size:13px;align-content:start}
.controlo select{padding:6px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:13px}
.controlos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.galeria-demo{display:grid;transition:all .25s;border:3px solid var(--ink);border-radius:6px;padding:8px;background:var(--paper)}
.galeria-demo div{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:16px 4px;text-align:center;font-size:22px}
.galeria-demo .dest{background:var(--cone-soft);border-color:var(--cone)}
.regua{display:grid;gap:10px}
.regua .barra-l{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;flex-wrap:wrap}
.regua .barra-l b{font-family:var(--f-display);font-stretch:70%;font-size:30px}
.regua-frame{background:repeating-conic-gradient(var(--paper-2) 0 25%,var(--paper) 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:10px;overflow:auto;padding:10px;height:300px}
.regua-frame iframe{border:0;background:#fff;height:278px;display:block;box-shadow:0 0 0 2px var(--ink);transition:box-shadow .2s}
.regua-frame iframe.parte{box-shadow:0 0 0 3px var(--bad)}
.blocos-js{display:grid;gap:10px}
.bjs{border-radius:10px;padding:10px 12px;color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:14.5px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bjs select,.bjs input{border:0;border-radius:6px;padding:5px 8px;background:rgba(255,255,255,.94);color:#14324a;font-family:var(--f-mono);font-size:13px;min-width:0}
.bjs input{flex:1;min-width:120px}
.bjs.quando{background:#c99200;border-radius:14px 14px 10px 10px}
.bjs.se{background:#1f6fb2;margin-left:18px}
.bjs.faz{background:#2b7a57;margin-left:18px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-size:14.5px}
.req .seg button{padding:4px 9px}

/* Escape room */
.portas{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.porta-s{border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:0;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.porta-s .p{width:58px;height:78px;border:3px solid var(--ink);border-bottom:0;border-radius:29px 29px 0 0;background:var(--card);position:relative;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;transition:all .3s}
.porta-s .p::after{content:"";position:absolute;right:9px;top:42px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.porta-s.aberta .p{background:var(--ok);border-color:var(--ok);color:var(--card)}
.porta-s.aberta .p::after{display:none}
.porta-s.atual .p{border-color:var(--cone);box-shadow:0 0 0 4px var(--cone-soft)}
.porta-s.fechada{opacity:.45;cursor:not-allowed}
.porta-s.saida .p{border-style:dashed}
.cadeado-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--paper)}
.cadeado-box input{width:64px;height:52px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:30px;border-radius:8px;border:3px solid var(--paper-3);background:var(--paper);color:var(--ink)}
.cadeado-box .msg{font-size:14px}
.abanar{animation:abanar .4s}
@keyframes abanar{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.historia{font-size:17px;max-width:72ch}

/* Caderno */
.caderno-lista{display:grid;gap:14px}
.entrada{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:16px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.entrada .num{font-family:var(--f-display);font-weight:800;font-stretch:60%;font-size:52px;line-height:.85;color:var(--cor)}
.entrada p.t{white-space:pre-wrap;background:repeating-linear-gradient(transparent 0 25px,var(--paper-2) 25px 26px);line-height:26px}

/* Fiscal */
.tabela-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.fiscal{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
table.fiscal th,table.fiscal td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.fiscal th{font-family:var(--f-display);font-stretch:90%;font-size:13px;background:var(--paper-2)}
table.fiscal tr:last-child td{border-bottom:0}
table.fiscal tbody tr{cursor:pointer}
table.fiscal tbody tr:hover{background:var(--paper)}
.alv-dots{display:flex;gap:3px}
.alv-dots i{width:16px;height:16px;border-radius:4px;background:var(--paper-3);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:var(--card)}
.alv-dots i.on{background:var(--ok)}
.alv-dots i.meio{background:var(--warn)}
.num-t{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* Modal e avisos */
.modal-fundo{position:fixed;inset:0;background:rgba(10,20,28,.55);z-index:80;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:24px;display:grid;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:calc(100vh - 32px);overflow:auto}
.modal.largo{max-width:860px}
.modal h2{font-size:30px;font-stretch:75%;font-weight:800}
.campo{display:grid;gap:5px;font-size:14px;font-weight:700}
.campo input,.campo textarea,.campo select{font-weight:400;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.campo small{font-weight:400;color:var(--ink-soft)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;justify-items:end}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;box-shadow:var(--shadow);max-width:340px;animation:entrar .25s}
@keyframes entrar{from{transform:translateY(10px);opacity:0}}
canvas.confetis{position:fixed;inset:0;pointer-events:none;z-index:95}
.nota{border-left:4px solid var(--hB);background:color-mix(in srgb,var(--hB) 9%,transparent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
.rodape{margin-top:40px;padding-block:18px;border-top:2px solid var(--ink);font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:1000px){
  .inicio{grid-template-columns:1fr}
  .mapa-fases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .editor-area,.planta-grid,.vist-grid{grid-template-columns:1fr}
}
@media (max-width:680px){
  .hero{grid-template-columns:1fr}
  .predio{max-width:240px}
  .fase-top{grid-template-columns:auto minmax(0,1fr)}
  .fase-top .alvara-mini{grid-column:1/-1;justify-self:start}
  .fase-top .num{font-size:70px}
  .passos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .passos button:nth-child(2){border-right:0}
  .passos button:nth-child(-n+2){border-bottom:2px dashed var(--line)}
  .passos button small{display:none}
  .topo .wrap{gap:8px}
  .estado span{display:none}
  .controlos{grid-template-columns:1fr}
  .zona{grid-template-columns:1fr}
}
@media (max-width:460px){
  .mapa-fases{grid-template-columns:1fr}
  .cfase{min-height:0}
  .slider{grid-template-columns:90px minmax(0,1fr) 54px}
  .esc-card{grid-template-columns:auto minmax(0,1fr)}
  .esc-card > :last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.leg{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;min-height:0;border:1px solid var(--line)}
input[type=range]{accent-color:var(--cone)}
@media (max-width:680px){
  .topo{position:relative;top:0}
  .topo .wrap{min-height:0}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}
  .nav a{white-space:nowrap}
  .marca b{font-size:22px}
}

.arranque{min-height:70vh;display:grid;place-items:center;text-align:center;font-family:var(--f-display);color:var(--ink-soft)}
.arranque b{display:block;font-stretch:70%;font-size:42px;color:var(--ink)}
</style>
</head>

/* Ajudas para as verificações. Cada verificação recebe um contexto (ctx)
   com o documento renderizado e devolve true/false (pode ser assíncrona). */
const $ = (d, s) => d ? d.querySelector(s) : null;
const $$ = (d, s) => d ? Array.from(d.querySelectorAll(s)) : [];
const txt = el => (el && el.textContent || '').replace(/\s+/g, ' ').trim();
const visivel = el => {
  if (!el) return false;
  const w = el.ownerDocument.defaultView, r = el.getBoundingClientRect();
  const s = w.getComputedStyle(el);
  return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none' && parseFloat(s.opacity) > 0.05;
};
const cs = el => el.ownerDocument.defaultView.getComputedStyle(el);
const srcOrig = i => i.getAttribute('data-original') || i.getAttribute('src');
const relativo = u => !!u && !/^([a-z]+:|\/|\\)/i.test(u.trim());
const lum = c => { const m = (c || '').match(/[\d.]+/g); if (!m) return 1; const [r, g, b] = m.slice(0, 3).map(v => { v = v / 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const fundo = el => { let e = el; while (e) { const b = cs(e).backgroundColor; if (b && !/rgba\(0, 0, 0, 0\)|transparent/.test(b)) return b; e = e.parentElement; } return 'rgb(255, 255, 255)'; };
const rotulado = (d, el) => {
  if (el.closest('label')) return true;
  return !!(el.id && d.querySelector('label[for="' + el.id + '"]')) || !!el.getAttribute('aria-label');
};
const campos = d => $$(d, 'input, select, textarea').filter(e => !/^(submit|button|hidden|reset|image)$/i.test(e.type || ''));
const semOverflow = d => d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1;
const temClique = async (ctx, el) => { const antes = ctx.doc.documentElement.outerHTML; el.click(); await new Promise(r => setTimeout(r, 60)); return ctx.doc.documentElement.outerHTML !== antes; };

function confetis() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetis'; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext('2d');
  const cores = ['#d9581a', '#1f6fb2', '#f0c240', '#2b7a57', '#ffffff'];
  const ps = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 3, c: cores[Math.floor(Math.random() * cores.length)], a: Math.random() * 6 }));
  let t = 0;
  (function f() { x.clearRect(0, 0, W, H); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .99; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); }); if (++t < 110) requestAnimationFrame(f); else c.remove(); })();
}

/* ----------------------------- Editor ------------------------------ */
const MODOS = { html: 'htmlmixed', css: 'css', js: 'javascript' };
const modoDe = nome => /\.css$/.test(nome) ? 'css' : /\.js$/.test(nome) ? 'js' : 'html';
function Editor({ value, onChange, modo = 'html', readOnly = false, altura = 340 }) {
  const ref = useRef(null), cm = useRef(null), cb = useRef(onChange);
  cb.current = onChange;
  useEffect(() => {
    if (!window.CodeMirror || !ref.current) return;
    const ed = window.CodeMirror(ref.current, {
      value: value || '', mode: MODOS[modo], theme: 'ew', lineNumbers: true, tabSize: 2, indentUnit: 2, lineWrapping: true,
      readOnly: readOnly ? 'nocursor' : false, extraKeys: { Tab: c => c.execCommand('insertSoftTab') }
    });
    ed.on('change', (c, ch) => { if (ch.origin !== 'setValue') cb.current && cb.current(c.getValue()); });
    cm.current = ed;
    const el = ref.current;
    let ro = null, lw = 0;
    if (window.ResizeObserver) { ro = new ResizeObserver(en => { const w = en[0].contentRect.width; if (w > 0 && w !== lw) { lw = w; ed.refresh(); } }); ro.observe(el); }
    return () => { if (ro) ro.disconnect(); cm.current = null; if (el) el.innerHTML = ''; };
  }, []);
  useEffect(() => { const c = cm.current; if (c && c.getValue() !== (value || '')) c.setValue(value || ''); }, [value]);
  if (!window.CodeMirror) return html`<div className="cmwrap" style=${{ height: altura }}><textarea className="fallback" spellCheck="false" readOnly=${readOnly} value=${value} onChange=${e => onChange && onChange(e.target.value)}></textarea></div>`;
  return html`<div className="cmwrap" style=${{ height: altura }} ref=${ref}></div>`;
}
function Preview({ src, movel = false, url = 'pagina.html', consola = true, onNav, altura = 340, largura, barra }) {
  const ref = useRef(null);
  const token = useMemo(() => 'ew' + Math.random().toString(36).slice(2), []);
  const [erros, setErros] = useState([]);
  const navRef = useRef(onNav); navRef.current = onNav;
  useEffect(() => {
    const h = e => { const d = e.data; if (!d || d.ew !== token) return; if (d.tipo === 'erro') setErros(x => x.length > 20 ? x : [...x, d.msg]); if (d.tipo === 'nav') { if (navRef.current) navRef.current(d.href); else avisar('Nesta pré-visualização as ligações não abrem.'); } };
    addEventListener('message', h); return () => removeEventListener('message', h);
  }, [token]);
  useEffect(() => {
    const t = setTimeout(() => { setErros([]); if (ref.current) ref.current.srcdoc = injeta(src || '', instrumento(token)); }, 320);
    return () => clearTimeout(t);
  }, [src, token]);
  const w = largura || (movel ? 360 : null);
  return html`<div className="prev">
    <div className="prev-bar"><span className="dots"><i></i><i></i><i></i></span><span className="url">${url}</span>${barra}</div>
    <div className=${cls('prev-body', w && 'movel')} style=${{ height: altura }}><iframe ref=${ref} title="Pré-visualização" style=${w ? { width: w + 'px' } : null}></iframe></div>
    ${consola && html`<div className="consola" aria-label="Consola">${erros.length ? erros.map((m, i) => html`<div key=${i}>✖ ${m}</div>`) : html`<div className="vazia">Consola: sem erros</div>`}</div>`}

}

/* ------------------------------ Quiz ------------------------------- */
function baralha(n) { const a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function Quiz({ perguntas, registo, onFim }) {
  const [i, setI] = useState(0), [esc_, setEsc] = useState(null), [resp, setResp] = useState([]), [tent, setTent] = useState(0);
  const ordem = useMemo(() => perguntas.map(q => baralha(q.ops.length)), [tent]);
  const fim = i >= perguntas.length;
  const certas = resp.filter(Boolean).length;
  if (fim) {
    const passou = certas >= perguntas.length - 1;
    return html`<div className="painel resultado-quiz">
      <span className="eyebrow">Resultado</span><b>${certas}/${perguntas.length}</b>
      <p>${passou ? 'Muito bem! O andaime aguenta.' : 'Precisas de pelo menos ' + (perguntas.length - 1) + ' respostas certas. Revê as explicações e tenta outra vez.'}</p>
      ${registo && registo.melhor != null && html`<p className="muted">Melhor resultado: ${Math.max(registo.melhor, certas)}/${perguntas.length}</p>`}
      <button className="btn" onClick=${() => { setI(0); setEsc(null); setResp([]); setTent(t => t + 1); }}>Repetir o quiz</button>
    </div>`;
  }
  const q = perguntas[i], ord = ordem[i], respondida = esc_ != null;
  const escolher = k => { if (respondida) return; setEsc(k); const ok = k === q.c; const nr = [...resp, ok]; setResp(nr); };
  const seguinte = () => { const ni = i + 1; setEsc(null); setI(ni); if (ni >= perguntas.length) { const c = resp.filter(Boolean).length; onFim(c, c >= perguntas.length - 1); } };
  return html`<div className="quiz painel pad">
    <div className="quiz-prog" aria-label=${'Pergunta ' + (i + 1) + ' de ' + perguntas.length}>${perguntas.map((_, k) => html`<i key=${k} className=${k < resp.length ? (resp[k] ? 'c' : 'e') : k === i ? 'a' : ''}></i>`)}</div>
    <span className="eyebrow">Pergunta ${i + 1} de ${perguntas.length}</span>
    <p className="pergunta">${q.p}</p>
    ${q.code && html`<div className="code-bloco">${q.code}</div>`}
    <div className="opcoes">${ord.map((k, j) => html`<button key=${k} disabled=${respondida} onClick=${() => escolher(k)}
      className=${cls('opcao', q.mono && 'mono', respondida && k === q.c && 'certa', respondida && k === esc_ && k !== q.c && 'errada')}>
      <span className="l">${'ABCD'[j]}</span><span>${q.ops[k]}</span></button>`)}</div>
    ${respondida && html`<div className=${cls('explica', esc_ !== q.c && 'mal')}><b>${esc_ === q.c ? 'Certo! ' : 'Ainda não. '}</b>${q.exp}</div>`}
    ${respondida && html`<div><button className="btn pri" onClick=${seguinte}>${i + 1 < perguntas.length ? 'Pergunta seguinte →' : 'Ver resultado'}</button></div>`}
  </div>`;
}

/* ----------------------------- Desafio ----------------------------- */
function Desafio({ F, p, atualiza }) {
  const des = F.desafio, chave = 'd' + F.n, f = fp(p, F.n);
  const inicial = { html: des.html, css: des.css || '', js: des.js || '' };
  const cod = { ...inicial, ...(p.codigo[chave] || {}) };
  const abas = ['html', 'css', 'js'].filter(k => k === 'html' || des[k] != null);
  const [aba, setAba] = useState('html');
  const [res, setRes] = useState(null), [aVer, setAVer] = useState(false);
  const muda = (k, v) => atualiza(q => { q.codigo[chave] = { ...cod, [k]: v }; });
  const verificar = async () => {
    setAVer(true); const r = await verificaDesafio(des, cod); setRes(r); setAVer(false);
    const ok = r.every(x => x.ok);
    atualiza(q => { const x = fp(q, F.n); x.tentativas = (x.tentativas || 0) + 1; if (ok) x.desafio = true; q.fases[F.n] = x; });
    if (ok) { avisar('Desafio resolvido!'); if (!f.desafio) confetis(); }
  };
  const nomes = { html: 'index.html', css: 'estilo.css', js: 'script.js' };
  return html`<div className="secao">
    <div className="secao-head"><div><span className="eyebrow">Desafio de código</span><h2>${des.titulo}</h2></div>${f.desafio && html`<span className="parte" style=${{ '--cor': 'var(--ok)' }}>✓ Resolvido</span>`}</div>
    <p className="muted" style=${{ maxWidth: '75ch' }}>${des.enunciado}</p>
    <div className="editor-area">
      <div className="ed"><div className="ed-tabs" role="tablist">${abas.map(k => html`<button key=${k} role="tab" aria-selected=${aba === k} onClick=${() => setAba(k)}>${nomes[k]}</button>`)}</div>
        ${abas.map(k => html`<div key=${k} hidden=${aba !== k}><${Editor} value=${cod[k]} modo=${k} onChange=${v => muda(k, v)} /></div>`)}</div>
      <${Preview} src=${docDesafio(cod.html, cod.css, cod.js)} url="desafio.html" largura=${des.largura} />
    </div>
    <div className="row"><button className="btn pri" onClick=${verificar} disabled=${aVer}>${aVer ? 'A verificar…' : 'Verificar o código'}</button>
      <button className="btn ghost sm" onClick=${() => atualiza(q => { q.codigo[chave] = { ...inicial }; })}>Repor o código inicial</button></div>
    ${res && html`<div className="painel pad"><${ListaRes} res=${res} /></div>`}
    <${Pistas} pistas=${des.pistas} usadas=${Math.min(f.pistasD || 0, 3)} onUsar=${() => atualiza(q => { const x = fp(q, F.n); x.pistasD = (x.pistasD || 0) + 1; x.pistas = (x.pistas || 0) + 1; q.fases[F.n] = x; })} />
  </div>`;
}

function useConcluir(todas, feito, concluir) { useEffect(() => { if (todas && !feito) concluir(); }, [todas]); }

/* 1 · Blocos */
const NOVOS = { h1: { texto: 'Clube de Fotografia' }, h2: { texto: 'Próximas saídas' }, p: { texto: 'Um parágrafo sobre o clube.' }, ul: { texto: 'Retrato; Paisagem' }, img: { texto: '' }, a: { texto: 'Visita a DGE', href: 'https://www.dge.mec.pt' } };
function codigoBlocos(pecas) {
  return pecas.map(b => {
    if (b.tipo === 'ul') return '<ul>\n' + b.texto.split(';').map(s => s.trim()).filter(Boolean).map(s => '  <li>' + esc(s) + '</li>').join('\n') + '\n</ul>';
    if (b.tipo === 'img') return '<img src="imagens/foto.jpg" alt="' + esc(b.texto) + '">';
    if (b.tipo === 'a') return '<a href="' + esc(b.href) + '" target="_blank">' + esc(b.texto) + '</a>';
    return '<' + b.tipo + '>' + esc(b.texto) + '</' + b.tipo + '>';
  }).join('\n');
}
function PlantaBlocos({ feito, concluir }) {

  const set = (i, k, v) => setPecas(x => x.map((b, j) => j === i ? { ...b, [k]: v } : b));
  const tira = i => setPecas(x => x.filter((_, j) => j !== i));
  const h1s = pecas.filter(b => b.tipo === 'h1').length;
  const m = [
    { t: 'O título principal (h1) é o primeiro bloco da página', ok: pecas[0] && pecas[0].tipo === 'h1' },

              : html`<input aria-label=${'Texto do ' + b.tipo} value=${b.texto} onChange=${e => set(i, 'texto', e.target.value)} />`}</div>
          <span className="acoes"><button aria-label="Subir" onClick=${() => mexe(i, -1)}>▲</button><button aria-label="Descer" onClick=${() => mexe(i, 1)}>▼</button><button aria-label="Retirar" onClick=${() => tira(i)}>✕</button></span>

// 2. Ouvir
${alvo}.addEventListener("${ev}", function () {
  // 3. Alterar
${cond ? `  if (${cond}) {\n    ${acao}\n  }` : '  ' + acao}
});`;
}

function Escape({ id, p, atualiza }) {
  const ER = ESCAPES[id], st = p.escape[id] || { abertas: {}, pistas: {}, codigo: {} };
  const abertas = st.abertas || {};

  const setSt = fn => atualiza(q => { const x = { abertas: {}, pistas: {}, codigo: {}, ...(q.escape[id] || {}) }; fn(x); q.escape[id] = x; });
  useEffect(() => { setDig(''); setMsg(''); }, [sala]);
  const abrir = async () => {
    if (abertas[sala]) { setMsg('Esta porta já está aberta.'); return; }
    setAVer(true);
    const ok = await verificaSala(S, ER.largura, cod);
    setAVer(false);
    const certo = dig.trim() === S.segredo;
    if (ok && certo) {
      setSt(x => { x.abertas = { ...x.abertas, [sala]: Date.now() }; if (Object.keys(x.abertas).length === ER.salas.length && !x.fim) x.fim = Date.now(); });
      setMsg('🔓 A porta abriu!');
      const fimAgora = Object.keys(abertas).length + 1 === ER.salas.length;
      if (fimAgora) { confetis(); avisar('Escapaste da sala!'); } else { setTimeout(() => setSala(s => { const n = ER.salas.findIndex((_, i) => i !== s && !abertas[i]); return n < 0 ? s : n; }), 900); }
    } else {
      setAbana(true); setTimeout(() => setAbana(false), 450);
      setMsg(!certo ? 'O cadeado não abre. Esse não é o algarismo.' : 'O algarismo está certo, mas a página ainda está partida. Repara o código primeiro.');
    }
  };
  const fim = !!st.fim;
  return html`<div className="secao">
    <div><span className="eyebrow">Escape room · ${ER.parte} · fase ${ER.fase}</span><h1 style=${{ fontSize: 'clamp(34px,5vw,52px)', fontStretch: '72%', fontWeight: 800 }}>${ER.titulo}</h1><p className="historia muted" style=${{ marginTop: 8 }}>${ER.historia}</p></div>

      <span className=${cls('porta-s', 'saida', fim && 'aberta')}><span className="p">${fim ? '★' : '⟶'}</span>Saída</span></div>
    ${fim && html`<div className="carimbo-grande"><span className="eyebrow">Escape room concluída</span><b>Saíste da sala!</b><span>Código final: ${ER.salas.map(s => s.segredo).join(' · ')}</span><a className="btn" style=${{ marginTop: 12 }} href=${'#fase-' + ER.fase}>Voltar à vistoria da fase ${ER.fase}</a></div>`}
    <div className="painel pad secao">
      <div className="secao-head"><div><span className="eyebrow">Sala ${sala + 1} de ${ER.salas.length}</span><h2>${S.titulo}</h2></div>${abertas[sala] && html`<span className="parte" style=${{ '--cor': 'var(--ok)' }}>🔓 Aberta</span>`}</div>
      <p>${S.missao}</p>
      <div className="editor-area">
        <div className="ed"><div className="ed-tabs"><button aria-selected="true">sala${sala + 1}.html</button></div><${Editor} key=${id + sala} value=${cod} onChange=${v => setSt(x => { x.codigo = { ...(x.codigo || {}), [sala]: v }; })} /></div>
        <${Preview} src=${cod} url=${'sala' + (sala + 1) + '.html'} largura=${ER.largura} />
      </div>
      <div className=${cls('cadeado-box', abana && 'abanar')}><span style=${{ fontSize: 26 }}>${abertas[sala] ? '🔓' : '🔒'}</span><label htmlFor=${'dig-' + id}>Algarismo</label>

        <button className="btn ghost sm" onClick=${() => setSt(x => { x.codigo = { ...(x.codigo || {}), [sala]: S.html }; })}>Repor o código da sala</button></div>
    </div>
  </div>`;
}

  useEffect(() => {
    (async () => {
      const cl = await esperaClaude(); if (!cl) return;
      try {
        const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
        if (!db || !user) return;
        const id = await user.id(); if (!id) return;
        uid.current = id;
        const snap = await db.doc('turma/' + id).get();
        if (snap.exists) {
          const d = snap.data(); let rem = null; try { rem = JSON.parse(d.progresso || 'null'); } catch (e) { }
          const local = pRef.current;
          if (rem && (!local.aluno || (rem.atualizado || 0) > (local.atualizado || 0))) {
            try { const ob = await db.doc('turma/' + id + '/obra/ficheiros').get(); if (ob.exists) { rem.obra = JSON.parse(ob.data().ficheiros || '{}'); ultObra.current = JSON.stringify(rem.obra); } } catch (e) { }
            setP({ ...novoProgresso(), ...rem, obra: { ...FICHEIROS_INICIAIS, ...(rem.obra || local.obra) } });
          }
        }
        pronto.current = true; setCap({ db, user }); setEstado('conta');
      } catch (e) { setEstado('local'); }
    })();
  }, []);
  useEffect(() => {
    if (!pronto.current || !cap.db || !p.aluno) return;
    setEstado('guardar');
    const t = setTimeout(async () => {
      try {
        const { obra, ...resto } = p;
        await cap.db.doc('turma/' + uid.current).set({ nome: p.aluno.nome, turma: p.aluno.turma || '', alvaras: totalAlvaras(p), progresso: JSON.stringify(resto), atualizado: p.atualizado || Date.now() });
        const so = JSON.stringify(obra);
        if (so !== ultObra.current) { await cap.db.doc('turma/' + uid.current + '/obra/ficheiros').set({ ficheiros: so, atualizado: Date.now() }); ultObra.current = so; }
        setEstado('conta');
      } catch (e) { setEstado('erro'); }
    }, 2500);
    return () => clearTimeout(t);
  }, [p, cap.db]);
  return { estado, cap };
}

/* -------------------------------- App -------------------------------- */
const rota = () => (location.hash || (MODO === 'professor' ? '#fiscal' : '#inicio')).slice(1) || 'inicio';
function App() {
  const [p, setP] = useState(lerLocal);
  const [r, setR] = useState(rota());
  const [perfil, setPerfil] = useState(false);
  useEffect(() => { const h = () => { setR(rota()); }; addEventListener('hashchange', h); return () => removeEventListener('hashchange', h); }, []);
  useEffect(() => { window.scrollTo(0, 0); }, [r]);
  const atualiza = useCallback(fn => setP(prev => { const nx = JSON.parse(JSON.stringify(prev)); fn(nx); nx.atualizado = Date.now(); return nx; }), []);
  const { estado, cap } = useArmazem(p, setP);
  const [prof, setProf] = useState(null);
  useEffect(() => { if (MODO === 'professor') { setProf(true); return; } if (MODO === 'aluno') { setProf(false); return; } (async () => { try { const cl = await esperaClaude(); const u = cl ? await cl.use('user') : null; setProf(u ? !!(await u.canEdit()) : false); } catch (e) { setProf(false); } })(); }, []);
  const ir = h => { location.hash = h; };
  let corpo, atual = 'inicio';
  const mf = r.match(/^fase-([1-8])$/), me = r.match(/^escape-(er[123])$/);
  if (mf) { corpo = html`<${Fase} n=${+mf[1]} p=${p} atualiza=${atualiza} ir=${ir} />`; atual = 'fase'; }
  else if (me) { corpo = html`<${Escape} key=${me[1]} id=${me[1]} p=${p} atualiza=${atualiza} />`; atual = 'fase'; }
  else if (r === 'obra') { corpo = html`<${MinhaObra} p=${p} atualiza=${atualiza} />`; atual = 'obra'; }
  else if (r === 'caderno') { corpo = html`<${Caderno} p=${p} />`; atual = 'caderno'; }
  else if (r === 'fiscal') { corpo = prof ? html`<${Fiscal} p=${p} atualiza=${atualiza} db=${cap} />` : html`<${Reservado} aVerificar=${prof === null} />`; atual = 'fiscal'; }
  else corpo = html`<${Inicio} p=${p} atualiza=${atualiza} estado=${estado} />`;
  const est = { conta: ['Guardado na conta', ''], guardar: ['A guardar…', 'guardar'], local: ['Guardado neste navegador', 'local'], erro: ['Erro ao guardar na conta', 'erro'] }[estado];
  const links = [['inicio', 'Percurso'], ['obra', 'A minha obra'], ['caderno', 'Caderno']].concat(prof ? [['fiscal', 'Fiscal']] : []);
  return html`<${React.Fragment}>
    <header className="topo gutter"><div className="wrap">
      <a className="marca" href="#inicio"><span className="faixa" aria-hidden="true"></span><b>Estaleiro <span>Web</span></b></a>
      <nav className="nav" aria-label="Principal">${links.map(([k, t]) => html`<a key=${k} href=${'#' + k} aria-current=${atual === k || (k === 'inicio' && atual === 'fase') ? 'page' : null}>${t}</a>`)}</nav>
      <div className="dir"><span className=${cls('estado', est[1])} title=${est[0]}><i></i><span>${est[0]}</span></span>
        <button className="chip-aluno" onClick=${() => setPerfil(true)} aria-label="Ficha da obra"><span className="avatar">${((p.aluno && p.aluno.nome) || '?').trim()[0].toUpperCase()}</span>${(p.aluno && p.aluno.nome.split(' ')[0]) || 'Entrar'}</button></div>
    </div></header>
    <main className="pagina gutter"><div className="wrap">${corpo}
      <footer className="rodape"><span>Estaleiro Web · percurso baseado na Sebenta de Desenvolvimento Web (HTML, CSS e JavaScript)</span><span>Fases: ${FASES.map(F => html`<a key=${F.n} href=${'#fase-' + F.n} style=${{ marginLeft: 6 }}>${F.n}</a>`)}</span></footer>
    </div></main>
    ${((!p.aluno && MODO !== 'professor') || perfil) && r !== 'fiscal' && html`<${Perfil} p=${p} atualiza=${atualiza} primeiro=${!p.aluno} fechar=${() => setPerfil(false)} />`}
    <${Toasts} />
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById('raiz')).render(html`<${App} />`);

</script>
</body>
</html>
