/* Layout: IDE de três colunas (atividades + painel lateral | editor + consola | preview + bancada),
   com barra de título e barra de estado. Tema escuro de laboratório por defeito; tema claro disponível. */
:root {
  --bg: #0d1117; --bg-2: #10161e; --panel: #141b24; --panel-2: #1a232e; --panel-3: #212c39;
  --line: #24303c; --line-2: #33424f;
  --fg: #dbe3ea; --fg-2: #a3b3c1; --fg-3: #728595;
  --pcb: #1f8f4e; --pcb-text: #5fd391; --copper: #c47a3a; --copper-text: #e09a5c;
  --cyan: #22d3ee; --amber: #f59e0b; --magenta: #d55cf0; --red: #f87171; --ok: #4ade80;
  --on-accent: #ffffff;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-disp: "Chakra Petch", "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9ede7; --bg-2: #e2e7df; --panel: #f9faf7; --panel-2: #eff2ec; --panel-3: #e5eae2;
    --line: #d3dacf; --line-2: #bcc6b9;
    --fg: #15212a; --fg-2: #44535d; --fg-3: #66757e;
    --pcb: #157a40; --pcb-text: #0f6a37; --copper: #9a5418; --copper-text: #8a4a12;
    --cyan: #0e7490; --amber: #a15c07; --magenta: #9d1aab; --red: #c42b2b; --ok: #15803d;
    --shadow: 0 10px 30px rgba(30,45,35,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9ede7; --bg-2: #e2e7df; --panel: #f9faf7; --panel-2: #eff2ec; --panel-3: #e5eae2;
  --line: #d3dacf; --line-2: #bcc6b9;
  --fg: #15212a; --fg-2: #44535d; --fg-3: #66757e;
  --pcb: #157a40; --pcb-text: #0f6a37; --copper: #9a5418; --copper-text: #8a4a12;
  --cyan: #0e7490; --amber: #a15c07; --magenta: #9d1aab; --red: #c42b2b; --ok: #15803d;
  --shadow: 0 10px 30px rgba(30,45,35,.18);
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-code); }
kbd { font: 11px var(--f-code); padding: 1px 5px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--panel-2); }

/* ---------- Estrutura ---------- */
.app {
  height: 100%; display: grid;
  grid-template-rows: 46px minmax(0, 1fr) 26px;
  grid-template-columns: 48px 288px minmax(0, 1fr) minmax(0, .92fr);
  grid-template-areas: "top top top top" "act side work right" "status status status status";
}
.app.sem-lateral { grid-template-columns: 48px 0 minmax(0, 1fr) minmax(0, .92fr); }
.app.sem-lateral .lateral { display: none; }

/* Barra de título */
.topo { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 0; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
.marca { display: flex; align-items: center; gap: 10px; width: 336px; padding-left: 12px; flex: none; min-width: 0; }
.marca svg.logo { width: 26px; height: 26px; flex: none; }
.marca b { font: 600 15px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.marca .projeto-nome { color: var(--fg-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo .crumbs { flex: 1; min-width: 0; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.topo .crumbs b { color: var(--fg); font-weight: 600; }
.nivel-chip { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); flex: none; }
.nivel-chip .badge-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--pcb); color: var(--on-accent); font: 700 12px var(--f-disp); }
.nivel-chip .t { display: grid; line-height: 1.15; }
.nivel-chip .t b { font-size: 12px; }
.nivel-chip .t span { font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.xpbar { width: 110px; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pcb), var(--cyan)); width: 0; transition: width .5s; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--fg-2); }
.icon-btn:hover { background: var(--panel-2); color: var(--fg); }
.btn-menu { display: none; }

/* Barra de atividades */
.atividades { grid-area: act; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--bg-2); border-right: 1px solid var(--line); }
.atividades button { position: relative; width: 38px; height: 38px; border-radius: 9px; border: 0; background: transparent; color: var(--fg-3); display: grid; place-items: center; }
.atividades button:hover { color: var(--fg); background: var(--panel-2); }
.atividades button[aria-pressed="true"] { color: var(--fg); }
.atividades button[aria-pressed="true"]::before { content: ""; position: absolute; left: -5px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--pcb-text); }
.atividades .i { width: 21px; height: 21px; }
.atividades .sep { flex: 1; }
.atividades .ponto { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }

/* Painel lateral */
.lateral { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.lateral-cab { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font: 600 11px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); border-bottom: 1px solid var(--line); flex: none; }
.lateral-corpo { overflow: auto; flex: 1; padding: 10px 10px 24px; min-height: 0; }

.setor { margin: 6px 0 14px; }
.setor-cab { display: flex; align-items: baseline; gap: 8px; padding: 4px 4px 6px; }
.setor-cab .num { font: 600 11px var(--f-code); color: var(--fg-3); }
.setor-cab b { font: 600 13px var(--f-disp); letter-spacing: .03em; text-transform: uppercase; }
.setor-cab .area { margin-left: auto; font-size: 11px; color: var(--fg-3); }
.setor-prog { height: 3px; border-radius: 2px; background: var(--panel-3); margin: 0 4px 6px; overflow: hidden; }
.setor-prog i { display: block; height: 100%; background: var(--pcb-text); }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.mitem { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; align-items: center; gap: 4px; width: 100%; padding: 5px 6px; border-radius: 7px; border: 0; background: transparent; text-align: left; color: var(--fg-2); }
.mitem:hover:not(:disabled) { background: var(--panel-2); color: var(--fg); }
.mitem[aria-current="true"] { background: color-mix(in srgb, var(--pcb) 22%, transparent); color: var(--fg); }
.mitem:disabled { opacity: .5; cursor: not-allowed; }
.mitem .n { font: 500 11.5px var(--f-code); color: var(--fg-3); }
.mitem .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.mitem .tag { font-size: 10px; color: var(--copper-text); border: 1px solid color-mix(in srgb, var(--copper) 50%, transparent); border-radius: 4px; padding: 0 4px; }
.estado { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--fg-3); display: grid; place-items: center; }
.estado.feito { border-color: var(--ok); background: var(--ok); }
.estado.feito::after { content: ""; width: 6px; height: 3px; border: 1.6px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(0, -1px); }
.estado.curso { border-color: var(--amber); }
.estado.curso::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.estado.bloq { border: 0; }
.estado.bloq::after { content: ""; width: 8px; height: 6px; border: 1.5px solid var(--fg-3); border-radius: 2px; transform: translateY(2px); box-shadow: 0 -4px 0 -2px var(--fg-3); }
.lado-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; margin: 2px 0; border-radius: 8px; border: 1px dashed var(--line-2); background: transparent; color: var(--fg-2); font-size: 12.5px; }
.lado-btn:hover { color: var(--fg); border-color: var(--pcb-text); }

.cartao-dia { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.cartao-dia h3 { margin: 0 0 4px; font: 600 11px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--amber); display: flex; justify-content: space-between; }
.cartao-dia p { margin: 0 0 8px; font-size: 12.5px; }
.opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
.op { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); font-size: 12.5px; }
.op:hover:not(:disabled) { border-color: var(--cyan); }
.op.certa { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.op.errada { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
.op:disabled { cursor: default; }

/* Painéis informativos genéricos do lateral */
.h-sec { font: 600 11px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); margin: 14px 4px 8px; }
.ficha { width: 100%; border-collapse: collapse; font-size: 12px; }
.ficha th, .ficha td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ficha th { color: var(--fg-3); font-weight: 500; font-size: 11px; }
.ficha code { font: 11.5px var(--f-code); color: var(--cyan); word-break: break-word; }
.inv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.comp { border: 1px solid var(--line); border-radius: 9px; padding: 8px; background: var(--panel-2); min-width: 0; }
.comp b { display: block; font-size: 12px; line-height: 1.3; }
.comp span { display: block; font: 10.5px var(--f-code); color: var(--fg-3); margin-top: 3px; }
.comp.bloq { background: transparent; border-style: dashed; opacity: .55; }
.comp .na { color: var(--pcb-text); }
.emb { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.emb .med { width: 30px; height: 30px; flex: none; }
.emb b { font-size: 12.5px; }
.emb p { margin: 0; font-size: 11.5px; color: var(--fg-3); }
.emb.bloq { opacity: .45; }
.campo { display: grid; gap: 4px; margin: 0 0 10px; }
.campo label { font-size: 12px; color: var(--fg-2); }
.campo input, .campo select { padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2); }
.linha-check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 4px 0; }
.linha-check input { margin-top: 3px; accent-color: var(--pcb); }
.diario-e { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel-2); font-size: 12px; }
.diario-e b { font-size: 12px; }
.diario-e dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.diario-e dt { color: var(--fg-3); }
.diario-e dd { margin: 0; }
.vazio { color: var(--fg-3); font-size: 12.5px; padding: 8px 4px; }

/* ---------- Área de trabalho central ---------- */
.trabalho { grid-area: work; display: grid; grid-template-rows: auto auto minmax(120px, 1fr) minmax(150px, 34%); min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
.mcab { grid-row: 1; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); min-width: 0; flex-wrap: wrap; }
.mcab .titulo { min-width: 0; flex: 1 1 260px; }
.mcab .eyebrow { font: 500 11px var(--f-code); color: var(--fg-3); letter-spacing: .04em; }
.mcab h1 { margin: 2px 0 0; font: 600 18px/1.2 var(--f-disp); letter-spacing: .02em; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-2); background: var(--panel); white-space: nowrap; }
.chip .i { width: 13px; height: 13px; }
.chip.sebenta { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); }
.chip.mec { color: var(--copper-text); border-color: color-mix(in srgb, var(--copper) 50%, transparent); }
.chip.proj { color: var(--pcb-text); border-color: color-mix(in srgb, var(--pcb) 55%, transparent); }
.chip.bonus { color: var(--magenta); border-color: color-mix(in srgb, var(--magenta) 50%, transparent); }
.mcab .acoes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); font-size: 12.5px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--fg-3); background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.prim { background: var(--pcb); border-color: var(--pcb); color: var(--on-accent); font-weight: 600; }
.btn.prim:hover:not(:disabled) { background: color-mix(in srgb, var(--pcb) 85%, white); border-color: transparent; }
.btn.perigo { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.btn .cnt { font: 11px var(--f-code); color: var(--fg-3); }
.btn.prim .cnt { color: inherit; opacity: .8; }

.faixa { grid-row: 2; border-bottom: 1px solid var(--line); background: var(--panel); max-height: 46vh; overflow: auto; }
.faixa:empty { display: none; }
.faixa-in { padding: 10px 14px; display: grid; gap: 10px; }
.aviso-linha { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; }
.aviso-linha .i { margin-top: 1px; }
.aviso-linha.amber { border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.aviso-linha.amber .i { color: var(--amber); }
.aviso-linha.cyan .i { color: var(--cyan); }
.aviso-linha.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.aviso-linha.ok .i { color: var(--ok); }
.aviso-linha p { margin: 0; }
.aviso-linha .sub { color: var(--fg-3); font-size: 12px; margin-top: 3px; }
.prev-q { font-weight: 600; margin: 0 0 8px; }
.prev-q code, .aviso-linha code, .caixa-a code { font: 12px var(--f-code); background: var(--panel-3); padding: 1px 4px; border-radius: 4px; }

.editor-wrap { grid-row: 3; display: grid; grid-template-rows: 34px minmax(0, 1fr); min-height: 0; min-width: 0; }
.tabs { display: flex; align-items: stretch; background: var(--bg-2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--fg-3); font: 12px var(--f-code); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: inset 0 2px 0 var(--pcb-text); }
.tab .dot { width: 8px; height: 8px; border-radius: 2px; }
.tab .dot.html { background: #e4724b; } .tab .dot.css { background: #3d8fe0; } .tab .dot.js { background: #e9c53b; }
.tabs .espaco { flex: 1; }
.tabs .tab-acao { border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--fg-3); font-size: 12px; padding: 0 10px; white-space: nowrap; }
.tabs .tab-acao:hover { color: var(--fg); }
.editor { position: relative; min-height: 0; min-width: 0; }
.editor .CodeMirror { position: absolute; inset: 0; height: auto; }
.especial { overflow: auto; min-height: 0; padding: 14px; display: none; }
.editor-wrap.modo-especial { grid-template-rows: minmax(0, 1fr); }
.editor-wrap.modo-especial .tabs, .editor-wrap.modo-especial .editor { display: none; }
.editor-wrap.modo-especial .especial { display: block; }
.mini { font: 11px var(--f-code); color: var(--fg-3); }
.mini-r { width: 70px; accent-color: var(--pcb-text); min-width: 0; }
.mini-v { font: 11px var(--f-code); color: var(--fg-2); min-width: 54px; font-variant-numeric: tabular-nums; }
.mini-b { border: 1px solid var(--line-2); background: var(--panel); color: var(--fg-2); border-radius: 6px; font: 11px var(--f-code); padding: 1px 7px; }
.mini-b[aria-pressed="true"] { background: var(--panel-3); color: var(--fg); }

/* Painel inferior */
.inferior { grid-row: 4; display: grid; grid-template-rows: 32px minmax(0, 1fr); border-top: 1px solid var(--line); min-height: 0; background: var(--bg-2); }
.inf-tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.inf-tabs button { border: 0; background: transparent; color: var(--fg-3); padding: 0 12px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.inf-tabs button[aria-selected="true"] { color: var(--fg); box-shadow: inset 0 -2px 0 var(--pcb-text); }
.inf-tabs .badge { font: 10.5px var(--f-code); padding: 0 5px; border-radius: 8px; background: var(--panel-3); color: var(--fg-2); letter-spacing: 0; }
.inf-tabs .badge.err { background: color-mix(in srgb, var(--red) 25%, transparent); color: var(--red); }
.inf-tabs .badge.ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.inf-corpo { overflow: auto; min-height: 0; font: 12.5px/1.55 var(--f-code); }
.term { padding: 8px 14px 12px; }
.term .l { white-space: pre-wrap; word-break: break-word; margin: 0 0 4px; }
.term .p { color: var(--pcb-text); }
.term .s { color: var(--fg-3); }
.term .a { color: var(--amber); }
.term .c { color: var(--cyan); }
.term .r { color: var(--red); }
.term-in { display: flex; gap: 8px; align-items: center; padding: 6px 14px; border-top: 1px dashed var(--line); position: sticky; bottom: 0; background: var(--bg-2); }
.term-in span { color: var(--pcb-text); }
.term-in input { flex: 1; border: 0; background: transparent; outline: none; font: inherit; min-width: 0; }
.caixas { display: grid; gap: 6px; margin: 8px 0 10px; font-family: var(--f-ui); font-size: 12.5px; }
.caixa-a { border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; padding: 6px 10px; background: var(--panel); }
.caixa-a b { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 1px; }
.caixa-a.dica { border-left-color: var(--ok); } .caixa-a.dica b { color: var(--ok); }
.caixa-a.erro { border-left-color: var(--amber); } .caixa-a.erro b { color: var(--amber); }
.caixa-a.experimenta { border-left-color: var(--cyan); } .caixa-a.experimenta b { color: var(--cyan); }
.caixa-a.desafio { border-left-color: var(--magenta); } .caixa-a.desafio b { color: var(--magenta); }
.testes-l { list-style: none; margin: 0; padding: 8px 10px; display: grid; gap: 2px; font-family: var(--f-ui); font-size: 13px; }
.testes-l li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; padding: 5px 6px; border-radius: 6px; }
.testes-l li .m { grid-column: 2; color: var(--fg-2); font-size: 12px; }
.testes-l .ico { font: 600 13px var(--f-code); }
.testes-l .ok .ico { color: var(--ok); }
.testes-l .falha { background: color-mix(in srgb, var(--red) 8%, transparent); }
.testes-l .falha .ico { color: var(--red); }
.testes-l .pend .ico { color: var(--fg-3); }
.testes-l .opc .t::after { content: "  opcional"; font-size: 10.5px; color: var(--magenta); }
.consola-l { padding: 4px 0; }
.consola-l .l { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 3px 14px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); white-space: pre-wrap; word-break: break-word; }
.consola-l .k { color: var(--fg-3); font-size: 11px; }
.consola-l .erro { color: var(--red); background: color-mix(in srgb, var(--red) 7%, transparent); }
.consola-l .aviso { color: var(--amber); }
.consola-l .alerta { color: var(--cyan); }
.consola-l .info .k { color: var(--fg-3); }
.serie { padding: 6px 14px; }
.serie .l { white-space: pre-wrap; }
.serie .t { color: var(--fg-3); }
.serie .tx { color: var(--pcb-text); }
.serie .rx { color: var(--cyan); }

/* ---------- Coluna direita: preview + bancada ---------- */
.direita { grid-area: right; display: grid; grid-template-rows: 34px minmax(160px, 1fr) 30px minmax(220px, 46%); min-width: 0; min-height: 0; background: var(--bg-2); }
.barra { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); min-width: 0; }
.barra .rot { font: 600 11px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; }
.barra select, .seg button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 6px; padding: 2px 6px; font: 11.5px var(--f-code); color: var(--fg-2); }
.barra .flex { flex: 1; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--panel-3); color: var(--fg); }
.barra .url { flex: 1; min-width: 0; font: 11.5px var(--f-code); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 3px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.barra-prev { grid-row: 1; } .barra-banc { grid-row: 3; }
.preview-area { grid-row: 2; position: relative; overflow: hidden; background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--panel) 0 50%) 0 0 / 16px 16px; min-height: 0; }
.preview-area iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; transform-origin: 0 0; }
.preview-area .medida { position: absolute; right: 8px; bottom: 8px; font: 11px var(--f-code); background: var(--panel); border: 1px solid var(--line); color: var(--fg-2); padding: 2px 6px; border-radius: 5px; }
.bancada-area { grid-row: 4; position: relative; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 30% 20%, #1c2a24, #0b1210 70%); }
.bancada-area canvas { display: block; }
.bancada-dica { position: absolute; left: 10px; bottom: 8px; font: 11px var(--f-code); color: #8fb3a2; pointer-events: none; }

/* ---------- Barra de estado ---------- */
.estado-barra { grid-area: status; display: flex; align-items: center; gap: 16px; padding: 0 10px; background: var(--pcb); color: var(--on-accent); font: 11.5px var(--f-code); white-space: nowrap; overflow: hidden; }
.estado-barra span { display: inline-flex; gap: 6px; align-items: center; }
.estado-barra .flex { flex: 1; }
.estado-barra button { border: 0; background: rgba(0,0,0,.18); color: inherit; font: 600 11.5px var(--f-code); padding: 2px 10px; border-radius: 4px; height: 20px; }
.estado-barra button:hover { background: rgba(0,0,0,.3); }
.estado-barra .led-s { width: 7px; height: 7px; border-radius: 50%; background: #b8ffcf; box-shadow: 0 0 6px #b8ffcf; }

/* ---------- Vistas especiais ---------- */
.esp-tit { font: 600 14px var(--f-disp); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 4px; }
.esp-sub { color: var(--fg-2); margin: 0 0 14px; font-size: 13px; }
.ficheiros-jogo { display: grid; gap: 14px; }
.cesto { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 10px; border: 1px dashed var(--line-2); border-radius: 10px; }
.fich { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-2); font: 12px var(--f-code); cursor: grab; user-select: none; }
.fich[aria-pressed="true"] { border-color: var(--cyan); box-shadow: 0 0 0 2px color-mix(in srgb, var(--cyan) 30%, transparent); }
.fich.mal { border-color: var(--red); animation: abana .35s; }
.fich.bem { border-color: var(--ok); }
@keyframes abana { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.pastas { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.pasta { border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2); padding: 10px; min-height: 96px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; }
.pasta.alvo { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, var(--panel-2)); }
.pasta.corrigir { border-style: dashed; border-color: color-mix(in srgb, var(--amber) 60%, transparent); }
.pasta .pn { display: flex; align-items: center; gap: 6px; font: 600 12px var(--f-code); color: var(--fg-2); }
.pasta .pn .i { color: var(--copper-text); }
.pasta .conteudo { display: flex; flex-wrap: wrap; gap: 6px; }

.sel-jogo { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
.placa-vis { position: relative; border-radius: 12px; padding: 14px; background: #1a2b22; border: 1px solid #2b4a3a; display: grid; gap: 12px; min-height: 230px; }
.placa-vis [data-c] { transition: box-shadow .2s, transform .2s, outline-color .2s; outline: 2px solid transparent; outline-offset: 3px; }
.placa-vis .placa { background: #0f7c86; color: #e8fbff; font: 600 12px var(--f-code); padding: 14px; border-radius: 8px; width: 140px; }
.placa-vis .breadboard { background: #ece7dc; border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.placa-vis .led { width: 24px; height: 24px; border-radius: 50% 50% 4px 4px; display: inline-block; }
.placa-vis .led.vermelho { background: #e53935; } .placa-vis .led.verde { background: #43a047; } .placa-vis .led.amarelo { background: #fbc02d; }
.placa-vis .resistencia { width: 46px; height: 12px; border-radius: 6px; background: repeating-linear-gradient(90deg, #d7b98c 0 8px, #8d4b2a 8px 11px, #d7b98c 11px 16px); display: inline-block; }
.placa-vis .fio { width: 54px; height: 6px; border-radius: 3px; background: #1e88e5; display: inline-block; }
.placa-vis .sensor { width: 30px; height: 22px; border-radius: 4px; background: #263238; display: inline-block; }
.placa-vis .fora { display: flex; gap: 14px; align-items: center; color: #9fc4b0; font: 11px var(--f-code); }
.placa-vis .hit { outline: 2px solid var(--cyan); outline-offset: 3px; box-shadow: 0 0 16px var(--cyan); }
.placa-vis .alvo-pisca { animation: salto .9s ease-in-out infinite; }
@keyframes salto { 50% { transform: translateY(-4px); } }
.codigo-ro { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); font: 12px/1.6 var(--f-code); overflow: auto; color: var(--fg-2); }
.codigo-ro .hl { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 14%, transparent); }
.sel-entrada { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.sel-entrada input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-2); font: 13px var(--f-code); }
.sel-entrada .ch { font: 13px var(--f-code); color: var(--fg-3); }
.niveis-dots { display: flex; gap: 5px; margin: 8px 0; }
.niveis-dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--panel-3); }
.niveis-dots i.f { background: var(--pcb-text); }
.niveis-dots i.a { background: var(--cyan); }

.caixa-vis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.bm { font: 11px var(--f-code); color: #142; border-radius: 4px; text-align: center; }
.bm .bm-l { display: flex; justify-content: space-between; padding: 2px 6px; }
.bm.m { background: #f6c38f; padding: 0 14px 14px; }
.bm.b { background: #ffe08a; padding: 0 10px 10px; }
.bm.p { background: #b6e3a8; padding: 0 14px 14px; }
.bm.c { background: #9ec9ef; padding: 18px 8px; }
.medidas { display: grid; gap: 10px; }
.medidas .linha { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; align-items: center; font-size: 13px; }
.medidas input { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-2); font: 13px var(--f-code); width: 100%; }
.medidas .r { font: 12px var(--f-code); min-width: 70px; }
.medidas .r.ok { color: var(--ok); } .medidas .r.mal { color: var(--red); }

.boss { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.boss-bug { width: 54px; height: 54px; }
.vida { height: 10px; border-radius: 5px; background: var(--panel-3); overflow: hidden; display: flex; gap: 2px; }
.vida i { flex: 1; background: var(--red); }
.vida i.f { background: transparent; }
.boss .relogio { font: 600 18px var(--f-code); font-variant-numeric: tabular-nums; color: var(--amber); }
.etapas { display: flex; gap: 6px; flex-wrap: wrap; }
.etapas button { min-width: 34px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel-2); font: 600 12px var(--f-code); }
.etapas button[aria-current="true"] { border-color: var(--amber); color: var(--amber); }
.etapas button.f { border-color: var(--ok); color: var(--ok); }

.final-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.final-grid .bloco { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); }
.final-grid h3 { margin: 0 0 6px; font: 600 11px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-3); }

/* ---------- Árvore de competências ---------- */
.arvore svg { width: 100%; height: auto; display: block; }
.arvore .traco { stroke: var(--line-2); stroke-width: 2; fill: none; }
.arvore .traco.on { stroke: var(--pcb-text); filter: drop-shadow(0 0 3px var(--pcb-text)); }
.arvore .no { fill: var(--panel-2); stroke: var(--line-2); stroke-width: 1.5; }
.arvore .no.on { fill: var(--pcb); stroke: var(--pcb-text); }
.arvore .no.cur { stroke: var(--amber); stroke-width: 2; }
.arvore text { font: 9px var(--f-code); fill: var(--fg-2); }
.arvore .rot-s { font: 600 9.5px var(--f-ui); fill: var(--fg-3); letter-spacing: .08em; }

/* ---------- Modal e toasts ---------- */
.modal-fundo { position: fixed; inset: 0; background: rgba(5,10,8,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: min(640px, 100%); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.modal-cab h2 { margin: 0; font: 600 16px var(--f-disp); letter-spacing: .03em; text-transform: uppercase; }
.modal-corpo { padding: 4px 16px 16px; }
.modal-pe { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; flex-wrap: wrap; }
.modal pre { white-space: pre-wrap; word-break: break-word; }
.toasts { position: fixed; right: 14px; bottom: 38px; display: grid; gap: 8px; z-index: 60; width: min(340px, calc(100vw - 28px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); font-size: 13px; animation: entra .25s ease-out; }
.toast .i { margin-top: 1px; color: var(--pcb-text); }
.toast b { display: block; }
.toast.xp .i { color: var(--amber); }

  st: (c, sel, prop) => { const el = typeof sel === 'string' ? c.$(sel) : sel; return el ? c.win.getComputedStyle(el).getPropertyValue(prop).trim() : ''; },

    'index.html': pagina('Configuração', '  <h1>Configuração do Arduino</h1>\n  <form id="config">\n    <p>\n      <label for="temperatura">Limiar de temperatura (°C)</label>\n      <input id="limiar" name="limiar" type="number" min="0" max="50" value="28">\n    </p>\n    <p>\n      <label for="nota">Notas</label>\n      <textarea id="notas" name="notas" rows="3" required="false"></textarea>\n    </p>\n    <\!-- Modo: dois radio (auto / manual) com o mesmo name -->\n    <\!-- Pino do alarme: select com as opções 8 e 12 -->\n    <\!-- Checkbox "Ativar buzzer" -->\n    <button>Demonstração: ainda sem envio</button>\n  </form>')

  testes: [

    { t: 'O limiar é um número entre 0 e 50 e é obrigatório', f: c => { const i = c.$('#limiar'); return !!i && i.type === 'number' && i.min === '0' && i.max === '50' && i.required; }, erro: 'O input do limiar deve ter type="number", min="0", max="50" e required.' },
    { t: 'As notas têm etiqueta e não são obrigatórias', f: c => T.label(c.doc, 'notas') && !c.$('#notas').hasAttribute('required'), erro: 'Liga a label a id="notas" e remove o atributo required (required="false" não o desativa).' },
    { t: 'Há dois radio "modo" (auto e manual) com etiquetas', f: c => { const r = c.$$('input[type="radio"][name="modo"]'); return r.length === 2 && r.every(x => x.id && T.label(c.doc, x.id)) && new Set(r.map(x => x.value)).size === 2; }, erro: 'Cria dois input type="radio" com name="modo", valores diferentes e uma label para cada.' },
    { t: 'O pino do alarme é escolhido num select com 2 opções', f: c => { const s = c.$('select'); return !!s && s.options.length >= 2 && !!s.id && T.label(c.doc, s.id); }, erro: 'Cria <select id="pino" name="pino"> com <option value="8">8</option> e <option value="12">12</option>, e a respetiva label.' },
    { t: 'Há uma checkbox com etiqueta', f: c => c.$$('input[type="checkbox"]').some(x => x.id && T.label(c.doc, x.id)), erro: 'Acrescenta <input type="checkbox" id="buzzer" name="buzzer" value="sim"> com label.' },
    { t: 'O botão indica type="button"', f: c => { const b = c.$('form button'); return !!b && b.getAttribute('type') === 'button'; }, erro: 'Sem type, o botão de um formulário é submit. Nesta fase usa type="button".' },
    { t: 'Não há campos de palavra-passe', f: c => !c.$('input[type="password"]'), erro: 'Não peças palavras-passe nos exercícios.' }
  ],
  pistas: ['Compara o for de cada label com o id do campo que está ao lado.', 'Radios do mesmo grupo partilham o name e têm value diferente: <input type="radio" id="auto" name="modo" value="auto"> <label for="auto">Automático</label>.', 'O botão fica <button type="button">…</button>, e em #notas apaga required="false".'],
  solucao: { comentario: 'Cada campo tem label; radios agrupados por name; button type="button".', ficheiros: { 'index.html': pagina('Configuração', '  <h1>Configuração do Arduino</h1>\n  <form id="config">\n    <p>\n      <label for="limiar">Limiar de temperatura (°C)</label>\n      <input id="limiar" name="limiar" type="number" min="0" max="50" value="28" required>\n    </p>\n    <p>\n      <label for="notas">Notas</label>\n      <textarea id="notas" name="notas" rows="3"></textarea>\n    </p>\n    <p>\n      <input type="radio" id="auto" name="modo" value="auto" checked>\n      <label for="auto">Automático</label>\n      <input type="radio" id="manual" name="modo" value="manual">\n      <label for="manual">Manual</label>\n    </p>\n    <p>\n      <label for="pino">Pino do alarme</label>\n      <select id="pino" name="pino">\n        <option value="8">8</option>\n        <option value="12">12</option>\n      </select>\n    </p>\n    <p>\n      <input type="checkbox" id="buzzer" name="buzzer" value="sim">\n      <label for="buzzer">Ativar buzzer</label>\n    </p>\n    <button type="button">Demonstração: ainda sem envio</button>\n  </form>') } }
},
{
  id: '08', setor: 1, titulo: 'Arquitetura semântica', cap: 'cap. 06', pags: 'p. 18–19', mecanica: 'Modifica o exemplo', xp: 200,
  componente: 'lcd', projeto: true, miniProjeto: 'Mini projeto 2',
  briefing: 'A partir daqui trabalhas no Projeto PAP: o website que vais entregar, com três páginas. A página inicial ainda é uma sopa de div. Dá nomes às áreas (header, nav, main, footer) e cria um menu igual nas três páginas. Trocar uma div por nav não deixa o menu bonito: isso fica para o CSS. O h1 de cada página aparece no LCD da bancada.',
  caixas: [
    { tipo: 'dica', texto: 'Usa um main visível por página. Uma section deve normalmente ter um título.' },
    { tipo: 'dica', texto: 'aria-label="Navegação principal" dá um nome ao nav para tecnologias de apoio.' },
    { tipo: 'desafio', texto: 'Acrescenta um aside com ligações de consulta e explica no diário porque é conteúdo complementar.' }
  ],
  snippet: { ficheiro: 'index.html', texto: '  <nav aria-label="Navegação principal">\n    <a href="index.html">Painel</a>\n    <a href="projeto.html">Projeto</a>\n    <a href="contacto.html">Contacto</a>\n  </nav>\n' },
  testes: [
    { t: 'As três páginas existem: index, projeto e contacto', f: c => T.paginas.every(p => !!c.src[p]), erro: 'Faltam páginas no projeto. Abre o painel Ficheiros e repõe a página em falta.' },
    { t: 'Cada página tem header, main (um só) e footer', f: c => { for (const p of T.paginas) { const d = c.pag(p); if (!d || !d.querySelector('header') || d.querySelectorAll('main').length !== 1 || !d.querySelector('footer')) return 'Falta estrutura semântica em ' + p + '.'; } return true; }, erro: 'Cada página precisa de header, um main e footer.' },
    { t: 'Cada página tem um nav com aria-label e ligações para as 3 páginas', f: c => { for (const p of T.paginas) { const d = c.pag(p); const n = d && d.querySelector('nav[aria-label]'); if (!n) return 'Em ' + p + ' falta <nav aria-label="Navegação principal">.'; const hrefs = [...n.querySelectorAll('a')].map(a => a.getAttribute('href')); if (!T.paginas.every(x => hrefs.includes(x))) return 'O menu de ' + p + ' não liga às três páginas.'; } return true; }, erro: 'O menu deve ser igual nas três páginas.' },
    { t: 'Cada página tem o seu title e um único h1', f: c => { const titulos = new Set(); for (const p of T.paginas) { const d = c.pag(p); if (!d || d.querySelectorAll('h1').length !== 1) return p + ' deve ter exatamente um h1.'; titulos.add(d.title.trim()); } return titulos.size === 3 || 'Os três title devem ser diferentes (ex.: "Painel | Estufa Inteligente").'; } },
    { t: 'A página inicial usa section com h2 e um article', f: c => !!c.$('main section h2') && !!c.$('main article'), erro: 'No main do index, cria uma section com h2 e um article (ex.: "Última atualização").' },
    { t: 'A página inicial já não depende de div class="topo"/"menu"', f: c => !c.$('div.topo, div.menu, div.rodape'), erro: 'Substitui div.topo por header, div.menu por nav e div.rodape por footer.' },
    { t: 'Há um aside com conteúdo complementar', f: c => T.paginas.some(p => { const d = c.pag(p); return d && d.querySelector('aside'); }), erro: 'Acrescenta um aside com ligações de consulta.', opcional: true }
  ],
  pistas: ['Começa pelo index.html: div.topo passa a header, div.menu passa a nav, e o conteúdo fica dentro de main.', 'Copia o header, o nav e o footer do index para projeto.html e contacto.html. Muda apenas o h1 e o title.', 'Usa o botão "Colar exemplo" para inserir o nav pronto no index.'],
  solucao: { comentario: 'Exemplo para o index.html. Repete header, nav e footer nas outras duas páginas.', texto: '<header>\n  <p>Portal da minha PAP</p>\n  <h1>Painel da Estufa Inteligente</h1>\n</header>\n<nav aria-label="Navegação principal">\n  <a href="index.html">Painel</a>\n  <a href="projeto.html">Projeto</a>\n  <a href="contacto.html">Contacto</a>\n</nav>\n<main>\n  <section>\n    <h2>Estado dos sensores</h2>\n    <p>Temperatura, humidade e luz.</p>\n  </section>\n  <article>\n    <h2>Última atualização</h2>\n    <p>O protótipo já lê a temperatura.</p>\n  </article>\n</main>\n<footer>\n  <p>Projeto de PAP · TEAC</p>\n</footer>' }
},
{

{
  id: '23', setor: 3, titulo: 'Controlo pelo DOM', cap: 'cap. 17', pags: 'p. 39', mecanica: 'Corrige o código', xp: 170,
  componente: 'rele',
  briefing: 'O painel tem de mostrar o estado do Arduino na própria página, não só na Consola. O DOM é a árvore do documento: o JavaScript encontra um elemento e altera o seu texto. Este código tem três erros clássicos (vê a Consola). Quando funcionar, a temperatura aparece na página e no LCD da bancada.',
  caixas: [
    { tipo: 'dica', texto: 'getElementById recebe o id sem #. querySelector recebe um seletor CSS.' },
    { tipo: 'dica', texto: 'Escreve a função sem parênteses no addEventListener: assim entregas a função em vez de a executares logo.' },
    { tipo: 'erro', texto: 'Se o mesmo script for usado em várias páginas, um elemento pode não existir. Verifica com if (botao && mensagem) antes de associar eventos.' }
  ],
  ficheiros: {
    'index.html': pagina('Controlo pelo DOM', '  <h1>Estado do Arduino</h1>\n  <p id="mensagem">À espera de leitura…</p>\n  <button id="ler" type="button">Ler temperatura</button>', { js: true }),
    'js/script.js': 'const mensagem = document.getElementById("#mensagem");\nconst botao = document.querySelector("#ler");\n\nfunction lerTemperatura() {\n  mensagem.textcontent = "Temperatura: " + lerSerie("temperatura") + " °C";\n}\n\nbotao.addEventListener("click", lerTemperatura());\n'

  abrir: 'js/script.js',
  testes: [
    { t: 'getElementById recebe o id sem #', f: c => /getElementById\(\s*["']mensagem["']\s*\)/.test(c.js), erro: 'Escreve getElementById("mensagem").' },
    { t: 'A propriedade é textContent, com C maiúsculo', f: c => /\.textContent\s*=/.test(c.js) && !/\.textcontent/.test(c.js), erro: 'Corrige textcontent para textContent.' },
    { t: 'O evento recebe a função sem a executar', f: c => /addEventListener\(\s*["']click["']\s*,\s*lerTemperatura\s*\)/.test(c.js), erro: 'Escreve addEventListener("click", lerTemperatura), sem ().' },
    { t: 'Há verificação de null antes de associar o evento', f: c => /if\s*\(\s*\w+\s*&&\s*\w+\s*\)/.test(c.js), erro: 'Envolve a associação em if (botao && mensagem) { … }.' },
    { t: 'O texto só muda depois do clique', f: c => { const m = c.$('#mensagem'); if (!m || !/espera/i.test(m.textContent)) return 'O texto mudou antes do clique: a função está a ser chamada logo.'; c.$('#ler').click(); return m.textContent.includes(String(c.sensor('temperatura'))) || 'Depois do clique esperava ver ' + c.sensor('temperatura') + ' na página.'; } },

  solucao: { comentario: 'Encontrar, verificar, associar o evento, alterar o texto.', ficheiros: { 'js/script.js': 'const mensagem = document.getElementById("mensagem");\nconst botao = document.querySelector("#ler");\n\nfunction lerTemperatura() {\n  mensagem.textContent = "Temperatura: " + lerSerie("temperatura") + " °C";\n}\n\nif (botao && mensagem) {\n  botao.addEventListener("click", lerTemperatura);\n}\n' } }

{

    { t: 'Um clique acende o LED (classe aceso)', f: c => { const l = c.$('#led'); if (!l) return false; const antes = l.classList.contains('aceso'); c.$('#interruptor').click(); return !antes && l.classList.contains('aceso'); }, erro: 'Usa led.classList.toggle("aceso");.' },
    { t: 'A imagem e o alt acompanham o estado', f: c => { const f = c.$('#foto'); return !!f && /led-on\.svg$/.test(c.srcDe(f)) && /ligado|aceso/i.test(f.alt) && !/desligado/i.test(f.alt); }, erro: 'Quando acende: foto.src = "imagens/led-on.svg"; foto.alt = "LED ligado";.' },

    { t: 'A Consola não mostra erros', f: c => c.erros().length === 0 || 'Erro na Consola: ' + c.erros()[0] }

  solucao: { comentario: 'JS muda a classe; CSS define o aspeto; a bancada lê data-pino.', ficheiros: { 'css/estilo.css': 'body { font-family: Arial, sans-serif; margin: 1rem; }\n\n.led {\n  width: 60px;\n  height: 60px;\n  border-radius: 50%;\n  background-color: #5d2b2b;\n}\n\n.aceso {\n  background-color: #ff5252;\n  box-shadow: 0 0 20px #ff5252;\n}\n', 'js/script.js': 'const led = document.querySelector("#led");\nconst foto = document.querySelector("#foto");\nconst interruptor = document.querySelector("#interruptor");\n\nif (led && foto && interruptor) {\n  interruptor.addEventListener("click", function () {\n    led.classList.toggle("aceso");\n\n    if (led.classList.contains("aceso")) {\n      foto.src = "imagens/led-on.svg";\n      foto.alt = "LED ligado";\n    } else {\n      foto.src = "imagens/led-off.svg";\n      foto.alt = "LED desligado";\n    }\n  });\n}\n' } }

const WAV_BUZZER = (function () {

  const dv = new DataView(dados.buffer);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dados[o + i] = s.charCodeAt(i); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);

  for (let i = 0; i < n; i++) { const env = Math.min(1, i / 200, (n - i) / 400); dados[44 + i] = 128 + Math.round(60 * env * (Math.sin(2 * Math.PI * 880 * i / sr) > 0 ? 1 : -1)); }
  let b = ''; dados.forEach(x => { b += String.fromCharCode(x); });

})();

/* ---------- Proteção contra ciclos infinitos ---------- */
function protegerCiclos(code) {
  const guarda = 'if(++window.__lg>3e6){window.__lg=0;throw new Error("Ciclo infinito? O portal parou o ciclo depois de 3 000 000 voltas.");}';
  let out = '', i = 0;
  const N = code.length;
  while (i < N) {
    const ch = code[i], nx = code[i + 1];
    if (ch === '/' && nx === '/') { const f = code.indexOf('\n', i); const e = f < 0 ? N : f; out += code.slice(i, e); i = e; continue; }
    if (ch === '/' && nx === '*') { const f = code.indexOf('*/', i + 2); const e = f < 0 ? N : f + 2; out += code.slice(i, e); i = e; continue; }
    if (ch === '"' || ch === "'" || ch === '`') {
      let j = i + 1; while (j < N && code[j] !== ch) { if (code[j] === '\\') j++; j++; }
      out += code.slice(i, j + 1); i = j + 1; continue;
    }
    const resto = code.slice(i, i + 6);
    const m = /^(for|while)\b/.exec(resto) || (/^do\b/.test(resto) ? ['do', 'do'] : null);
    if (m && !/[\w$.]/.test(code[i - 1] || '')) {
      const kw = m[1];
      if (kw === 'do') {
        let j = i + 2; while (j < N && /\s/.test(code[j])) j++;
        if (code[j] === '{') { out += code.slice(i, j + 1) + guarda; i = j + 1; continue; }
      } else {
        let j = i + kw.length; while (j < N && /\s/.test(code[j])) j++;
        if (code[j] === '(') {
          let d = 0, k = j;
          for (; k < N; k++) { if (code[k] === '(') d++; else if (code[k] === ')') { d--; if (d === 0) break; } }
          let q = k + 1; while (q < N && /\s/.test(code[q])) q++;
          if (code[q] === '{') { out += code.slice(i, q + 1) + guarda; i = q + 1; continue; }
          if (code[q] === ';') { out += code.slice(i, q) + '{' + guarda + '}'; i = q; continue; }
        }
      }
    }
    out += ch; i++;
  }
  return out;
}

function reescreverCss(css) {

function construirDocumento(ficheiros, nomePagina, interno) {

  if (html == null) return '<!DOCTYPE html><html lang="pt"><body style="font:14px sans-serif;padding:1rem;color:#333"><h1>404</h1><p>A página ' + esc(nomePagina) + ' não existe nesta pasta.</p></body></html>';
  const css = ficheiros['css/estilo.css'], js = ficheiros['js/script.js'];
  // CSS externo ligado: substitui o link por um bloco style (o mesmo efeito que o navegador teria)
  html = html.replace(/<link\b[^>]*>/gi, tag => (/rel\s*=\s*["']?stylesheet/i.test(tag) && /href\s*=\s*["']css\/estilo\.css["']/i.test(tag) && css != null)
    ? '<style data-ficheiro="css/estilo.css">' + reescreverCss(css).replace(/<\/style/gi, '<\\/style') + '</style>' : tag);
  // JS externo: o código corre no mesmo sítio onde está a tag (defer passa para o fim do body)
  let adiado = '';
  html = html.replace(/<script\b([^>]*?)\bsrc\s*=\s*["']js\/script\.js["']([^>]*)>\s*<\/script>/gi, (m, a, b) => {
    if (js == null) return m;
    const bloco = '<script data-ficheiro="js/script.js">' + protegerCiclos(js).replace(/<\/script/gi, '<\\/script') + '\n//# sourceURL=js/script.js\n<\/script>';
    if (/\bdefer\b/i.test(a + b)) { adiado += bloco; return ''; }
    return bloco;
  });
  if (adiado) html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, adiado + '</body>') : html + adiado;
  // imagens e multimédia da pasta do projeto
  html = html.replace(/(<(?:img|source)\b[^>]*?\bsrc\s*=\s*)(["'])imagens\/([^"']+)\2/gi, (m, a, q, n) => IMAGENS[n] ? a + q + IMAGENS[n] + q + ' data-original="imagens/' + n + '"' : m);
  html = html.replace(/(<(?:audio|source)\b[^>]*?\bsrc\s*=\s*)(["'])media\/buzzer\.wav\2/gi, (m, a, q) => a + q + WAV_BUZZER + q + ' data-original="media/buzzer.wav"');
  html = html.replace(/(\sstyle\s*=\s*["'][^"']*?)url\(\s*["']?imagens\/([^"')]+)["']?\s*\)/gi, (m, a, n) => IMAGENS[n] ? a + "url('" + IMAGENS[n] + "')" : m);

      if (ficheiros[p] == null) return m;

      return '<iframe' + a + 'src=' + q + p + q + b + ' srcdoc="' + doc + '">';
    });

  // script de arranque do portal: depois do <head> (ou do <html>/DOCTYPE), sem estragar o DOCTYPE
  if (interno) return html;
  if (/<head\b[^>]*>/i.test(html)) return html.replace(/<head\b[^>]*>/i, t => t + ARRANQUE);
  if (/<html\b[^>]*>/i.test(html)) return html.replace(/<html\b[^>]*>/i, t => t + ARRANQUE);
  if (/^\s*<!doctype[^>]*>/i.test(html)) return html.replace(/^\s*<!doctype[^>]*>/i, t => t + ARRANQUE);
  return ARRANQUE + html;
}

/* ---------- Lint de HTML: encaixe das tags ---------- */
const VAZIOS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'source', 'track', 'wbr']);
function lintHtml(src) {
  const erros = [];
  if (!src) return erros;
  const limpo = src.replace(/<\!--[\s\S]*?-->/g, m => m.replace(/[^\n]/g, ' '))
    .replace(/(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\2>)/gi, (m, a, t, c, b) => a + c.replace(/[^\n]/g, ' ') + b);
  const linhaDe = i => limpo.slice(0, i).split('\n').length;
  const pilha = [];
  const re = /<\/?([a-zA-Z][\w-]*)\b[^>]*?(\/?)>/g;
  let m;
  while ((m = re.exec(limpo))) {
    const nome = m[1].toLowerCase(), fecho = m[0][1] === '/', ln = linhaDe(m.index);
    if (!fecho) { if (!VAZIOS.has(nome) && !m[2]) pilha.push({ nome, ln }); continue; }
    if (VAZIOS.has(nome)) { erros.push({ linha: ln, msg: nome + ' é um elemento vazio: não tem </' + nome + '>.' }); continue; }
    const topo = pilha[pilha.length - 1];
    if (topo && topo.nome === nome) { pilha.pop(); continue; }
    const k = pilha.map(p => p.nome).lastIndexOf(nome);
    if (k >= 0) {
      const aberto = pilha[pilha.length - 1];
      erros.push({ linha: ln, msg: '</' + nome + '> fecha antes de </' + aberto.nome + '> (aberto na linha ' + aberto.ln + '). O último elemento aberto fecha primeiro.' });
      pilha.length = k;
    } else {
      erros.push({ linha: ln, msg: '</' + nome + '> não tem tag de abertura correspondente.' });
    }
  }
  pilha.filter(p => !['html', 'head', 'body'].includes(p.nome)).forEach(p => erros.push({ linha: p.ln, msg: '<' + p.nome + '> aberto na linha ' + p.ln + ' nunca é fechado.' }));
  return erros.sort((a, b) => a.linha - b.linha);
}

/* ---------- Contraste WCAG ---------- */
function rgbDe(s) { const m = String(s).match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; }
function luminancia(c) { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); }
function contraste(fg, bg) {
  const a = rgbDe(fg), b0 = rgbDe(bg);
  const b = (!b0 || b0.a === 0) ? { r: 255, g: 255, b: 255 } : b0;
  if (!a) return 1;
  const l1 = luminancia(a), l2 = luminancia(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
const semComentariosCss = s => (s || '').replace(/\/\*[\s\S]*?\*\//g, '');
const semComentariosJs = s => (s || '').replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:"'\\])\/\/.*$/gm, '$1');

/* ---------- Contexto dos testes ---------- */
function contextoTestes() {
  const ifr = $('#preview');
  const doc = ifr.contentDocument, win = ifr.contentWindow;
  const src = ficheirosAtivos();
  const html = src[A.pagina] || '';
  return {
    doc, win, src, html,
    css: src['css/estilo.css'] || '', cssLimpo: semComentariosCss(src['css/estilo.css']),
    js: semComentariosJs(src['js/script.js']),
    $: s => doc.querySelector(s), $$: s => [...doc.querySelectorAll(s)],
    logs: () => A.logs.slice(),
    erros: () => A.logs.filter(l => l.tipo === 'erro').map(l => l.texto),
    alertas: () => A.logs.filter(l => l.tipo === 'alerta'),
    pag: nome => src[nome] != null ? new DOMParser().parseFromString(src[nome], 'text/html') : null,
    largura: async px => { UI.aplicarLargura(px || 0, true); await quadros(); await espera(30); },
    espera, sensor: n => Number(lerSerie(n)),
    lint: () => lintHtml(html), contraste,
    srcDe: el => { const s = el.getAttribute('src') || ''; return s.startsWith('data:') ? (el.getAttribute('data-original') || s) : s; },
    submeter: (sel, valores) => {
      const f = doc.querySelector(sel); if (!f) return 'Não encontrei o formulário ' + sel + '.';
      Object.keys(valores || {}).forEach(k => { const e = doc.querySelector(k); if (e) e.value = valores[k]; });
      $$('input[required], select[required], textarea[required]', f).forEach(e => {
        if (e.type === 'checkbox' || e.type === 'radio') { if (!f.querySelector('[name="' + e.name + '"]:checked')) e.checked = true; return; }
        if (!e.value) e.value = e.type === 'email' ? 'equipa@example.com' : e.type === 'number' ? (e.min || '1') : e.type === 'date' ? '2026-11-02' : 'Teste';
      });
      const antes = A.submissoes.length;
      if (!f.checkValidity()) return 'O navegador recusou a submissão: há campos inválidos (' + [...f.elements].filter(e => e.validity && !e.validity.valid).map(e => e.id || e.name).join(', ') + ').';
      if (f.requestSubmit) f.requestSubmit(); else f.submit();
      const novas = A.submissoes.slice(antes);
      if (!novas.length) return 'O evento submit não chegou a ser tratado.';
      if (novas.some(s => !s.ok)) return 'O formulário tentou mudar de página: falta evento.preventDefault().';
      return true;
    }
  };
}

/* ---------- Arduino virtual: firmware simulado do outro lado da porta série ---------- */
const Arduino = {
  pinoManual: {},
  serie(texto, dir) { UI.serie(texto, dir || 'tx'); },
  receber(msg) {
    this.serie('RX ← ' + msg, 'rx');
    this.serie('Arduino: mensagem recebida (' + String(msg).length + ' caracteres). LED L pisca.', 'tx');
    Bancada.piscarL();
  },
  configuracao(form) {
    try {
      const fd = new FormData(form); const partes = [];
      fd.forEach((v, k) => { if (typeof v === 'string' && v.trim()) partes.push(k + '=' + v.trim()); });
      this.serie('RX ← CONFIG ' + (partes.join(' ') || '(vazio)'), 'rx');
      this.serie('Arduino: configuração aplicada. OK', 'tx');
      Bancada.piscarL();
    } catch (e) { /* formulário sem dados */ }
  },
  comando(cmd) {
    const c = cmd.trim().toUpperCase();
    this.serie('RX ← ' + cmd, 'rx');
    if (c === 'LED ON') { this.pinoManual[13] = true; this.serie('OK: pino 13 = HIGH'); }
    else if (c === 'LED OFF') { this.pinoManual[13] = false; this.serie('OK: pino 13 = LOW'); }

    else if (c === 'LUZ?' || c === 'LUZ') this.serie('LDR=' + lerSerie('luz'));
    else if (c === 'POT?' || c === 'POT') this.serie('A0=' + lerSerie('potenciometro'));
    else if (c === 'AJUDA' || c === 'HELP') this.serie('Comandos: LED ON · LED OFF · TEMP? · LUZ? · POT? · AJUDA');

  }
};

const Bancada = (function () {
  const W = 640, H = 360;

      fundo.pixelDensity(p.pixelDensity());
      const g = fundo;
      g.push(); g.translate(ox, oy); g.scale(esc);

    const f = ficheirosAtivos(), nomes = ordenarFicheiros(Object.keys(f));
    A.pagina = f['index.html'] != null ? 'index.html' : (nomes.find(n => n.endsWith('.html')) || 'index.html');
    A.ficheiro = (m.abrir && f[m.abrir] != null) ? m.abrir : nomes[0] || null;
    if (m.etapas) { const et = etapaAtual(); A.ficheiro = et && et.ficheiros ? Object.keys(et.ficheiros).find(n => n.endsWith('.js') && /____|#mensagem|textcontent|contador/.test(et.ficheiros[n])) || 'index.html' : null; if (et && et.letra === 'B') A.ficheiro = 'css/estilo.css'; }

  function iniciarEditor() {

  async function correr() {

    const n = nivel(), feitas = PRINCIPAIS.filter(m => concluida(m.id)).length;
    const nome = E.aluno || 'Técnico/a sem nome';
    const corpo = '<div class="cartao-tec"><div class="cargo">PORTAL DA MINHA PAP · TEAC · M03</div><div class="nome">' + esc(nome) + '</div><div class="cargo">' + esc(NIVEIS[n]) + (E.turma ? ' · ' + esc(E.turma) : '') + ' · projeto: ' + esc(E.projetoNome) + '</div><div class="nums"><div><b>' + E.xp + '</b>XP</div><div><b>' + feitas + '/' + PRINCIPAIS.length + '</b>missões</div><div><b>' + E.emblemas.length + '</b>emblemas</div><div><b>' + E.componentes.length + '</b>componentes</div></div></div>' +
      (E.emblemas.length ? '<p style="margin-top:12px">Emblemas: ' + E.emblemas.map(k => esc(EMBLEMAS[k].nome)).join(' · ') + '</p>' : '');
    const resumo = 'Portal da minha PAP · ' + nome + ' · ' + NIVEIS[n] + ' · ' + E.xp + ' XP · ' + feitas + '/' + PRINCIPAIS.length + ' missões · emblemas: ' + (E.emblemas.map(k => EMBLEMAS[k].nome).join(', ') || 'nenhum');
    modal({ titulo: 'Cartão de técnico', corpo, acoes: [{ t: 'Fechar' }, { t: icone('copiar') + ' Copiar resumo', cls: 'prim', manter: true, f: () => { copiar(resumo); return false; } }] });
  }
  function readme() {
    const f = E.projeto;
    const funcs = [];
    if (/addEventListener\(\s*["']submit/.test(f['js/script.js'] || '')) funcs.push('Formulário de configuração com resposta de demonstração (nada é enviado).');
    if (/classList\.toggle/.test(f['js/script.js'] || '')) funcs.push('Botão que alterna o estado de um elemento.');
    if (/@media/.test(f['css/estilo.css'] || '')) funcs.push('Layout responsivo com media queries.');
    if (!funcs.length) funcs.push('(descreve aqui as funcionalidades)');
    return '# Portal da minha PAP – ' + (E.projetoNome || 'projeto') + '\n\nAutor: ' + (E.aluno || '(nome)') + (E.turma ? ' · ' + E.turma : '') + '\nCurso Profissional TEAC · M03 Criação de Páginas Web\n\n## Tema\n' + (E.projetoNome || '') + ': website de apoio ao projeto de PAP com Arduino.\n\n## Como abrir\n1. Extrair o ZIP.\n2. Abrir a pasta meu_site no VS Code.\n3. Abrir index.html com o Live Server (ou diretamente no navegador).\n\n## Páginas\n- index.html: painel de controlo\n- projeto.html: descrição do projeto\n- contacto.html: contacto da equipa\n\n## Funcionalidades\n' + funcs.map(x => '- ' + x).join('\n') + '\n\n## Fontes das imagens\n- imagens/*.svg: ilustrações criadas para o Portal da minha PAP.\n\n## Limitações conhecidas\n- O formulário não transmite nem guarda dados (demonstração).\n- Os valores dos sensores no portal eram simulados.\n';
  }
  function exportarWebsite() {
    const f = E.projeto, nomes = ordenarFicheiros(Object.keys(f));
    let corpo = '<p>O teu website (Projeto PAP) na estrutura <code>meu_site/</code>, com imagens, som e README. Descarrega o ZIP ou copia cada ficheiro.</p><div class="export-l">';
    nomes.concat(['README.md']).forEach(n => { corpo += '<div class="f"><span>meu_site/' + esc(n) + '</span><button type="button" class="btn" data-cp="' + esc(n) + '">' + icone('copiar') + 'Copiar</button></div>'; });
    corpo += '</div>';
    modal({ titulo: 'Exportar o meu website', corpo, acoes: [{ t: 'Fechar' }, { t: icone('export') + ' Descarregar ZIP', cls: 'prim', manter: true, f: () => { gerarZip(); return false; } }], aoAbrir: () => {
      $$('[data-cp]').forEach(b => b.onclick = () => copiar(b.dataset.cp === 'README.md' ? readme() : f[b.dataset.cp]));
    } });
  }
  async function gerarZip() {
    if (typeof JSZip === 'undefined') { toast('ZIP indisponível', 'Usa os botões Copiar.', 'aviso'); return; }
    const z = new JSZip(), r = z.folder('meu_site');
    Object.keys(E.projeto).forEach(n => r.file(n, E.projeto[n]));
    Object.keys(SVG).forEach(n => r.file('imagens/' + n, SVG[n]));
    r.file('media/buzzer.wav', WAV_BUZZER.split(',')[1], { base64: true });
    r.file('README.md', readme());
    const blob = await z.generateAsync({ type: 'blob' });
    descarregar('meu_site.zip', blob);
  }
  function dadosProgresso() {
    return {
      aluno: E.aluno, turma: E.turma, projeto: E.projetoNome, xp: E.xp, nivel: NIVEIS[nivel()], emblemas: E.emblemas, componentes: E.componentes.length,
      previsoesCertas: E.previsoesCertas, quizzes: E.quizzes, avaliacao: E.avaliacao,
      missoes: MISSOES.map(m => { const s = E.missoes[m.id] || {}; return { id: m.id, titulo: m.titulo, estado: s.estado || 'nova', xp: s.xp || 0, tentativas: s.tentativas || 0, pistas: s.pistas || 0, solucaoAntecipada: !!s.solucao, minutos: s.tempo ? Math.round(s.tempo / 60000) : 0, previsao: s.previsao ? (s.previsao.r === (m.previsao || {}).certa ? 'certa' : 'errada') : '' }; })
    };
  }
  function exportarProgresso() {
    const d = dadosProgresso(), json = JSON.stringify(d, null, 2);
    const csv = 'id;titulo;estado;xp;tentativas;pistas;solucao_antecipada;minutos;previsao\n' + d.missoes.map(x => [x.id, '"' + x.titulo + '"', x.estado, x.xp, x.tentativas, x.pistas, x.solucaoAntecipada ? 'sim' : 'nao', x.minutos, x.previsao].join(';')).join('\n');
    modal({ titulo: 'Exportar progresso', corpo: '<p>Progresso de <b>' + esc(E.aluno || 'aluno sem nome') + '</b>. Copia o JSON ou o CSV (separador ;) para a tua folha de registo.</p><div class="h-sec">CSV</div><pre class="codigo-ro" style="max-height:180px">' + esc(csv) + '</pre>', acoes: [{ t: 'Fechar' }, { t: 'Copiar JSON', manter: true, f: () => { copiar(json); return false; } }, { t: 'Copiar CSV', cls: 'prim', manter: true, f: () => { copiar(csv); return false; } }, { t: 'Descarregar CSV', manter: true, f: () => { descarregar('progresso-' + (E.aluno || 'aluno').replace(/\s+/g, '-') + '.csv', new Blob(['﻿' + csv], { type: 'text/csv' })); return false; } }] });
  }
  function grelhaAvaliacao() {
    const C = [['estrutura', 'Estrutura HTML, semântica e conteúdo', 25], ['css', 'CSS e organização visual', 20], ['resp', 'Responsividade', 20], ['js', 'JavaScript e clareza das interações', 15], ['acess', 'Acessibilidade e qualidade do código', 10], ['testes', 'Testes e explicação do trabalho', 10]];
    const v = E.avaliacao;
    const calc = () => C.reduce((s, c) => s + (Number(v[c[0]]) || 0) * c[2] / 100, 0);
    const corpo = '<p>Classifica cada critério de 0 a 20. A nota final é a média ponderada (sebenta p. 48).</p><table class="ficha"><thead><tr><th scope="col">Critério</th><th scope="col">Peso</th><th scope="col">0–20</th></tr></thead><tbody>' + C.map(c => '<tr><td><label for="g-' + c[0] + '">' + c[1] + '</label></td><td>' + c[2] + '%</td><td><input id="g-' + c[0] + '" type="number" min="0" max="20" step="0.5" value="' + (v[c[0]] != null ? v[c[0]] : '') + '" style="width:70px;padding:4px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2)"></td></tr>').join('') + '</tbody></table><p style="font-size:16px;margin-top:12px">Nota final: <b id="g-final" class="mono">' + calc().toFixed(1) + '</b> valores</p>';
    modal({ titulo: 'Grelha de avaliação', corpo, aoAbrir: () => { C.forEach(c => { const i = $('#g-' + c[0]); i.oninput = () => { v[c[0]] = i.value === '' ? null : Math.max(0, Math.min(20, +i.value)); $('#g-final').textContent = calc().toFixed(1); guardar(); }; }); } });
  }
  function resumoMissoes() {
    const d = dadosProgresso();
    const corpo = '<div style="overflow-x:auto"><table class="ficha"><thead><tr><th scope="col">Missão</th><th scope="col">Estado</th><th scope="col">XP</th><th scope="col">Tent.</th><th scope="col">Pistas</th><th scope="col">Min.</th></tr></thead><tbody>' + d.missoes.map(x => '<tr><td>' + esc(x.id + ' · ' + x.titulo) + '</td><td>' + esc(x.estado) + '</td><td>' + x.xp + '</td><td>' + x.tentativas + '</td><td>' + x.pistas + '</td><td>' + x.minutos + '</td></tr>').join('') + '</tbody></table></div>';
    modal({ titulo: 'Resumo por missão', corpo });
  }
  function reporTudo() {
    modal({ titulo: 'Repor todo o progresso', corpo: '<p>Apaga XP, missões, emblemas, diário e o Projeto PAP deste navegador. Não pode ser desfeito.</p><div class="campo"><label for="rep-conf">Escreve REPOR para confirmar</label><input id="rep-conf" autocomplete="off"></div>', acoes: [{ t: 'Cancelar' }, { t: 'Repor tudo', cls: 'perigo', f: () => { if ($('#rep-conf').value.trim() !== 'REPOR') { toast('Confirmação em falta', 'Escreve REPOR.', 'aviso'); return false; } const prof = E.professor; E = novoEstado(); E.professor = prof; Object.keys(docs).forEach(k => delete docs[k]); guardar(true); abrirMissao('01'); renderLateral(); renderTopo(); toast('Progresso reposto'); } }] });
  }

  /* ---------------- Terminal: comandos ---------------- */
  function comando(linha) {
    const c = linha.trim().toLowerCase(); if (!c) return;
    ohm('<span class="p">tu&gt;</span> ' + esc(linha), 's');
    const m = A.missao;
    const cmds = {
      ajuda: () => ohm('Comandos: pista · testar · missao · estado · proxima · protocolo · serie · limpar · blink · quem', 'c'),
      pista: pedirPista, testar: correr, compilar: correr,
      missao: () => { ohm(esc(m.briefing)); },
      estado: () => ohm(esc(NIVEIS[nivel()]) + ' · ' + E.xp + ' XP · ' + PRINCIPAIS.filter(x => concluida(x.id)).length + '/' + PRINCIPAIS.length + ' missões · ' + E.emblemas.length + ' emblemas.', 'c'),
      proxima: () => { const p = PRINCIPAIS.find(x => !concluida(x.id)); if (p && desbloqueada(p)) abrirMissao(p.id); else ohm('Não há missões desbloqueadas por concluir.', 's'); },
      protocolo: () => PROTOCOLO.forEach((p, i) => ohm((i + 1) + '. ' + esc(p), 'c')),
      serie: () => mudarInf('serie'),
      limpar: () => { $('#term').innerHTML = ''; },
      blink: () => { Bancada.celebrar(); ohm('void loop() { digitalWrite(13, !digitalRead(13)); delay(500); }', 'c'); },
      quem: () => ohm('Eng.ª Ohm: mentora técnica da bancada. Resistência à frustração: 220 Ω. Tolerância: 5 %.', 'c'),
      ohm: () => ohm('V = R × I. Sempre.', 'c')
    };
    if (cmds[c]) cmds[c]();
    else if (/^sudo\b/.test(c)) ohm('Permissão negada. Nesta bancada, quem manda é a sebenta.', 'a');
    else if (c === 'rm -rf /' || c === 'format c:') ohm('Boa tentativa. O fusível disparou.', 'a');
    else ohm('Comando desconhecido: ' + esc(c) + '. Escreve ajuda.', 'a');
  }

  /* ---------------- Tema e vistas ---------------- */
  function aplicarTema() {
    const r = document.documentElement;
    if (E.def.tema === 'escuro') r.setAttribute('data-theme', 'dark');
    else if (E.def.tema === 'claro') r.setAttribute('data-theme', 'light');
    else r.removeAttribute('data-theme');
  }
  function temaEscuroEfetivo() { const t = document.documentElement.getAttribute('data-theme'); if (t) return t === 'dark'; return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); }
  function mudarVista(v) {
    $('#app').dataset.vista = v;
    $$('.vistas [data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === v)));
    if (v === 'consola') mudarInf(A.inf === 'terminal' ? 'terminal' : A.inf);
    setTimeout(() => { if (cm) cm.refresh(); aplicarLargura(A.largura); }, 30);
  }

  /* ---------------- Arranque ---------------- */
  function sequencia() {
    const hoje = dataLocal();
    if (E.streak.ultimo === hoje) return;
    const ontem = dataLocal(new Date(Date.now() - 864e5));
    if (E.streak.ultimo === ontem) { E.streak.dias++; E.xp += 10; setTimeout(() => toast('Série de ' + E.streak.dias + ' dias', '+10 XP por voltares à bancada.', 'xp'), 1200); }
    else E.streak.dias = 1;
    E.streak.ultimo = hoje; guardar();
  }
  function iniciar() {
    aplicarTema();
    sequencia();
    iniciarEditor();
    Bancada.iniciar($('#bancada'));
    Bancada.aoSensor(() => { sensoresParaControlos(); });
    sensoresParaControlos();
    $('#r-temp').oninput = e => { SENS.temperatura = +e.target.value; sensoresParaControlos(); };
    $('#r-pot').oninput = e => { SENS.potenciometro = +e.target.value; };
    $('#b-ldr').onclick = () => { Bancada.alternarLdr(); sensoresParaControlos(); };
    $$('.atividades [data-painel]').forEach(b => b.onclick = () => abrirPainel(b.dataset.painel, true));
    $('#btn-menu').onclick = () => { const app = $('#app'); app.classList.toggle('lateral-aberta'); if (app.classList.contains('lateral-aberta')) renderLateral(); marcarAtividades(); };
    $('#btn-fechar-lateral').onclick = fecharLateral;
    $('#btn-tema').onclick = () => { E.def.tema = temaEscuroEfetivo() ? 'claro' : 'escuro'; aplicarTema(); guardar(); if (A.painel === 'definicoes') renderLateral(); };
    $$('.inf-tabs [data-inf]').forEach(b => b.onclick = () => mudarInf(b.dataset.inf));
    $$('.vistas [data-vista]').forEach(b => b.onclick = () => mudarVista(b.dataset.vista));
    $$('.seg [data-larg]').forEach(b => b.onclick = () => aplicarLargura(+b.dataset.larg));
    $('#sel-pagina').onchange = e => { A.pagina = e.target.value; const f = ficheirosAtivos(); if (f[A.pagina] != null) abrirFicheiro(A.pagina); recarregar(); };
    $('#sb-run').onclick = correr;
    $('#term-form').onsubmit = e => { e.preventDefault(); const i = $('#term-input'); comando(i.value); i.value = ''; };
    $('#serie-form').onsubmit = e => { e.preventDefault(); const i = $('#serie-input'); if (i.value.trim()) Arduino.comando(i.value); i.value = ''; };
    document.addEventListener('keydown', e => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key === 'Enter') { e.preventDefault(); correr(); }
      else if (mod && (e.key === 'h' || e.key === 'H')) { e.preventDefault(); pedirPista(); }
      else if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); guardar(true); toast('Guardado'); }
    });
    if ('ResizeObserver' in window) new ResizeObserver(() => aplicarLargura(A.largura)).observe($('#preview-area'));
    window.addEventListener('resize', () => { marcarAtividades(); });
    setInterval(ponteBancada, 250);
    if (estreito()) $('#app').classList.add('sem-lateral');
    Arduino.serie('Arduino Uno pronto · 9600 baud · escreve AJUDA', 'tx');
    renderLateral(); marcarAtividades();
    const ini = MAPA[E.ultima] && desbloqueada(MAPA[E.ultima]) ? E.ultima : '01';
    abrirMissao(ini);
    aplicarLargura(0);
  }

  return { iniciar, navegar, aplicarLargura, consolaAgendar, serie, toast, abrirMissao, correr };
})();

document.addEventListener('DOMContentLoaded', () => UI.iniciar());
if (document.readyState !== 'loading') UI.iniciar();

</script>
