name: Atualizar índice de projetos

# Sempre que se carrega ou apaga um ficheiro numa pasta, volta a gerar o
# projetos.json que a página inicial (index.html) usa para montar os cartões.
on:
  push:
    branches: [main]
    paths-ignore:
      - projetos.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar projetos.json
        run: python .github/gerar_projetos.py
      - name: Guardar alterações
        run: |
          if git diff --quiet --exit-code -- projetos.json && git ls-files --error-unmatch projetos.json >/dev/null 2>&1; then
            echo "Sem alterações."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projetos.json
          git commit -m "Atualiza índice de projetos"
          git push
