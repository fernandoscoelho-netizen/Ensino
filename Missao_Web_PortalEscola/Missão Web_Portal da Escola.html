<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missão Web</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Planta da escola como mapa de progresso; cada missão é uma bancada de três painéis: missão, código, resultado. */
:root{
  --bg:#E6ECEA; --surface:#FFFFFF; --surface-2:#F2F6F4; --ink:#132321; --muted:#536664; --line:#C3D1CE;
  --chalk:#1C5A4A; --chalk-ink:#FFFFFF; --chalk-soft:#D5E7DF;
  --sun:#E2A82C; --sun-soft:#FBEBC4; --sun-ink:#3A2A00;
  --ok:#21734A; --ok-bg:#E0F0E6; --err:#B3392A; --err-bg:#F7E3DF; --warn:#8F5500; --warn-bg:#FAEED6;
  --code-bg:#10201E; --code-ink:#D8E7E3; --code-dim:#86A39D; --code-mark:#F2C14E; --code-line:#23413C;
  --room-on:#CBE5D7; --room-off:#E0E6E4;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1716; --surface:#142220; --surface-2:#192A28; --ink:#E2EEEA; --muted:#94AAA6; --line:#2B403C;
    --chalk:#5CBF98; --chalk-ink:#05231A; --chalk-soft:#1E3A31;
    --sun:#F0BE4E; --sun-soft:#3A3018; --sun-ink:#F8E3B0;
    --ok:#62C48D; --ok-bg:#15301F; --err:#F08A78; --err-bg:#3A1C17; --warn:#F0B35A; --warn-bg:#36290F;
    --code-bg:#091312; --code-ink:#D8E7E3; --code-dim:#7C978F; --code-mark:#F2C14E; --code-line:#1D3531;
    --room-on:#22493B; --room-off:#1B2927;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1716; --surface:#142220; --surface-2:#192A28; --ink:#E2EEEA; --muted:#94AAA6; --line:#2B403C;
  --chalk:#5CBF98; --chalk-ink:#05231A; --chalk-soft:#1E3A31;
  --sun:#F0BE4E; --sun-soft:#3A3018; --sun-ink:#F8E3B0;
  --ok:#62C48D; --ok-bg:#15301F; --err:#F08A78; --err-bg:#3A1C17; --warn:#F0B35A; --warn-bg:#36290F;
  --code-bg:#091312; --code-ink:#D8E7E3; --code-dim:#7C978F; --code-mark:#F2C14E; --code-line:#1D3531;
  --room-on:#22493B; --room-off:#1B2927;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .3em;white-space:nowrap}
button{font:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{min-height:100%}

.btn{display:inline-flex;align-items:center;gap:.4em;font:700 .92rem/1.2 var(--f-body);padding:.55rem .9rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--chalk)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--line)}
.btn-danger{background:var(--err);border-color:var(--err);color:var(--surface)}
.eyebrow{font:700 .74rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- topo ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1.5px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.mark{width:42px;height:42px;border-radius:10px;background:var(--chalk);color:var(--chalk-ink);display:grid;place-items:center;font:800 1rem var(--f-display);letter-spacing:-.02em}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:8px}
.who label{font-weight:700;font-size:.9rem;color:var(--muted)}
.who input{font:inherit;padding:.45rem .6rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:12rem;max-width:44vw}
.prog{display:grid;gap:4px;min-width:150px}
.prog span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transition:width .6s ease}

/* ---------- mapa ---------- */
.map-screen{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.story{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end}
.story h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:800;letter-spacing:-.02em;max-width:22ch}
.story p{color:var(--muted);max-width:62ch;grid-column:1}
.story .legend{grid-column:2;grid-row:1 / span 2;display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:16px;height:12px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
.legend .l-off{background:repeating-linear-gradient(45deg,var(--room-off) 0 3px,var(--line) 3px 5px)}
.legend .l-open{background:var(--surface);border-style:dashed;border-color:var(--chalk)}
.legend .l-on{background:var(--room-on)}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.plan svg{display:block;width:100%;min-width:620px;height:auto}
.wall{fill:var(--surface-2);stroke:var(--ink);stroke-width:3}
.hatch-line{stroke:var(--line);stroke-width:3}
.room .floor{fill:var(--room-off);stroke:var(--ink);stroke-width:2;transition:fill .8s ease}
.room .hatch{fill:url(#hatch);transition:opacity .8s ease}
.room .art{opacity:.28;transition:opacity .8s ease}
.room .art .s{stroke:var(--ink);stroke-width:2;fill:none}
.room .art .f1{fill:var(--chalk)} .room .art .f2{fill:var(--sun)} .room .art .f3{fill:var(--ink)} .room .art .f4{fill:var(--surface)}
.room .name{font:800 17px var(--f-display);fill:var(--ink)}
.room .state{font:700 11px var(--f-body);fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.room .pip{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.room .pip.on{fill:var(--sun)}
.room.clickable{cursor:pointer}
.room.clickable:hover .floor,.room.clickable:focus-visible .floor{stroke:var(--chalk);stroke-width:3}
.room:focus{outline:none}
.room.open .floor{fill:var(--surface);stroke:var(--chalk);stroke-dasharray:7 5}
.room.open .hatch{opacity:.35}
.room.open .art{opacity:.45}
.room.done .floor{fill:var(--room-on)}
.room.done .hatch{opacity:0}
.room.done .art{opacity:1}
.room.done .state{fill:var(--ok)}
.room.just .floor{animation:glow 1.6s ease 2}
@keyframes glow{50%{fill:var(--sun-soft);stroke:var(--sun);stroke-width:4}}
.door{stroke:var(--surface-2);stroke-width:5}
.portal-num{font:800 44px var(--f-display);fill:var(--ink);font-variant-numeric:tabular-nums}
.portal-lbl{font:700 12px var(--f-body);fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mcard{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.mcard.locked{background:transparent;border-style:dashed}
.mcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mcard h3{font-size:1.15rem;font-weight:800}
.mcard .learn{font-size:.9rem;color:var(--muted)}
.mnum{font:800 .8rem var(--f-display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{font:700 .74rem/1 var(--f-body);padding:.35rem .55rem;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.p-done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.p-go{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-ink)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 .76rem/1 var(--f-body);padding:.32rem .55rem;border-radius:6px;border:1.5px dashed var(--line);color:var(--muted)}
.badge svg{width:13px;height:13px}
.badge.on{border-style:solid;border-color:var(--chalk);background:var(--chalk-soft);color:var(--ink)}
.mcard .btn{justify-self:start}

/* ---------- missão ---------- */
.mission{display:flex;flex-direction:column;min-height:100%}
@media (min-width:1100px){ .mission{height:100%} }
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1.5px solid var(--line)}
.mtitle{margin-right:auto;min-width:0}
.mtitle h1{font-size:1.25rem;font-weight:800}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:8px;padding:.4rem .7rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font:700 .86rem var(--f-body)}
.lvl .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:800 .68rem var(--f-display)}
.lvl.done .dot{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.lvl[aria-current="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink)}
.lvl[aria-current="true"] .dot{border-color:var(--chalk-ink)}
.lvl[disabled]{opacity:.45;cursor:not-allowed}

.bench{flex:1;min-height:0;display:grid;gap:12px;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));grid-template-columns:minmax(270px,.85fr) minmax(0,1.25fr) minmax(0,1.15fr)}
.pane{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1.5px solid var(--line);min-height:46px}
.pane-h .ttl{font:800 .8rem var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.pane-h .kind{font-size:.82rem;color:var(--muted);font-weight:700}
.pane-b{padding:14px;overflow:auto;flex:1;min-height:0;display:grid;gap:14px;align-content:start}
.brief h2{font-size:1.3rem;font-weight:800}
.brief .sit,.brief .obj{max-width:62ch}
.brief .obj{background:var(--sun-soft);color:var(--sun-ink);border-radius:8px;padding:10px 12px}
.lbl{font:800 .75rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.req{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.req li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:.95rem}
.req .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font:800 .75rem var(--f-display)}
.req li.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.req li.ok .mk::after{content:"✓"}
.req li.fail .mk{border-color:var(--err);color:var(--err)}
.req li.fail .mk::after{content:"!"}
.feedback{border-radius:8px;padding:10px 12px;font-size:.95rem;border:1.5px solid transparent}
.feedback:empty{display:none}
.feedback.f-err{background:var(--err-bg);border-color:var(--err)}
.feedback.f-warn{background:var(--warn-bg);border-color:var(--warn)}
.feedback.f-ok{background:var(--ok-bg);border-color:var(--ok)}
.feedback.f-info{background:var(--surface-2);border-color:var(--line)}
.feedback strong{display:block;margin-bottom:2px}
.hints{display:grid;gap:8px}
.hint{border-left:3px solid var(--chalk);background:var(--surface-2);padding:8px 10px;border-radius:0 8px 8px 0;font-size:.93rem;display:grid;gap:6px}
.hint b{font:800 .72rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk)}
.hint pre{margin:0;background:var(--code-bg);color:var(--code-ink);font:400 .8rem/1.5 var(--f-mono);padding:8px 10px;border-radius:6px;overflow-x:auto}
.success{display:grid;gap:10px;border:1.5px solid var(--ok);background:var(--ok-bg);border-radius:10px;padding:12px}
.success .win{font:800 1.1rem var(--f-display);color:var(--ok)}
.success label{font-weight:700}
.success .q{font-size:.92rem;color:var(--muted)}
.success textarea{font:inherit;font-size:.95rem;min-height:90px;resize:vertical;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}
.success .acts{display:flex;flex-wrap:wrap;gap:8px}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:700 .78rem var(--f-mono);padding:.3rem .55rem;border-radius:6px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--code-bg);color:var(--code-ink);border-color:var(--code-bg)}
.tab .ro{font-family:var(--f-body);font-weight:400}
.code .pane-b{background:var(--code-bg);color:var(--code-ink);padding:0;display:flex;flex-direction:column;gap:0}
.codeview{display:flex;flex-direction:column;flex:1;min-height:0}
.codeview[hidden]{display:none!important}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:12px;border-bottom:1px solid var(--code-line);background:var(--code-bg)}
.ctl{display:grid;gap:4px;font:700 .78rem var(--f-body);color:var(--code-dim)}
.ctl select,.ctl input[type=text]{font:500 .85rem var(--f-mono);padding:.4rem .5rem;border-radius:6px;border:1.5px solid var(--code-line);background:var(--code-line);color:var(--code-ink);width:100%;min-width:0}
.ctl input[type=range]{width:100%;accent-color:var(--code-mark)}
.ctl output{font:600 .82rem var(--f-mono);color:var(--code-mark)}
pre.src{margin:0;padding:12px 14px;font:400 .86rem/1.65 var(--f-mono);color:var(--code-ink);white-space:pre;overflow:auto;flex:1;min-height:0;tab-size:2}
pre.src mark{background:rgba(242,193,78,.18);color:var(--code-mark);border-radius:3px;padding:0 2px}
pre.src mark:empty{display:inline-block;min-width:1.2ch;height:1.1em;vertical-align:-2px;border-bottom:2px solid var(--code-mark);background:transparent}
pre.src.ro{color:var(--code-dim)}
input.blank{font:600 .86rem/1.3 var(--f-mono);color:var(--code-mark);background:rgba(242,193,78,.12);border:0;border-bottom:2px solid var(--code-mark);border-radius:3px 3px 0 0;padding:0 3px;margin:0 1px;min-width:3ch}
input.blank:focus{outline:2px solid var(--code-mark);outline-offset:1px}
input.blank.filled{background:transparent}
textarea.editor{flex:1;min-height:300px;width:100%;resize:none;border:0;background:var(--code-bg);color:var(--code-ink);font:400 .86rem/1.65 var(--f-mono);padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--code-mark)}
textarea.editor:focus{outline:none;box-shadow:inset 0 0 0 2px var(--code-line)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-top:1.5px solid var(--line)}
.actions .tip{font-size:.8rem;color:var(--muted);margin-left:auto}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:.3rem .65rem;font:700 .8rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{flex:1;min-height:320px;background:var(--surface-2);overflow:auto;display:flex;justify-content:center;padding:10px}
.stage iframe{border:0;background:#fff;width:100%;height:100%;min-height:300px;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.stage.phone iframe{width:360px;flex:none}
.console{border-top:1.5px solid var(--line);max-height:30%;min-height:72px;display:flex;flex-direction:column}
.console-h{font:800 .72rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 12px 2px}
.console ol{list-style:none;margin:0;padding:2px 12px 8px;overflow:auto;font:400 .8rem/1.5 var(--f-mono);display:grid;gap:2px}
.console li.c-error{color:var(--err)}
.console li.c-warn{color:var(--warn)}
.console li.c-info{color:var(--muted)}
.console li.c-empty{color:var(--muted);font-family:var(--f-body)}

@media (max-width:1099px){
  .bench{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .brief{grid-column:1 / -1}
  .brief .pane-b{max-height:none}
  .code,.result{min-height:520px}
}
@media (max-width:760px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .code,.result{min-height:460px}
  .story{grid-template-columns:minmax(0,1fr)}
  .story .legend{grid-column:1;grid-row:auto;display:flex;flex-wrap:wrap;gap:12px}
  .stage.phone iframe{width:100%}
}

/* ---------- relatório ---------- */
.teacher{max-width:1100px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.teacher h2{font-size:1.7rem;font-weight:800}
.teacher section{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.teacher h3{font-size:1.1rem;font-weight:800}
.teacher .muted{color:var(--muted);font-size:.93rem;max-width:70ch}
.tbl-wrap{overflow-x:auto}
table.rep{border-collapse:collapse;width:100%;font-size:.9rem;min-width:640px}
table.rep th,table.rep td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep th{font:800 .72rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.rep td.num{font-variant-numeric:tabular-nums;text-align:right}
table.rep th.num{text-align:right}
table.rep .expl{max-width:40ch;color:var(--muted);font-style:italic}
.teacher textarea{font:400 .8rem/1.4 var(--f-mono);width:100%;min-height:90px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:8px;resize:vertical}
.teacher .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--chalk)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--err-bg);border:1.5px solid var(--err);border-radius:8px;padding:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:.7rem 1rem;border-radius:10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
.testframe{position:fixed;left:-30000px;top:0;height:2000px;border:0;visibility:hidden;pointer-events:none}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

<div id="app"></div>

<script>
"use strict";
/* =========================================================
   Imagens disponíveis dentro das páginas dos alunos
   ========================================================= */
function makeArt(kind){
  let seed = kind.length * 97 + 13;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const W = 480, H = 240;
  const cols = ['#1d5c4b','#e2a82c','#b3392a','#3d6f9e','#7a5a9e','#4f8a3c'];
  let s = '';
  if (kind === 'biblioteca' || kind === 'sala-estudo') {
    s += `<rect width="${W}" height="${H}" fill="#e8f1ee"/>`;
    if (kind === 'biblioteca') {
      for (let r = 0; r < 3; r++) {
        const y = 70 + r * 66;
        let x = 40;
        while (x < 430) {
          const w = 10 + Math.floor(rnd() * 14), h = 34 + Math.floor(rnd() * 20);
          s += `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" rx="2" fill="${cols[Math.floor(rnd() * cols.length)]}"/>`;
          x += w + 3;
        }
        s += `<rect x="30" y="${y}" width="420" height="7" fill="#7a5a3a"/>`;
      }
    } else {
      for (let i = 0; i < 3; i++) {
        const x = 40 + i * 145;
        s += `<rect x="${x}" y="150" width="120" height="12" rx="3" fill="#7a5a3a"/><rect x="${x + 10}" y="162" width="6" height="50" fill="#7a5a3a"/><rect x="${x + 104}" y="162" width="6" height="50" fill="#7a5a3a"/>`;
        s += `<rect x="${x + 30}" y="104" width="60" height="40" rx="4" fill="#2b3b44"/><rect x="${x + 34}" y="108" width="52" height="32" fill="#9ed3c4"/><rect x="${x + 22}" y="144" width="76" height="6" rx="2" fill="#2b3b44"/>`;
      }
      s += `<rect x="40" y="30" width="400" height="44" rx="6" fill="#ffffff" stroke="#1d5c4b" stroke-width="3"/><text x="240" y="59" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1d5c4b">Silêncio, por favor</text>`;
    }
  } else if (kind === 'clube') {
    s += `<rect width="${W}" height="${H}" fill="#fdf3dc"/><path d="M20 40 Q240 90 460 40" stroke="#5a4a2a" stroke-width="2" fill="none"/>`;
    for (let i = 0; i < 9; i++) {
      const x = 40 + i * 48, y = 40 + Math.sin((i / 8) * Math.PI) * 24;
      s += `<path d="M${x} ${y} l18 0 l-9 26 z" fill="${cols[i % cols.length]}"/>`;
    }
    s += `<circle cx="150" cy="160" r="42" fill="#1d5c4b"/><rect x="230" y="120" width="90" height="80" rx="10" fill="#e2a82c"/><path d="M380 200 l40 -80 l40 80 z" fill="#3d6f9e"/>`;
  } else {
    s += `<rect width="${W}" height="${H}" fill="#e6ecea"/><path d="M60 190 L170 90 L250 160 L320 110 L420 190 Z" fill="#9fbfb4"/><circle cx="360" cy="70" r="26" fill="#e2a82c"/><text x="240" y="225" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#536664">imagem de exemplo</text>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const IMGS = {
  'biblioteca.svg': makeArt('biblioteca'),
  'sala-estudo.svg': makeArt('sala-estudo'),
  'clube.svg': makeArt('clube'),
  'imagem.svg': makeArt('imagem')
};

/* =========================================================
   Código injetado na área de pré-visualização (corre isolado)
   ========================================================= */
function mwHook(cfg){
  var T = cfg.token;
  function send(type, data){ try { parent.postMessage({ __mw: T, type: type, data: data }, '*'); } catch (e) {} }
  window.__mwErrors = [];
  window.addEventListener('error', function(e){
    var ln = e.lineno ? e.lineno - cfg.offset : 0;
    var m = (e.message || 'Erro') + (ln > 0 && cfg.offset > 0 ? ' (linha ' + ln + ')' : '');
    window.__mwErrors.push(m); send('error', m);
  });
  ['log','info','warn','error'].forEach(function(k){
    var o = console[k];
    console[k] = function(){
      var p = [];
      for (var i = 0; i < arguments.length; i++) {
        var x = arguments[i];
        try { p.push(typeof x === 'object' && x !== null ? JSON.stringify(x) : String(x)); } catch (_) { p.push(String(x)); }
      }
      send('log', { k: k, t: p.join(' ') });
      try { o.apply(console, arguments); } catch (_) {}
    };
  });
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var h = (a.getAttribute('href') || '').trim();
    if (h.charAt(0) === '#' && h.length > 1) return;
    e.preventDefault();
    send('log', { k: 'info', t: h ? 'Esta ligação abriria: ' + h : 'Esta ligação não tem endereço (href).' });
  }, true);
  function fixImgs(){
    var list = document.querySelectorAll('img');
    for (var i = 0; i < list.length; i++) {
      var img = list[i], s = (img.getAttribute('src') || '').trim();
      if (!s || /^(data:|blob:)/.test(s)) continue;
      var key = s.split('/').pop();
      img.setAttribute('data-mw-src', s);
      img.src = cfg.imgs[key] || cfg.imgs['imagem.svg'];
    }
  }
  document.addEventListener('DOMContentLoaded', fixImgs);
  if (cfg.mode === 'preview') {
    window.addEventListener('submit', function(e){
      if (!e.defaultPrevented) {
        e.preventDefault();
        send('log', { k: 'warn', t: 'O formulário foi enviado e a página teria recarregado. Usa evento.preventDefault() para o impedir.' });
      }
    });
  }
}

function mwHelpers(){
  var Z = { left:0, right:0, top:0, bottom:0, width:0, height:0 };
  function q(s, root){ return (root || document).querySelector(s); }
  function qa(s, root){ return Array.prototype.slice.call((root || document).querySelectorAll(s)); }
  function r(el){ return el ? el.getBoundingClientRect() : Z; }
  function cs(el){ return el ? getComputedStyle(el) : {}; }
  function text(el){ return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : ''; }
  function overflow(){ return document.documentElement.scrollWidth > window.innerWidth + 1; }
  return {
    q: q, qa: qa, r: r, cs: cs, text: text, overflow: overflow,
    ok: function(c, fix){ return { ok: !!c, fix: fix }; },
    wait: function(ms){ return new Promise(function(res){ setTimeout(res, ms); }); },
    num: function(t){ var m = String(t).match(/-?\d+(?:[.,]\d+)?/); return m ? parseFloat(m[0].replace(',', '.')) : NaN; },
    submit: function(form){ var e = new Event('submit', { bubbles: true, cancelable: true }); form.dispatchEvent(e); return e.defaultPrevented; },
    change: function(el, v){ el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); },
    visible: function(el){
      if (!el || el.hidden) return false;
      var s = getComputedStyle(el); if (s.display === 'none' || s.visibility === 'hidden') return false;
      var b = el.getBoundingClientRect(); return b.width > 0 && b.height > 0;
    },
    menu: function(){
      var m = q('.menu'), lg = q('.logo'), ul = q('.ligacoes'), as = qa('.ligacoes a');
      var mr = r(m), lr = r(lg), ur = r(ul), st = cs(m);
      var pl = (parseFloat(st.paddingLeft) || 0) + (parseFloat(st.borderLeftWidth) || 0);
      var pr = (parseFloat(st.paddingRight) || 0) + (parseFloat(st.borderRightWidth) || 0);
      var a0 = as.length ? r(as[0]) : Z, aN = as.length ? r(as[as.length - 1]) : Z;
      var inRow = !!(m && lg && ul) && ur.top < lr.bottom - 2 && ur.left >= lr.right - 1;
      var left = Math.abs(lr.left - (mr.left + pl)) < 4;
      var right = Math.abs((mr.right - pr) - aN.right) < 4 && a0.left - lr.right > 30;
      var cy = Math.abs((lr.top + lr.height / 2) - (a0.top + a0.height / 2)) < 2.5;
      var linksRow = as.length > 1 && Math.abs(r(as[0]).top - r(as[1]).top) < 2 && r(as[1]).left > r(as[0]).right - 1;
      var gap = as.length > 1 ? r(as[1]).left - r(as[0]).right : 0;
      var fits = !overflow() && as.every(function(a){ return r(a).right <= window.innerWidth + 1; }) && lr.right <= window.innerWidth + 1;
      return { inRow: inRow, left: left, right: right, cy: cy, linksRow: linksRow, gap: gap, fits: fits };
    },
    mural: function(){
      var m = q('.mural'), st = cs(m), mr = r(m);
      var all = qa('.cartao'), d = q('.destaque');
      var normal = all.filter(function(c){ return !c.classList.contains('destaque'); });
      var lefts = {}; normal.forEach(function(c){ lefts[Math.round(r(c).left)] = 1; });
      var ws = normal.map(function(c){ return r(c).width; });
      var pl = (parseFloat(st.paddingLeft) || 0) + (parseFloat(st.borderLeftWidth) || 0);
      var pr = (parseFloat(st.paddingRight) || 0) + (parseFloat(st.borderRightWidth) || 0);
      var inner = mr.width - pl - pr;
      var rightMost = normal.length ? Math.max.apply(null, normal.map(function(c){ return r(c).right; })) : 0;
      var cw = normal.length ? r(normal[0]).width : 0;
      var gap = parseFloat(st.columnGap); if (isNaN(gap)) gap = 0;
      var rowGap = parseFloat(st.rowGap); if (isNaN(rowGap)) rowGap = 0;
      return {
        isGrid: /grid/.test(st.display || ''),
        cols: Object.keys(lefts).length,
        equal: ws.length > 0 && Math.max.apply(null, ws) - Math.min.apply(null, ws) < 2,
        fills: Math.abs(rightMost - (mr.right - pr)) < 3,
        gap: gap, rowGap: rowGap, cw: cw, dw: r(d).width, inner: inner,
        full: d ? Math.abs(r(d).width - inner) < 3 : false
      };
    }
  };
}

function mwRunCheck(cfg, helpers, check){
  window.addEventListener('load', function(){
    setTimeout(function(){
      var T = helpers();
      Promise.resolve().then(function(){ return check(T); }).then(function(items){
        parent.postMessage({ __mw: cfg.token, type: 'result', data: items, errors: window.__mwErrors || [] }, '*');
      }, function(e){
        parent.postMessage({ __mw: cfg.token, type: 'result', data: null, crash: String(e && e.message || e), errors: window.__mwErrors || [] }, '*');
      });
    }, 80);
  });
}

  id:'m4', n:4, room:'Loja', title:'Reabrir a loja',

    id:'m4l1', kind:'explorar', editable:['js'], title:'Contas trocadas',

    base:{ html:M4HTML, css:M4CSS },
    req:['O total é o custo de 4 cadernos','O total aparece com duas casas decimais'],
    controls:[
      {id:'q', label:'Quantidade', type:'range', min:1, max:10, step:1, value:1, unit:''},
      {id:'op', label:'Operação', type:'select', options:['+','-','*','/'], value:'+'},
      {id:'f', label:'Como mostrar o total', type:'select', options:['total','Math.round(total)','total.toFixed(2)'], value:'total'}
    ],
    template: v => `// Quanto custam os cadernos?
const preco = 1.20;
const quantidade = ${v.q};
const total = preco ${v.op} quantidade;

document.querySelector('#total').textContent =
  'Total: ' + ${v.f} + ' €';`,
    hints:[
      'Uma variável guarda um valor com um nome: `const preco = 1.20`. Com os operadores `+ - * /` fazes contas com essas variáveis.',
      'O custo de várias unidades obtém-se a multiplicar: `*`. As contas com casas decimais nem sempre são exatas (1.2 × 3 dá 3.5999…), por isso usa `toFixed(2)` para mostrar sempre duas casas.',
      {t:'Para bilhetes de autocarro, ficaria assim:', code:'const precoBilhete = 2.5;\nconst pessoas = 3;\nconst custo = precoBilhete * pessoas;\nconsole.log(custo.toFixed(2)); // "7.50"'}
    ],
    check: function(T){
      var t = T.text(T.q('#total')), n = T.num(t);
      var fix = 'O total ainda não é o custo de 4 cadernos a 1,20 €. Confirma a quantidade e a operação.';
      if (Math.abs(n - 5.2) < 0.001) fix = 'Estás a somar o preço à quantidade. Que operação dá o custo de várias unidades iguais?';
      else if (n === 5) fix = 'O valor foi arredondado para um número inteiro. Os preços precisam das casas decimais.';
      return [
        T.ok(Math.abs(n - 4.8) < 0.001, fix),
        T.ok(/4[.,]80/.test(t), Math.abs(n - 4.8) < 0.001 ? 'O valor está certo, mas um preço mostra-se sempre com duas casas decimais (4.80).' : 'Quando o cálculo estiver certo, mostra o total com duas casas decimais.')
      ];
    },
    explain:'Porque é que é preciso toFixed(2) para mostrar preços?'
  },
  {
    id:'m4l2', kind:'completar', editable:['js'], title:'O botão Calcular',
    sit:'O botão Calcular não faz nada.',
    obj:'Completa o código para que, ao clicar no botão, apareça o total do material escolhido com a quantidade indicada.',
    base:{ html:M4HTML, css:M4CSS },
    req:['O total muda quando se clica em Calcular','A quantidade é lida corretamente','O cálculo está certo (3 canetas custam 1,95 €)','O total tem duas casas decimais (5 cadernos: 6.00 €)'],
    code:`const botao = document.querySelector('#calcular');

botao.addEventListener('{{ev}}', function () {
  const preco = Number(document.querySelector('#produto').value);
  const quantidade = Number(document.querySelector('{{sel}}').value);
  const total = preco {{op}} quantidade;
  document.querySelector('#total').textContent =
    'Total: ' + total.{{fmt}}(2) + ' €';
});`,
    blanks:{ev:5,sel:11,op:1,fmt:7},
    hints:[
      'Um evento é algo que acontece na página (um clique, uma tecla). `addEventListener` diz que função corre quando esse evento acontece. `document.querySelector` encontra um elemento pelo seletor CSS.',
      'O evento de clique chama-se `click`. O campo da quantidade tem `id="quantidade"`, por isso o seletor é `#quantidade`. A operação é `*` e o método das casas decimais é `toFixed`.',
      {t:'Num botão que duplica um valor, ficaria assim:', code:"const botao = document.querySelector('#dobrar');\nbotao.addEventListener('click', function () {\n  const a = Number(document.querySelector('#valor').value);\n  document.querySelector('#saida').textContent = (a * 2).toFixed(2);\n});"}
    ],
    check: async function(T){
      var sel = T.q('#produto'), q = T.q('#quantidade'), b = T.q('#calcular'), out = T.q('#total');
      var before = T.text(out);
      sel.value = '0.65'; q.value = '3'; b.click(); await T.wait(30);
      var t1 = T.text(out);

      var t2 = T.text(out);
      var changed = t1 !== before;

function loadState(){
  try { const t = localStorage.getItem(KEY); if (t) { const o = JSON.parse(t); if (o && o.v === 1) return Object.assign(blankState(), o); } } catch (e) {}
  return blankState();
}

function ls(id){ return S.lv[id] || (S.lv[id] = { done:false, att:0, hints:0, expl:'', code:null, vals:null, blanks:null }); }
const isDone = id => !!(S.lv[id] && S.lv[id].done);
const works = m => isDone(m.levels[0].id) && isDone(m.levels[1].id);
const complete = m => m.levels.every(L => isDone(L.id));

  return works(MISSIONS[i - 1]);
}
function levelUnlocked(m, j){ return S.unlockAll || j === 0 || isDone(m.levels[j - 1].id); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3800); }
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

   Montagem da página do aluno
   ========================================================= */
function valsOf(L){
  const v = {}; L.controls.forEach(c => { v[c.id] = c.value; });
  const s = ls(L.id); if (s.vals) Object.assign(v, s.vals);
  return v;
}
function fillBlanks(code, b){ return code.replace(/\{\{(\w+)\}\}/g, (m, k) => (b && b[k] ? String(b[k]).trim() : '')); }
function currentCode(L){
  const s = ls(L.id), f = L.editable[0];
  if (L.kind === 'explorar') return { [f]: L.template(valsOf(L)) };
  if (L.kind === 'completar') return { [f]: fillBlanks(L.code, s.blanks || {}) };
  const c = {}; L.editable.forEach(k => { c[k] = (s.code && s.code[k] != null) ? s.code[k] : L.starter[k]; });
  return c;
}
function buildDoc(L, code, mode, token){
  const ed = L.editable, b = L.base || {};
  const html = ed.includes('html') ? code.html : (b.html || '');
  const css = ed.includes('css') ? code.css : '';
  const js = ed.includes('js') ? code.js : (b.js || '');
  const cfg = { token, mode, offset: 0, imgs: IMGS };
  const hook = () => '<script>(' + mwHook.toString() + ')(' + JSON.stringify(cfg) + ');<\/script>';
  let doc = '<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultado</title><style>' + BASE_CSS + '\n' + (b.css || '') + '</style><style>\n' + css + '\n</style>';
  const headStart = doc;
  doc += hook() + '</head><body>\n' + html + '\n';
  if (js) {
    const pre = doc + '<script>\n';
    cfg.offset = pre.split('\n').length - 1;
    doc = headStart + hook() + '</head><body>\n' + html + '\n<script>\n' + js + '\n<\/script>';
  }
  if (L.after) doc += '<script>' + L.after + '<\/script>';
  if (mode === 'test') doc += '<script>(' + mwRunCheck.toString() + ')(' + JSON.stringify({ token }) + ',' + mwHelpers.toString() + ',' + L.check.toString() + ');<\/script>';
  return doc + '</body></html>';
}

window.addEventListener('message', e => {
  const d = e.data; if (!d || typeof d !== 'object' || !d.__mw) return;
  if (pending[d.__mw] && d.type === 'result') { pending[d.__mw](d); return; }
  if (d.__mw === previewToken) {
    if (d.type === 'error') logLine('error', d.data);
    else if (d.type === 'log') logLine(d.data.k, d.data.t);
  }
});
function testAt(L, code, w){
  return new Promise(res => {
    const token = 't' + (++seq) + Math.random().toString(36).slice(2, 7);
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-forms');
    f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
    f.className = 'testframe'; f.style.width = w + 'px';
    const tm = setTimeout(() => { if (pending[token]) pending[token]({ timeout:true }); }, 6000);
    pending[token] = d => { clearTimeout(tm); delete pending[token]; f.remove(); res(d); };
    f.srcdoc = buildDoc(L, code, 'test', token);
    document.body.appendChild(f);
  });
}

  // vistas editáveis
  L.editable.forEach(f => {
    h += `<div class="codeview" data-view="${f}" ${f === cur.file ? '' : 'hidden'}>`;
    if (L.kind === 'explorar') {
      const v = valsOf(L);
      h += `<div class="controls">${L.controls.map(c => {
        if (c.type === 'select') return `<label class="ctl"><span>${esc(c.label)}</span><select id="c-${c.id}" data-c="${c.id}">${c.options.map(o => `<option value="${esc(o)}" ${String(v[c.id]) === String(o) ? 'selected' : ''}>${o === '' ? '(vazio)' : esc(o)}</option>`).join('')}</select></label>`;
        if (c.type === 'range') return `<label class="ctl"><span>${esc(c.label)} <output id="o-${c.id}">${esc(v[c.id])}${c.unit || ''}</output></span><input type="range" id="c-${c.id}" data-c="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${esc(v[c.id])}"></label>`;
        return `<label class="ctl"><span>${esc(c.label)}</span><input type="text" id="c-${c.id}" data-c="${c.id}" value="${esc(v[c.id])}" placeholder="${esc(c.ph || '')}" autocomplete="off"></label>`;
      }).join('')}</div><pre class="src" id="gen"></pre>`;
    } else if (L.kind === 'completar') {
      const b = s.blanks || {};
      let k = 0;
      const parts = L.code.split(/\{\{(\w+)\}\}/);
      h += `<pre class="src" id="blankcode">` + parts.map((p, i) => {
        if (i % 2 === 0) return esc(p);

    } else {

function updateGen(){
  const { L } = cur, v = valsOf(L), mv = {};
  Object.keys(v).forEach(k => { mv[k] = '\u0001' + v[k] + '\u0002'; });

  g.innerHTML = esc(L.template(mv)).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');

async function runTest(){
  const { L } = cur, s = ls(L.id), btn = $('#testbtn');
  btn.disabled = true; btn.textContent = 'A testar…';
  s.att = (s.att || 0) + 1; save();
  runPreview();
  const code = currentCode(L);
  const pre = L.precheck ? L.precheck(ls(L.id).blanks || {}) : null;
  const widths = L.widths || [800];
  const results = [];
  for (const w of widths) results.push(await testAt(L, code, w));
  btn.disabled = false; btn.textContent = 'Testar';
  if (cur.L !== L) return;
  const lis = $$('#req li');
  if (results.some(r => r.timeout)) {
    lis.forEach(li => { li.className = ''; });
    setFeedback('warn', 'O teste não terminou.', 'O código demorou demasiado a correr. Pode haver um ciclo que nunca acaba. Revê o código e testa outra vez.');
    return;
  }
  const errors = [...new Set(results.flatMap(r => r.errors || []))];
  if (results.some(r => !r.data)) {
    lis.forEach(li => { li.className = 'fail'; });
    setFeedback('err', 'Não foi possível verificar a página.', errors.length ? 'O navegador encontrou um erro: ' + errors[0] : 'Falta algum elemento que a missão espera. Confirma que não apagaste nem mudaste o nome a elementos do HTML fornecido.');
    return;
  }
  const items = L.req.map((_, i) => {
    let ok = true, fix = '';
    results.forEach(r => { const it = r.data[i]; if (!it || !it.ok) { ok = false; if (!fix) fix = (it && it.fix) || 'Requisito por cumprir.'; } });
    return { ok, fix };
  });
  items.forEach((it, i) => { if (lis[i]) lis[i].className = it.ok ? 'ok' : 'fail'; });
  const allOk = items.every(it => it.ok) && !pre && !errors.length;
  if (!allOk) {
    if (pre) setFeedback('err', 'Há etiquetas que não coincidem.', pre);
    else if (errors.length) setFeedback('err', 'O navegador encontrou um erro no teu código.', errors[0] + (errors.length > 1 ? ` (e mais ${errors.length - 1})` : '') + '. Corrige-o e testa outra vez.');
    else {
      const nOk = items.filter(it => it.ok).length;
      setFeedback(nOk ? 'warn' : 'err', nOk ? `${nOk} de ${items.length} requisitos cumpridos.` : 'Ainda não está.', items.find(it => !it.ok).fix);
    }
    return;
  }
  const first = !s.done;
  s.done = true;
  if (L.editable.length && L.kind === 'construir') s.code = Object.assign({}, s.code || {}, code);
  save();
  setFeedback('ok', 'Todos os requisitos cumpridos.', first ? 'O navegador mostra a página como pedido.' : 'Continua a funcionar.');
  updateLevelTabs();
  showSuccess(first);
}
function updateLevelTabs(){
  const { m } = cur;
  $$('.lvl').forEach((b, j) => {
    const X = m.levels[j];
    b.classList.toggle('done', isDone(X.id));
    b.querySelector('.dot').textContent = isDone(X.id) ? '✓' : j + 1;
    b.disabled = !levelUnlocked(m, j);
    if (!b.disabled) b.removeAttribute('title');
  });
}
function showSuccess(fresh){
  const { m, L } = cur, s = ls(L.id), last = L.index === m.levels.length - 1;
  let note = '';
  if (fresh && complete(m)) note = m.final ? 'O portal da escola está completo.' : `Missão concluída: ${m.room.toLowerCase()} reativado no mapa.`;
  else if (fresh && L.index === 1 && !m.final && MISSIONS[m.n] && !complete(m)) note = `A Missão ${m.n + 1} ficou desbloqueada.`;
  $('#success').innerHTML = `<div class="success">
    <p class="win">${m.final ? 'Desafio final concluído.' : 'Nível concluído.'}</p>
    ${note ? `<p>${esc(note)}</p>` : ''}
    <label for="expl">Explica a tua solução</label>
    <p class="q">${esc(L.explain)}</p>
    <textarea id="expl" placeholder="Escreve por palavras tuas…">${esc(s.expl || '')}</textarea>
    <div class="acts">
      <button class="btn" data-act="saveexpl">Guardar explicação</button>
      ${last ? `<button class="btn btn-primary" data-act="map">Voltar ao mapa</button>` : `<button class="btn btn-primary" data-act="level" data-l="${L.index + 1}">Nível seguinte →</button>`}
    </div>
  </div>`;
}

/* =========================================================
   Ecrã: relatório do professor
   ========================================================= */
let confirmReset = false;
function renderTeacher(){
  const rows = ALL.flatMap(m => m.levels.map(L => {
    const s = S.lv[L.id] || {};
    return `<tr><td>${m.final ? 'Final' : 'M' + m.n + ' · ' + (L.index + 1)}</td><td>${esc(L.title)}</td><td>${s.done ? 'Concluído' : (s.att ? 'Em curso' : '—')}</td><td class="num">${s.att || 0}</td><td class="num">${Math.min(s.hints || 0, L.hints.length)}</td><td class="expl">${s.expl ? esc(s.expl) : '—'}</td></tr>`;
  })).join('');
  const dist = MISSIONS.map(m => `<tr><td>Missão ${m.n} · ${esc(m.room)}</td><td>${works(m) ? 'Sim' : 'Não'}</td><td>${explains(m) ? 'Sim' : 'Não'}</td><td>${isDone(m.levels[2].id) ? 'Sim' : 'Não'}</td></tr>`).join('');
  $('#app').innerHTML = `${topBar()}
  <main class="teacher">
    <div><button class="btn btn-ghost" data-act="map">← Mapa</button></div>
    <div><p class="eyebrow">Para o professor</p><h2>Relatório de ${esc(S.nome || 'aluno sem nome')}</h2></div>
    <section>
      <h3>Níveis</h3>
      <p class="muted">As tentativas contam cada vez que o aluno carrega em Testar. Errar não é penalizado; o número serve para perceber onde houve mais dificuldade. As pistas vão de 0 a 3 por nível.</p>
      <div class="tbl-wrap"><table class="rep"><thead><tr><th>Nível</th><th>Desafio</th><th>Estado</th><th class="num">Tentativas</th><th class="num">Pistas</th><th>Explicação do aluno</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section>
      <h3>Distinções</h3>
      <p class="muted">Funciona: níveis Explorar e Completar concluídos. Explica: explicação com pelo menos 40 caracteres em 2 ou mais níveis. Adapta: nível Construir resolvido. Nenhuma distinção depende da rapidez.</p>
      <div class="tbl-wrap"><table class="rep"><thead><tr><th>Missão</th><th>Funciona</th><th>Explica</th><th>Adapta</th></tr></thead><tbody>${dist}<tr><td>Desafio final</td><td colspan="3">${isDone('final') ? 'Concluído (Transfere)' : 'Por concluir'}</td></tr></tbody></table></div>
    </section>
    <section>
      <h3>Guardar e levar o progresso</h3>
      <p class="muted">O progresso fica guardado neste navegador. Para continuar noutro computador, ou para entregar ao professor, copia o código de progresso e cola-o no outro lado.</p>
      <label class="lbl" for="exp">Código de progresso</label>
      <textarea id="exp" readonly>${esc(exportCode())}</textarea>
      <div class="acts"><button class="btn" data-act="copy">Copiar código</button></div>
      <label class="lbl" for="imp">Carregar progresso</label>
      <textarea id="imp" placeholder="Cola aqui um código de progresso"></textarea>
      <div class="acts"><button class="btn btn-primary" data-act="import">Carregar</button></div>
    </section>
    <section>
      <h3>Opções da turma</h3>
      <label class="switch"><input type="checkbox" id="unlock" ${S.unlockAll ? 'checked' : ''}> Desbloquear todas as missões e níveis</label>
      <p class="muted">Útil para o professor rever os desafios ou quando a turma retoma o trabalho a meio.</p>
      <div class="acts" id="resetbox">${confirmReset ? `<div class="confirm"><span>Isto apaga todo o progresso deste aluno neste navegador.</span><button class="btn btn-danger" data-act="reset-yes">Apagar progresso</button><button class="btn" data-act="reset-no">Cancelar</button></div>` : `<button class="btn" data-act="reset-ask">Apagar progresso…</button>`}</div>
    </section>
  </main>`;
  bindTop();
  $('#unlock').addEventListener('change', e => { S.unlockAll = e.target.checked; save(); toast(S.unlockAll ? 'Todas as missões estão desbloqueadas.' : 'As missões voltam a desbloquear por ordem.'); });
}
function exportCode(){
  try { return 'MW1.' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ''; }
}
function importCode(t){
  t = (t || '').trim();
  if (!t.startsWith('MW1.')) throw new Error('formato');
  const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));
  if (!o || o.v !== 1 || typeof o.lv !== 'object') throw new Error('formato');
  S = Object.assign(blankState(), o); save();
}

/* =========================================================
   Eventos
   ========================================================= */
let view = 'map';
function go(v){ view = v; if (v === 'map') { cur = null; renderMap(); } else if (v === 'teacher') { cur = null; renderTeacher(); } window.scrollTo(0, 0); }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'map') return go('map');
  if (act === 'teacher') { confirmReset = false; return go('teacher'); }
  if (act === 'open') { view = 'mission'; return openMission(+el.dataset.m); }
  if (act === 'level') { if (el.disabled) return; return openMission(cur.mi, +el.dataset.l); }
  if (act === 'tab') {
    cur.file = el.dataset.f;
    $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.f === cur.file)));
    $$('.codeview').forEach(v => { v.hidden = v.dataset.view !== cur.file; });
    return;
  }
  if (act === 'width') {
    cur.phone = el.dataset.w === 'phone';
    $('#stage').classList.toggle('phone', cur.phone);
    $$('.seg button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.w === 'phone') === cur.phone)));
    return;
  }
  if (act === 'run') return runPreview();
  if (act === 'test') return runTest();
  if (act === 'hint') { const s = ls(cur.L.id); s.hints = Math.min((s.hints || 0) + 1, cur.L.hints.length); save(); renderHints(); return; }
  if (act === 'reset') {
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Confirmar: repor código'; el.classList.remove('btn-ghost'); setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.textContent = 'Repor código'; el.classList.add('btn-ghost'); } }, 4000); return; }
    const s = ls(cur.L.id); s.code = null; s.blanks = null; save(); renderCodeBody(); runPreview();
    el.dataset.armed = ''; el.textContent = 'Repor código'; el.classList.add('btn-ghost');
    return;
  }
  if (act === 'saveexpl') { const s = ls(cur.L.id); s.expl = $('#expl').value; save(); toast('Explicação guardada.'); return; }
  if (act === 'copy') {
    const ta = $('#exp');
    try { await navigator.clipboard.writeText(ta.value); toast('Código copiado.'); }
    catch (err) { ta.focus(); ta.select(); toast('Seleciona o código e copia-o com Ctrl + C.'); }
    return;
  }
  if (act === 'import') {
    try { importCode($('#imp').value); toast('Progresso carregado.'); renderTeacher(); }
    catch (err) { toast('Este código não é válido. Confirma que copiaste o código todo, começado por MW1.'); }
    return;
  }
  if (act === 'reset-ask') { confirmReset = true; return renderTeacher(); }
  if (act === 'reset-no') { confirmReset = false; return renderTeacher(); }
  if (act === 'reset-yes') { const nome = S.nome; S = blankState(); S.nome = nome; save(); confirmReset = false; toast('Progresso apagado.'); return renderTeacher(); }
});
document.addEventListener('keydown', e => {
  const room = e.target.closest && e.target.closest('.room[data-act="open"]');
  if (room && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); view = 'mission'; openMission(+room.dataset.m); return; }
  if (cur && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPreview(); return; }
  if (e.target.matches && e.target.matches('textarea.editor')) {
    const ta = e.target;
    if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText('  ', s, en, 'end'); ta.dispatchEvent(new Event('input', { bubbles:true }));
    } else if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
      const s = ta.selectionStart, line = ta.value.slice(0, s).split('\n').pop();
      const ind = (line.match(/^\s*/) || [''])[0] + (/[{(\[>]\s*$/.test(line) && !/^\s*<\//.test(line) ? '  ' : '');
      if (ind) { e.preventDefault(); ta.setRangeText('\n' + ind, s, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', { bubbles:true })); }
    }
  }
});
document.addEventListener('input', e => {
  if (!cur) return;
  const t = e.target, L = cur.L, s = ls(L.id);
  if (t.dataset.c) {
    s.vals = Object.assign({}, s.vals || {}, { [t.dataset.c]: t.value });
    const ctl = L.controls.find(c => c.id === t.dataset.c);
    const out = $('#o-' + t.dataset.c); if (out) out.textContent = t.value + (ctl.unit || '');
    save(); updateGen(); runSoon();
  } else if (t.dataset.b) {
    s.blanks = Object.assign({}, s.blanks || {}, { [t.dataset.b]: t.value });
    t.style.width = Math.max(L.blanks[t.dataset.b] || 4, t.value.length) + 1.5 + 'ch';
    t.classList.toggle('filled', !!t.value);
    save();
    if (!L.editable.includes('js')) runSoon();
  } else if (t.dataset.ed) {
    s.code = Object.assign({}, s.code || {}, { [t.dataset.ed]: t.value });
    save();
    if (!L.editable.includes('js')) runSoon();
  }
});
document.addEventListener('change', e => { if (cur && e.target.dataset && e.target.dataset.c && e.target.tagName === 'SELECT') { /* tratado em input */ } });

renderMap();
</script>
