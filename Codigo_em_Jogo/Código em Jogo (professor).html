<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Código em Jogo (professor)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bancada de eletrónica: placa verde-escura (máscara de solda), cobre, serigrafia clara, LEDs.
   Visual único escuro por opção (é a placa), com etiquetas brancas para os logótipos. */
:root {
  --placa: #0b241d;
  --placa-2: #103329;
  --placa-3: #17443a;
  --fundo: #061510;
  --cobre: #c9873e;
  --cobre-claro: #e8a85c;
  --seda: #e9efe6;
  --seda-fraca: #a9bfb2;
  --verde: #5bf08a;
  --vermelho: #ff6a5f;
  --ambar: #ffb938;
  --azul: #4fd1ff;
  --etiqueta: #ffffff;
  --tinta: #10261f;
  --f-titulo: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --f-texto: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-codigo: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--fundo);
  color: var(--seda);
  font-family: var(--f-texto);
  font-size: 15px;
  line-height: 1.5;
}
* { box-sizing: border-box; }
.app { display: flex; flex-direction: column; min-height: 100%; height: 100%; }

/* ---------- cabeçalho ---------- */
.topo {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--placa);
  border-bottom: 2px solid var(--cobre);
}
.logo-etiqueta {
  background: var(--etiqueta); border-radius: 6px; padding: 3px 8px;
  display: flex; align-items: center; box-shadow: 0 0 0 2px rgba(0,0,0,.25);
}
.logo-etiqueta img { height: 40px; width: auto; display: block; }
.marca { min-width: 0; }
.marca h1 {
  margin: 0; font-family: var(--f-titulo); font-weight: 700; font-size: 1.45rem;
  letter-spacing: .02em; line-height: 1.1; color: var(--seda);
}
.marca h1 span { color: var(--ambar); }
.marca p { margin: 0; font-size: .72rem; color: var(--seda-fraca); letter-spacing: .04em; text-transform: uppercase; }
.modo-prof {
  align-self: center; font-family: var(--f-titulo); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--tinta); background: var(--ambar); padding: 2px 8px; border-radius: 4px; font-weight: 700;
}
.hud { margin-left: auto; display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.mostrador {
  background: #04100c; border: 1px solid var(--placa-3); border-radius: 6px;
  padding: 3px 10px; min-width: 78px; display: flex; flex-direction: column; justify-content: center;
}
.mostrador .rot { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--seda-fraca); }
.mostrador .val { font-family: var(--f-codigo); font-size: 1.15rem; font-weight: 600; color: var(--verde); font-variant-numeric: tabular-nums; line-height: 1.2; }
.mostrador.tempo { min-width: 140px; }
.barra-tempo { height: 6px; background: var(--placa-3); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.barra-tempo > div { height: 100%; width: 100%; background: var(--verde); transition: width .25s linear, background-color .3s; }
.mostrador .val.alerta { color: var(--vermelho); }
.mostrador.jogador .val { color: var(--ambar); font-family: var(--f-titulo); font-size: .9rem; white-space: nowrap; }

/* ---------- botões ---------- */
button, .botao {
  font-family: var(--f-titulo); font-weight: 600; font-size: .95rem; letter-spacing: .02em;
  border-radius: 6px; border: 1px solid var(--cobre); background: var(--placa-2); color: var(--seda);
  padding: 7px 14px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--placa-3); border-color: var(--cobre-claro); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primario { background: var(--ambar); color: var(--tinta); border-color: var(--ambar); }
button.primario:hover:not(:disabled) { background: #ffcb66; }
button.verde { background: var(--verde); color: var(--tinta); border-color: var(--verde); }
button.fantasma { background: transparent; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
canvas:focus-visible { outline: 3px solid var(--azul); outline-offset: -3px; }

/* ---------- área principal ---------- */
.principal {
  flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 420px);
}
.palco { position: relative; min-width: 0; min-height: 380px; overflow: hidden; background: var(--placa); }
.palco canvas { display: block; }
.dica-foco {
  position: absolute; left: 10px; bottom: 8px; font-size: .75rem; color: var(--seda-fraca);
  background: rgba(4,16,12,.75); padding: 2px 8px; border-radius: 4px; pointer-events: none;
}
.monitor { position: absolute; border: 0; background: #fff; border-radius: 4px; overflow: hidden; }
.monitor iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.painel {
  background: var(--placa-2); border-left: 2px solid var(--cobre);
  overflow-y: auto; min-height: 0;
  padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.painel h2 { font-family: var(--f-titulo); font-size: 1.35rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.painel h3 { font-family: var(--f-titulo); font-size: 1rem; margin: 0; color: var(--ambar); letter-spacing: .03em; }
.painel p { margin: 0; }
.etiqueta-sup {
  font-family: var(--f-titulo); font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--seda-fraca);
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.pag {
  display: inline-block; font-family: var(--f-codigo); font-size: .74rem; color: var(--tinta); background: var(--seda);
  border-radius: 3px; padding: 0 6px; white-space: nowrap; letter-spacing: 0; text-transform: none;
}
code {
  font-family: var(--f-codigo); font-size: .86em; background: #04100c; color: var(--cobre-claro);
  padding: 1px 5px; border-radius: 3px; white-space: pre-wrap; word-break: break-word;
}
pre.codigo {
  margin: 0; font-family: var(--f-codigo); font-size: .82rem; line-height: 1.55; background: #04100c;
  border: 1px solid var(--placa-3); border-radius: 6px; padding: 10px 12px; overflow-x: auto; color: var(--seda);
  white-space: pre;
}
pre.codigo .alvo { color: var(--ambar); font-weight: 600; }
pre.codigo .alvo::before { content: '▶ '; color: var(--ambar); }
pre.codigo .linha::before { content: '  '; }
.cartao-eletro {
  border: 1px dashed var(--cobre); border-radius: 8px; padding: 10px 12px; background: rgba(201,135,62,.08);
}
.cartao-eletro h3 { color: var(--cobre-claro); margin-bottom: 4px; }
.progresso { display: flex; gap: 6px; align-items: center; }
.progresso i {
  width: 12px; height: 12px; border-radius: 50%; background: #1e3d33; border: 1px solid #2c5547; display: inline-block;
}
.progresso i.ok { background: var(--verde); box-shadow: 0 0 6px var(--verde); border-color: var(--verde); }
.progresso i.atual { background: var(--ambar); box-shadow: 0 0 6px var(--ambar); border-color: var(--ambar); }
.enunciado { font-size: 1.02rem; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }

/* editor */
.editor { border: 1px solid var(--placa-3); border-radius: 6px; background: #04100c; overflow: hidden; }
.editor .fixo { font-family: var(--f-codigo); font-size: .85rem; color: var(--seda-fraca); padding: 4px 10px; }
.editor textarea {
  width: 100%; min-height: 120px; resize: vertical; border: 0; border-top: 1px solid #12302a; border-bottom: 1px solid #12302a;
  background: #020b08; color: var(--seda); font-family: var(--f-codigo); font-size: .86rem; line-height: 1.55;
  padding: 8px 10px 8px 22px; tab-size: 2;
}
.editor textarea:focus-visible { outline: 2px solid var(--azul); outline-offset: -2px; }
.editor.grande textarea { min-height: 220px; }
.campos-calc { display: grid; gap: 8px; }
.campos-calc label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.campos-calc input, .nome-aluno input {
  width: 110px; font-family: var(--f-codigo); font-size: 1rem; padding: 5px 8px; border-radius: 5px;
  border: 1px solid var(--cobre); background: #04100c; color: var(--seda);
}
.larguras { display: grid; gap: 6px; }
.larguras .linha-larg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.larguras input[type=range] { width: 100%; accent-color: var(--ambar); }
.larguras output { font-family: var(--f-codigo); color: var(--ambar); }

/* pistas e feedback */
.pistas { display: grid; gap: 6px; }
.pistas .botoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pistas .botoes small { color: var(--seda-fraca); }
.pistas ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.pistas li { background: rgba(255,185,56,.08); border-left: 3px solid var(--ambar); padding: 4px 8px; border-radius: 0 4px 4px 0; }
.feedback { border-radius: 8px; padding: 10px 12px; display: none; }
.feedback.ativo { display: block; }
.feedback.erro { background: rgba(255,106,95,.12); border: 1px solid var(--vermelho); }
.feedback.ok { background: rgba(91,240,138,.10); border: 1px solid var(--verde); }
.feedback.info { background: rgba(79,209,255,.08); border: 1px solid var(--azul); }
.feedback strong { font-family: var(--f-titulo); }
.feedback .pag { margin-left: 6px; }
.solucao { border: 1px solid var(--ambar); border-radius: 6px; padding: 8px 10px; background: rgba(255,185,56,.07); }
details.como { color: var(--seda-fraca); font-size: .9rem; }
details.como summary { cursor: pointer; font-family: var(--f-titulo); color: var(--seda); }

/* mapa */
.lista-niveis { display: grid; gap: 10px; }
.tema-bloco h3 { margin-bottom: 6px; }
.tema-bloco .linhas { display: grid; gap: 6px; }
.nivel-linha {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  text-align: left; width: 100%; padding: 7px 10px;
}
.nivel-linha .num { font-family: var(--f-codigo); color: var(--ambar); }
.nivel-linha .nome { min-width: 0; }
.nivel-linha .estado { font-size: .78rem; color: var(--seda-fraca); font-family: var(--f-texto); font-weight: 400; }
.nivel-linha.feito .estado { color: var(--verde); }
.regras { font-size: .9rem; color: var(--seda-fraca); display: grid; gap: 4px; }
.regras b { color: var(--seda); }

/* resumo */
.numeros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.numeros div { background: #04100c; border: 1px solid var(--placa-3); border-radius: 6px; padding: 8px 10px; }
.numeros span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--seda-fraca); }
.numeros b { font-family: var(--f-codigo); font-size: 1.2rem; color: var(--verde); font-variant-numeric: tabular-nums; }

/* rodapé */
.rodape {
  background: var(--etiqueta);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; border-top: 2px solid var(--cobre);
}
.rodape img { max-height: 52px; width: auto; max-width: 100%; object-fit: contain; display: block; }

/* passaporte */
dialog.passaporte {
  width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--placa-2); color: var(--seda); border: 2px solid var(--cobre); border-radius: 12px; padding: 18px 20px;
}
dialog.passaporte::backdrop { background: rgba(2, 8, 6, .72); }
.passaporte .cabeca { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.passaporte h2 { font-family: var(--f-titulo); margin: 0; font-size: 1.5rem; }
.passaporte .sub { color: var(--seda-fraca); font-size: .85rem; }
.nome-aluno { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
.nome-aluno input { width: min(320px, 100%); }
.tabela-wrap { overflow-x: auto; }
table.niveis-tab { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.niveis-tab th, table.niveis-tab td { padding: 5px 8px; border-bottom: 1px solid var(--placa-3); text-align: left; }
table.niveis-tab th { font-family: var(--f-titulo); color: var(--seda-fraca); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
table.niveis-tab td.num { font-family: var(--f-codigo); font-variant-numeric: tabular-nums; }
.distintivos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.distintivo { border: 1px solid var(--placa-3); border-radius: 8px; padding: 7px 9px; display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 8px; align-items: start; opacity: .5; }
.distintivo.ganho { opacity: 1; border-color: var(--verde); }
.distintivo i { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; background: #234a3e; display: block; }
.distintivo.ganho i { background: var(--verde); box-shadow: 0 0 8px var(--verde); }
.distintivo b { font-family: var(--f-titulo); font-size: .88rem; display: block; line-height: 1.2; }
.distintivo small { color: var(--seda-fraca); font-size: .75rem; line-height: 1.3; display: block; }
.passaporte textarea.resumo { width: 100%; min-height: 120px; font-family: var(--f-codigo); font-size: .8rem; background: #04100c; color: var(--seda); border: 1px solid var(--placa-3); border-radius: 6px; padding: 8px; margin-top: 8px; }
.passaporte .linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.aviso-copia { color: var(--verde); font-size: .9rem; }

@media (max-width: 920px) {
  .principal { grid-template-columns: minmax(0, 1fr); }
  .palco { height: 58vh; min-height: 340px; }
  .painel { border-left: 0; border-top: 2px solid var(--cobre); overflow: visible; }
  .app { height: auto; }
  .hud { margin-left: 0; }
}
@media (max-width: 520px) {
  .logo-etiqueta img { height: 34px; }
  .marca h1 { font-size: 1.25rem; }
  .mostrador { min-width: 76px; }
  .mostrador.tempo { min-width: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  .barra-tempo > div { transition: none; }
}
button.compacto { padding: 4px 12px; }
.marca h1 .modo-prof { color: var(--tinta); font-size: .62rem; vertical-align: middle; margin-left: 6px; }

[hidden] { display: none !important; }
.chip-treino { font-family: var(--f-titulo); font-size: .8rem; letter-spacing: .04em; color: var(--tinta); background: #9fc7b4; border-radius: 4px; padding: 3px 8px; align-self: flex-start; }
.nivel-linha.criativa { border-style: dashed; }
.nivel-linha.criativa .num { color: var(--azul); }
ul.reqs { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
ul.reqs li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: start; font-size: .92rem; }
ul.reqs li i { width: 12px; height: 12px; margin-top: 5px; border-radius: 50%; background: #1e3d33; border: 1px solid #2c5547; display: block; }
ul.reqs li.ok i { background: var(--verde); box-shadow: 0 0 6px var(--verde); border-color: var(--verde); }
ul.reqs li.extra.ok i { background: var(--azul); box-shadow: 0 0 6px var(--azul); border-color: var(--azul); }
ul.reqs li.falta i { background: #4a1d1a; border-color: var(--vermelho); }
ul.reqs li.antes i { background: #2f6b4c; }
ul.reqs li small { color: var(--seda-fraca); }
#lista-req { display: grid; gap: 8px; }
.pag.longa { white-space: normal; }
/* Os blocos do painel nunca encolhem: o painel faz scroll em vez de esmagar o código */
.painel > *, #zona-cena > * { flex-shrink: 0; }
#zona-cena { display: flex; flex-direction: column; gap: 12px; }
pre.codigo { flex-shrink: 0; max-height: none; }
/* As linhas longas quebram dentro do bloco: sem barras de scroll nos exemplos */
pre.codigo { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: visible; }

</style>

function fluxoChave(n) {
  let h = 0x811c9dc5;
  const k = 'aert3|TEAC|M03|codigo-em-jogo';
  for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  let x = h || 0x2545F491;
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
    out[i] = x & 255;
  }

  return JSON.parse(new TextDecoder().decode(bytes));

const PENDENTES = new Map();

  const d = ev.data;
  if (!d || typeof d !== 'object' || !d.cej) return;
  const p = PENDENTES.get(d.cej);
  if (!p || ev.source !== p.win) return;

  p.resolve(d);

function blindar(s, tag) { return String(s).replace(new RegExp('</(' + tag + ')', 'gi'), '<\\/$1'); }

  const H = '<!doctype html><html lang="pt"><head><meta charset="utf-8"><style>' + blindar(css, 'style') + '</style></head><body>' + html +
    '<script>window.__erros=[];window.addEventListener("error",function(e){window.__erros.push(String(e.message||e.error||"Erro"));});<\/script>' +
    (js != null ? '<script>' + blindar(js, 'script') + '<\/script>' : '') +
    (harness ? '<script>var __ID=' + JSON.stringify(id || '') + ';' + harness + '<\/script>' : '');
  return H + '</body></html>';
}
function correrIsolado({ css, html, js, harness, largura = 600, altura = 400, timeout = 2500 }) {
  return new Promise(resolve => {
    const id = 'r' + (++contadorExec) + '_' + Date.now();
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts');
    f.setAttribute('aria-hidden', 'true');
    f.tabIndex = -1;
    f.title = 'Execução isolada';
    f.style.cssText = 'position:fixed;left:0;top:0;border:0;opacity:0;pointer-events:none;z-index:-1;width:' + largura + 'px;height:' + altura + 'px;';
    f.srcdoc = montarDoc({ css, html, js, harness, id });
    document.body.appendChild(f);
    const p = { resolve, frame: f, win: f.contentWindow, timer: null };
    p.timer = setTimeout(() => {
      if (PENDENTES.has(id)) { PENDENTES.delete(id); f.remove(); resolve({ timeout: true }); }
    }, timeout);
    PENDENTES.set(id, p);

/* Verificação de declarações CSS (só análise de texto, nada é executado) */
function verificarDeclaracoes(txt) {
  const semComent = txt.replace(/\/\*[\s\S]*?\*\//g, '');
  if (/[{}]/.test(semComent)) return 'Aqui escreves só declarações, sem chavetas: o seletor e as chavetas já estão no editor (p. 22).';
  const partes = semComent.split(';').map(s => s.trim()).filter(Boolean);
  for (const p of partes) {
    const i = p.indexOf(':');
    if (i < 0) return 'A declaração `' + p + '` não tem dois pontos. Cada declaração é `propriedade: valor;` (p. 22).';
    const prop = p.slice(0, i).trim(), val = p.slice(i + 1).trim();
    if (val.indexOf(':') >= 0) return 'Parece faltar um `;` entre duas declarações em `' + p + '`. O ponto e vírgula separa declarações (p. 23).';
    if (!val) return 'A propriedade `' + prop + '` não tem valor.';
    let ok = true;
    try { ok = CSS.supports(prop, val); } catch (e) { ok = true; }
    if (!ok) {
      if (!CSS.supports(prop, 'inherit')) return '`' + prop + '` não é uma propriedade CSS conhecida. Confirma o nome (sem espaços e com hífenes).';
      return 'O valor `' + val + '` não é válido para `' + prop + '`: o navegador ignora esta declaração.';
    }
  }
  return null;
}

function traduzirErro(msg, codigo) {

  else if (/of null|null \(reading|null \(setting|is null/i.test(m)) t = 'Um elemento não foi encontrado e a variável ficou com `null`. Em `querySelector` usa o seletor com #, por exemplo `"#mensagem"`; em `getElementById` usa só o nome, sem # (p. 39).';
  else if (/is not defined/i.test(m)) { const n = (m.match(/(\w+) is not defined/) || [])[1] || ''; t = 'O nome `' + n + '` não existe. JavaScript distingue maiúsculas de minúsculas: confirma como o escreveste (p. 36).'; }
  else if (/is not a function/i.test(m)) { const n = (m.match(/([\w.]+) is not a function/) || [])[1] || ''; t = '`' + n + '` não é uma função. Confirma o nome do método e as maiúsculas, por exemplo `addEventListener` ou `querySelector`.'; }
  else if (/Unexpected end of input|missing \) |Unexpected token|SyntaxError|Invalid or unexpected/i.test(m)) t = 'Erro de sintaxe: confirma parênteses, chavetas e aspas, e que cada abertura tem o seu fecho.';

}

      else porque = ' Os elementos encaixam: este está dentro de `' + p.pai + '` (p. 5).';

    return '<h3>Mini-página (HTML)</h3><pre class="codigo">' + esc(this.d.html) + (this.s.css ? '\n\n/* CSS */\n' + esc(this.s.css) : '') + '</pre>' +
      '<div class="editor grande"><div class="fixo">// js/script.js</div><textarea id="ed" spellcheck="false" autocapitalize="off" aria-label="Código JavaScript">' + esc(this.d.inicial) + '</textarea></div>' +
      '<div class="acoes"><button type="button" class="primario" id="bt-testar">Testar</button><button type="button" id="bt-repor">Repor código inicial</button></div>';
  }

  async testar() {

    this.ocupado = true; $('#bt-testar').disabled = true;
    const r = await correrIsolado({ css: CSS_MINIPAGINA + this.s.css, html: this.d.html, js: cod, harness: harnessDom(this.s.passos) });
    this.ocupado = false; const b = $('#bt-testar'); if (b) b.disabled = false;
    this.montarMonitor(cod);
    if (r.timeout || r.falha) { this.ultimo = false; registarErro('O código não respondeu a tempo. Confirma que não há ciclos infinitos.'); return; }
    const aviso = avisosJs(cod);
    // registo legível dos passos
    this.passosVistos = [];
    let falha = null;
    this.s.passos.forEach((p, i) => {
      const x = r.res[i] || {};
      if (p.clique) { this.passosVistos.push({ ok: true, t: 'clique em ' + p.clique }); return; }
      const obt = x.nulo ? null : x.v;
      const ok = !x.nulo && obt === p.igual;
      this.passosVistos.push({ ok, t: p.v + ' ' + (p.p === 'text' ? 'texto' : p.p) + ' = ' + JSON.stringify(obt) + (ok ? '' : '  (esperado ' + JSON.stringify(p.igual) + ')') });
      if (!ok && !falha) falha = p;
    });

    this.ultimo = false;
    if (r.erros && r.erros.length) { registarErro(traduzirErro(r.erros[0], cod) + (aviso ? ' ' + aviso : '')); return; }
    if (aviso) { registarErro(aviso); return; }
    registarErro(falha.msg);
  }
  destruir() { this.morta = true; const m = $('#monitor'); m.hidden = true; m.innerHTML = ''; m.dataset.r = ''; }
}

function criarCena(nv, d, s) {
  switch (nv.tipo) {
    case 'blocos': return new CenaBlocos(d, s);
    case 'nave': return new CenaNave(d, s);
    case 'fios': return new CenaFios(d, s);
    case 'portas': return new CenaPortas(d, s);
    case 'caixa': return new CenaCaixa(d, s);
    case 'flex': return new CenaFlex(d, s);
    case 'canhao': return new CenaCanhao(d, s);
    case 'logica': return new CenaLogica(d, s);
    case 'dom': return new CenaDom(d, s);
  }
}
function trocarCena(c) { if (SES.cena && SES.cena.destruir) SES.cena.destruir(); SES.cena = c; }

function irMapa() {

  SES.ecra = 'mapa'; SES.nivel = null;
  renderPainel();
}
function abrirNivel(n) {
  if (!desbloqueado(n)) { anunciar('Nível ' + n + ' bloqueado: conclui primeiro o nível ' + (n - 1) + '.'); mostrarFeedbackMapa('O nível ' + n + ' abre quando concluíres o nível ' + (n - 1) + '.'); return; }
  trocarCena(null);

  renderPainel();
  const b = $('#bt-comecar'); if (b) b.focus({ preventScroll: true });
  $('#painel').scrollTop = 0;
}
function comecarNivel(treino) {
  const nv = nivelAtual();
  const en = estNivel(nv.n);
  SES.treino = treino === true;
  SES.tempoTotal = nv.tempo; SES.tempo = nv.tempo; SES.tempoUsado = 0; SES.pontosRonda = 0; SES.novosDistintivos = [];
  const primeiro = nv.desafios.findIndex(d => !(en.desafios[d.id] && en.desafios[d.id].resolvido));
  SES.idx = primeiro < 0 ? 0 : primeiro;
  SES.ecra = 'jogo';
  iniciarDesafio();
}
function iniciarDesafio() {
  const nv = nivelAtual(), d = desafioAtual();
  SES.tentativas = 0; SES.pistasAbertas = 0; SES.resolvido = false;
  trocarCena(criarCena(nv, d, SOL[d.id]));
  renderPainel();
  const f = SES.cena.focoInicial;
  setTimeout(() => {
    if (f === 'quadro') cnv.elt.focus({ preventScroll: true }); else { const el = $(f); if (el) el.focus({ preventScroll: true }); }
    $('#painel').scrollTop = 0;
  }, 30);
}
function registarErro(msg) {
  if (SES.resolvido) return;
  SES.tentativas++;
  mostrarFeedback(msg, 'erro');
  atualizarPistas();
}
function registarAcerto(msg) {
  if (SES.resolvido) return;
  SES.resolvido = true;
  const nv = nivelAtual(), d = desafioAtual();
  const ed = estDesafio(nv.n, d.id);
  let pts = 0;
  if (!ed.resolvido) {
    const base = [100, 70, 50][Math.min(SES.tentativas, 2)];
    pts = Math.max(10, base - 15 * SES.pistasAbertas);
    ed.resolvido = true; ed.pontos = pts; ed.tentativas = SES.tentativas; ed.pistas = SES.pistasAbertas;
    EST.pontos += pts; SES.pontosRonda += pts;
    ganharDistintivo('primeiro');
    if (SES.tentativas >= 3) ganharDistintivo('persistente');
    if (SOL[d.id].cascata && SES.tentativas === 0) ganharDistintivo('cascata');
    guardar();
  }
  const det = pts ? ' +' + pts + ' pontos' + (SES.tentativas === 0 ? ' (à primeira)' : '') + (SES.pistasAbertas ? ', ' + SES.pistasAbertas + ' pista(s)' : '') + '.' : ' (já estava resolvido: sem pontos novos).';
  mostrarFeedback(msg + det, 'ok');
  const fim = SES.idx >= nv.desafios.length - 1;
  const acoes = $('#acoes-seguinte');
  if (acoes) {
    acoes.innerHTML = '<button type="button" class="verde" id="bt-seguinte">' + (fim ? 'Concluir nível' : 'Próximo desafio') + ' →</button>';
    $('#bt-seguinte').onclick = proximoDesafio;
    setTimeout(() => { const b = $('#bt-seguinte'); if (b) b.focus(); }, 40);
  }
  atualizarPistas();
  atualizarHud(true);
}
function proximoDesafio() {
  const nv = nivelAtual();
  if (SES.idx >= nv.desafios.length - 1) { concluirNivel(); return; }
  SES.idx++;
  iniciarDesafio();
}
function concluirNivel() {
  const nv = nivelAtual(), en = estNivel(nv.n);
  trocarCena(null);
  const todos = nv.desafios.every(d => en.desafios[d.id] && en.desafios[d.id].resolvido);
  if (!todos) { SES.ecra = 'mapa'; renderPainel(); return; }
  const bonus = SES.treino ? 0 : Math.round(SES.tempo * 0.5);
  let ganhoBonus = 0;
  if (bonus > (en.bonus || 0)) { ganhoBonus = bonus - (en.bonus || 0); en.bonus = bonus; EST.pontos += ganhoBonus; SES.pontosRonda += ganhoBonus; }
  const usado = Math.round(SES.tempoUsado);
  if (SES.treino) { if (en.tempoTreino == null || usado < en.tempoTreino) en.tempoTreino = usado; if (!en.concluido) en.comTempo = false; }
  else { if (en.tempo == null || usado < en.tempo) en.tempo = usado; en.comTempo = true; }
  en.concluido = true;
  const ds = nv.desafios.map(d => en.desafios[d.id]);
  const primeira = ds.every(x => x.tentativas === 0), semPistas = ds.every(x => !x.pistas);
  if (semPistas) ganharDistintivo('sempistas');
  if (!SES.treino && SES.tempo > nv.tempo / 2) ganharDistintivo('relogio');
  const porNivel = { 1: primeira && 'tag', 2: primeira && 'certeiro', 3: primeira && 'circuito', 6: 'calha', 7: primeira && 'tipos', 8: 'rele', 9: 'reage' };
  if (porNivel[nv.n]) ganharDistintivo(porNivel[nv.n]);
  if (nv.n === 5 && ['5c', '5e'].every(id => en.desafios[id] && en.desafios[id].tentativas === 0)) ganharDistintivo('caixa');
  const tema = (t, id) => { if (NIVEIS.filter(x => x.tema === t).every(x => EST.niveis[x.n] && EST.niveis[x.n].concluido)) ganharDistintivo(id); };
  tema('html', 'temahtml'); tema('css', 'temacss'); tema('js', 'temajs');
  guardar();
  SES.ecra = 'fim'; SES.bonusRonda = ganhoBonus; SES.bonusCalc = bonus;
  renderPainel();
  atualizarHud(true);
  const b = $('#bt-seguinte-nivel') || $('#bt-voltar-mapa'); if (b) b.focus();
}
function tempoEsgotado() {
  trocarCena(null);
  SES.ecra = 'esgotado';
  renderPainel();
  const b = $('#bt-repetir'); if (b) b.focus();
}
function ganharDistintivo(id) {
  if (EST.distintivos[id]) return;
  EST.distintivos[id] = Date.now();
  SES.novosDistintivos.push(id);
  const d = DISTINTIVOS.find(x => x.id === id);
  if (d) anunciar('Distintivo ganho: ' + d.nome);
}
function abrirPista(i) {
  const d = desafioAtual();
  const ja = SES.pistasVistas || (SES.pistasVistas = {});
  const k = d.id + ':' + i;
  if (!ja[k]) {
    ja[k] = true;
    if (!SES.resolvido) {
      SES.pistasAbertas++;
      const en = estNivel(SES.nivel); en.pistas++; EST.pistas++;
      const ed = estDesafio(SES.nivel, d.id); if (!ed.resolvido) ed.pistas = Math.max(ed.pistas || 0, SES.pistasAbertas);
      guardar();
    }
  }
  atualizarPistas();
}

function estadoNivelTexto(n, en) {

}

const ITENS_MAPA = [];
['html', 'css', 'js'].forEach((t, ti) => {
  NIVEIS.filter(n => n.tema === t).forEach(n => ITENS_MAPA.push({ tipo: 'nivel', n: n.n }));

function geoItem(t, row) {
  const colW = (width - 60) / 3, area = height - 140;
  const w = Math.min(colW - 40, 200), h = Math.min(64, area / 4 - 24);
  const x = 30 + t * colW + (colW - w) / 2, y = 88 + row * (area / 4);
  return { x, y, w, h };
}
function geoMapa(i) { return geoItem(Math.floor(i / 3), i % 3); }
function geoCriativo(i) { return geoItem(i, 3); }
function desbloqueadoCriativo(i) { return PROF || NIVEIS.filter(n => n.tema === CRIATIVOS[i].tema).every(n => EST.niveis[n.n] && EST.niveis[n.n].concluido); }

  });

    const a = geoMapa(i), b = geoMapa(i + 1);

    else line(a.x + a.w / 2, a.y + a.h, b.x + b.w / 2, b.y);

    push(); stroke(aberto ? C.cobreClaro : '#6b4a26'); strokeWeight(3); drawingContext.setLineDash([6, 5]);

    noStroke(); fill(aberto ? '#121816' : '#0b0f0e'); rect(g.x, g.y, g.w, g.h, 4);
    fill(60); circle(g.x + 10, g.y + 10, 6);
    fill(aberto ? C.seda : '#5d6a64'); textFont(F_TIT); textAlign(LEFT, TOP); textSize(Math.min(15, g.h * 0.24));
    text('N' + n.n, g.x + 22, g.y + 6);
    textFont(F_TXT); textoAjustado(n.titulo, g.x + 22, g.y + g.h * 0.36, g.w - 50, Math.min(15, g.h * 0.24), 9);
    fill(aberto ? C.sedaFraca : '#4c5853'); textFont(F_COD); textSize(10); text(aberto ? n.paginas : 'bloqueado', g.x + 22, g.y + g.h * 0.68);
    if (foc && ITENS_MAPA[SES.selMapa] && ITENS_MAPA[SES.selMapa].n === n.n) { noFill(); stroke(C.azul); strokeWeight(3); rect(g.x - 6, g.y - 10, g.w + 12, g.h + 20, 8); }
    pop();

    led(g.x + g.w - 16, g.y + 16, 13, ok ? C.verde : aberto ? C.ambar : C.vermelho, ok || pisca);
  });

    const g = geoCriativo(i), ec = EST.criativos[cr.id], ok = ec && ec.concluido, aberto = desbloqueadoCriativo(i);
    const k = ITENS_MAPA.findIndex(it => it.tipo === 'criativo' && it.i === i);
    push();
    noStroke(); fill(aberto ? '#e9e4d4' : '#5b5a52'); rect(g.x, g.y, g.w, g.h, 5);
    fill(aberto ? '#c9c2ad' : '#4a4943');
    for (let x = g.x + 10; x < g.x + g.w - 8; x += 9) { circle(x, g.y + 6, 2.6); circle(x, g.y + g.h - 6, 2.6); }
    fill(aberto ? C.tinta : '#2e2d29'); textFont(F_TIT); textAlign(LEFT, TOP); textSize(Math.min(13, g.h * 0.22));

    pop();
    const pisca = !ok && aberto ? (sin(millis() / 300) > 0) : ok;
    led(g.x + g.w - 16, g.y + 16, 13, ok ? C.verde : aberto ? C.ambar : C.vermelho, ok || pisca);
  });
  push(); noStroke(); fill(C.sedaFraca); textFont(F_TXT); textSize(12); textAlign(LEFT, BOTTOM);
  text('←↑→↓ escolhe · Enter abre', 36, height - 14); pop();
}
function abrirItem(it) { if (it.tipo === 'nivel') abrirNivel(it.n); else abrirCriativo(it.i); }
function cliqueMapa(mx, my) {
  for (let k = 0; k < ITENS_MAPA.length; k++) {
    const it = ITENS_MAPA[k], g = it.tipo === 'nivel' ? geoMapa(it.n - 1) : geoCriativo(it.i);
    if (mx > g.x && mx < g.x + g.w && my > g.y - 6 && my < g.y + g.h + 6) { SES.selMapa = k; abrirItem(it); return; }

}
function teclaMapa(k, kc) {
  let s = SES.selMapa, n = ITENS_MAPA.length;
  if (kc === DOWN_ARROW) s = Math.min(n - 1, s + 1); else if (kc === UP_ARROW) s = Math.max(0, s - 1);
  else if (kc === RIGHT_ARROW) s = Math.min(n - 1, s + 4); else if (kc === LEFT_ARROW) s = Math.max(0, s - 4);
  else if (kc === ENTER || k === ' ') { abrirItem(ITENS_MAPA[s]); return true; } else return false;
  SES.selMapa = s;
  const it = ITENS_MAPA[s];
  anunciar(it.tipo === 'nivel' ? 'Nível ' + it.n + ': ' + NIVEIS[it.n - 1].titulo + (desbloqueado(it.n) ? '' : ' (bloqueado)')

}

async function avaliarCriativo(cr, codigo) {

  const [r, r380] = await Promise.all([
    correrIsolado(Object.assign({}, d, { harness: harnessCriativo(cr, cr.modo === 'js'), largura: cr.modo === 'css' ? 1000 : 800, altura: 900, timeout: 3000 })),
    precisa380 ? correrIsolado(Object.assign({}, d, { harness: harnessCriativo(cr, false), largura: 380, altura: 900, timeout: 3000 })) : Promise.resolve(null)
  ]);

      if (cr.modo === 'js' && !q.nao && (r.timeout || r.falha)) ok = false;
